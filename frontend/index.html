        }
      }

  </script>
  <style>
    body { font-family: 'Inter','Noto Sans Tamil',system-ui,sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Leaflet overrides */
    .leaflet-container { background: #e8e8e0 !important; font-family: 'Inter',sans-serif; }
    .leaflet-container.dark-map { background: #161b22 !important; filter: brightness(0.8) saturate(0.9); }
    .leaflet-control-zoom a { background: #fff !important; color: #2d8230 !important; border-color: #d6d6cb !important; }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .marker-pin { width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35); }
    .pin-red { background:#dc2626; animation: pinPulse 1.8s ease-in-out infinite; }
    .pin-green { background:#2d8230; }
    .pin-blue { background:#2563eb; }

    /* Animations */
    @keyframes pinPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    @keyframes scanline { from{top:8%} to{top:90%} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pulseRing {
      0%{box-shadow:0 0 0 0 rgba(58,158,61,0.5)}
      70%{box-shadow:0 0 0 20px rgba(58,158,61,0)}
      100%{box-shadow:0 0 0 0 rgba(58,158,61,0)}
    }
    @keyframes pulseRingRed {
      0%{box-shadow:0 0 0 0 rgba(220,38,38,0.5)}
      70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}
      100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}
    }
    @keyframes ticker { from{transform:translateX(100%)} to{transform:translateX(-100%)} }
    @keyframes droneFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes spreadRing { 0%{transform:scale(0);opacity:0.8} 100%{transform:scale(1);opacity:0} }
    @keyframes containRing { 0%{transform:scale(0.5);opacity:0} 30%{opacity:1} 100%{transform:scale(1.05);opacity:0.8} }
    @keyframes heroFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
    @keyframes waveGrow { from{width:0%} to{width:var(--target-w)} }
    @keyframes arcDraw { from{stroke-dashoffset:var(--arc-len)} to{stroke-dashoffset:var(--arc-end)} }
    @keyframes batteryPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes countUp { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
    @keyframes glowPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
    @keyframes stepReveal { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }

    /* Utilities */
    .scanline { position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#3a9e3d,transparent);animation:scanline 1.6s ease-in-out infinite alternate; }
    .tl-dot { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700; }
    ::-webkit-scrollbar { width:6px;height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#d6d6cb;border-radius:4px; }
    .dark-scroll::-webkit-scrollbar-thumb { background:#30363d; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .pressable:active { transform:scale(0.97); }
    .pressable { transition:transform .1s ease; }
    .glass { backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px); }
    .pulse-ring-anim { animation: pulseRing 2s ease-out infinite; }
    .pulse-ring-red { animation: pulseRingRed 1.5s ease-out infinite; }
    .drone-float { animation: heroFloat 4s ease-in-out infinite; }
    .spread-ring { animation: spreadRing 2s ease-out forwards; }
    .contain-ring { animation: containRing 2s ease-out forwards; }
    .step-reveal { animation: stepReveal 0.4s ease-out forwards; }

    /* Hero animated background */
    .hero-bg {
      background-color: #1a451e;
      background: linear-gradient(135deg, #0d2410 0%, #1a451e 30%, #1f5523 60%, #246828 100%);
      position: relative; overflow: hidden;
    }
    .hero-bg::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse at 20% 50%, rgba(58,158,61,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(87,212,90,0.1) 0%, transparent 50%);
    }
    .hero-grid {
      background-image: linear-gradient(rgba(58,158,61,0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(58,158,61,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Dark mode for Expert Console */
    .dark-panel { background: #161b22; color: #e6edf3; }
    .dark-panel .dark-card { background: #21262d; border-color: #30363d; }
    .dark-panel .dark-nav { background: #161b22; border-color: #21262d; }
    .dark-panel .dark-header { background: #161b22; border-color: #21262d; }
    .dark-panel .dark-text-primary { color: #e6edf3; }
    .dark-panel .dark-text-secondary { color: #8b949e; }
    .dark-panel .dark-text-accent { color: #58a6ff; }
    .dark-panel .dark-border { border-color: #30363d; }
    .dark-panel .dark-nav-item { color: #c9d1d9; }
    .dark-panel .dark-nav-item.active { background: rgba(58,158,61,0.15); color: #3fb950; border-right: 2px solid #3fb950; }
    .dark-panel .dark-nav-item:hover:not(.active) { background: #21262d; color: #e6edf3; }

    /* Phone frame */
    .phone-frame {
      background: #1a1a1a; border-radius: 44px; padding: 12px;
      box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
    }
    .phone-frame::before {
      content:''; position:absolute; top:18px; left:50%; transform:translateX(-50%);
      width:80px; height:6px; background:#333; border-radius:3px; z-index:10;
    }
    .phone-screen { border-radius:34px; overflow:hidden; background:#fff; position:relative; }

    /* Confidence arc */
    .conf-arc { transform: rotate(-90deg); transform-origin: center; }
    .conf-arc circle { transition: stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1); }

    /* Stat counter */
    .stat-counter { font-variant-numeric: tabular-nums; }

    /* Sparkline */
    .sparkline { position:relative; display:inline-flex; align-items:flex-end; gap:2px; height:32px; }
    .sparkline-bar { border-radius:2px 2px 0 0; transition: height 0.5s ease; }

    /* Event ticker */
    .ticker-wrap { overflow:hidden; white-space:nowrap; }
    .ticker-content { display:inline-block; animation:ticker 25s linear infinite; }

    /* Battery bar */
    .battery-bar { transition: width 1s ease, background-color 0.5s ease; }

    /* Containment success */
    .containment-success {
      background: radial-gradient(ellipse at center, rgba(58,158,61,0.2) 0%, transparent 70%);
      border: 2px solid rgba(58,158,61,0.5); border-radius: 50%;
      animation: containRing 2s ease-out forwards;
    }

    /* === WORLD-CLASS UPGRADE CSS === */

    /* Premium dark AgTech theme */
    :root {
      --agtech-bg: #040d08;
      --agtech-surface: #0a1a10;
      --agtech-card: #0f2318;
      --agtech-border: rgba(58,158,61,0.18);
      --agtech-glow: rgba(58,158,61,0.35);
      --agtech-accent: #22c55e;
      --agtech-accent2: #4ade80;
      --agtech-warn: #f59e0b;
      --agtech-danger: #ef4444;
      --agtech-text: #e2fce4;
      --agtech-muted: #aadbb0;
    }

    /* AgTech command-center body */
    .agtech-bg::-webkit-scrollbar { width: 6px; height: 6px; }
    .agtech-bg::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .agtech-bg::-webkit-scrollbar-thumb { background: rgba(34,197,94,0.3); border-radius: 4px; }
    .agtech-bg::-webkit-scrollbar-thumb:hover { background: rgba(34,197,94,0.5); }
    .agtech-bg { color: #e2fce4; font-family: 'Inter', 'Noto Sans Tamil', system-ui, sans-serif;
      background-color: #040d08;
      background: radial-gradient(ellipse at 10% 30%, rgba(34,197,94,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 70%, rgba(59,130,246,0.06) 0%, transparent 50%),
                  linear-gradient(160deg, #040d08 0%, #060f0a 40%, #04100c 100%);
      min-height: 100%;
    }

    /* AgTech glassmorphism card */
    .agtech-card {
      background-color: #0f2318;
      background: rgba(15, 35, 24, 0.95);
      border: 1px solid rgba(58,158,61,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #e2fce4;
    }

    /* Cyber grid overlay */
    .agtech-grid {
      background-image:
        linear-gradient(rgba(34,197,94,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Neon status badges */
    .badge-online { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .badge-warn   { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .badge-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

    /* Glowing primary button */
    .btn-glow {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white; font-weight: 700; border-radius: 12px;
      box-shadow: 0 0 24px rgba(34,197,94,0.4), 0 4px 12px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn-glow:hover { box-shadow: 0 0 36px rgba(34,197,94,0.6), 0 6px 16px rgba(0,0,0,0.4); transform: translateY(-1px); }
    .btn-glow:active { transform: scale(0.97); }

    /* Slider styling */
    input[type=range].agtech-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: rgba(34,197,94,0.2); border-radius: 4px; outline: none; }
    input[type=range].agtech-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      background: #22c55e; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(34,197,94,0.6); }

    /* Scanning animation for AI lab */
    @keyframes scanbeam { 0%{top:0%} 100%{top:96%} }
    .scan-beam { position:absolute; left:0; right:0; height:3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      animation: scanbeam 1.4s ease-in-out infinite alternate;
      box-shadow: 0 0 12px rgba(34,197,94,0.8); }

    /* Confidence bar */
    @keyframes barGrow { from{width:0} to{width:var(--bar-w)} }
    .conf-bar { animation: barGrow 1.2s cubic-bezier(0.4,0,0.2,1) forwards; }

    /* Drone lawnmower path */
    @keyframes droneMove { 0%{offset-distance:0%} 100%{offset-distance:100%} }
    .drone-path-anim { animation: droneMove 8s linear infinite; }

    /* Wind arrow rotation */
    @keyframes windSpin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* Glowing spread ring on map */
    @keyframes outbreakPulse { 0%{opacity:0.8;transform:scale(1)} 100%{opacity:0;transform:scale(2.2)} }
    .outbreak-pulse-anim { animation: outbreakPulse 2s ease-out infinite; }

    /* INR ticker */
    @keyframes numFlip { 0%{transform:translateY(-10px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    .num-flip { animation: numFlip 0.3s ease-out forwards; }

    /* Tab active indicator */
    .agtech-tab { border-bottom: 2px solid transparent; transition: all 0.2s ease; color: #c4e8ca; }
    .agtech-tab.active { border-bottom-color: #22c55e; color: #4ade80; }
    .agtech-tab:hover:not(.active) { color: #a3d9a8; }

    /* WhatsApp simulator */
    .whatsapp-bg { background: linear-gradient(180deg, #075e54 0%, #128c7e 100%); }
    .wa-bubble-in { background: #dcf8c6; color: #111; border-radius: 18px 18px 18px 4px; }
    .wa-bubble-out { background: #fff; color: #111; border-radius: 18px 18px 4px 18px; }

    /* IVR phone */
    .ivr-phone { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 2px solid #0f3460; border-radius: 24px; }
    @keyframes phonePulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)} 50%{box-shadow:0 0 0 12px rgba(34,197,94,0)} }
    .phone-calling { animation: phonePulse 1.5s ease-in-out infinite; }

    /* Lawnmower path on mini map */
    .path-segment { stroke-dasharray: 4 4; animation: dashMove 0.8s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -16; } }

    /* Judge tour highlight */
    .judge-highlight { border: 2px solid #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.3); border-radius: 12px; }
  </style>
</head>

    /* ─── Animated Counter ─── */
    function AnimatedCounter({ target, suffix='', prefix='', duration=1500 }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) {
            const start = Date.now();
            const tick = () => {
              const p = Math.min((Date.now() - start) / duration, 1);
              const ease = 1 - Math.pow(1 - p, 3);
              setVal(Math.round(ease * target));
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            obs.disconnect();
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [target]);
      return <span ref={ref} className="stat-counter">{prefix}{val.toLocaleString()}{suffix}</span>;
    }

    /* ─── Mini Sparkline ─── */
    function Sparkline({ data, color='#3a9e3d', height=32 }) {

      const max = Math.max(...data);
      const min = Math.min(...data);
      const range = max - min || 1;
      return (
        <div className="sparkline" style={{ height }}>
          {data.map((v, i) => {
            const h = Math.max(4, ((v - min) / range) * height);
            return (
              <div key={i} className="sparkline-bar w-2" style={{ height: h, background: i === data.length - 1 ? color : color + '70' }} />

          })}
        </div>

            strokeLinecap="round" strokeDasharray={`${filled} ${circ - filled}`}
            className="conf-arc" style={{ transformOrigin: '40px 40px', transform: 'rotate(-90deg)',
              transition: animated ? 'stroke-dasharray 1.5s cubic-bezier(0.4,0,0.2,1)' : 'none' }} />

                <span className="font-medium text-ink-700">FarmShield</span>

                <button onClick={onDemo} className="text-brand-600 font-medium hover:underline text-xs">Live Demo</button>
                <button onClick={onSandbox} className="text-green-600 font-medium hover:underline text-xs">Sandbox</button>

            <div className="text-center py-2 text-[10px] text-ink-400 border-t border-paper-100">

    /* ─────────────────── FARMER APP ─────────────────── */
    function FarmerApp({ lang, setLang, onExit }) {
      const t = k => tr(lang, k);
      const [tab, setTab] = useState('home');
      const [screen, setScreen] = useState(null);
      const [voiceState, setVoiceState] = useState('idle');
      const [toast, setToast] = useState(null);
      const [demoOutbreak, setDemoOutbreak] = useState(null);
      const [online, setOnline] = useState(navigator.onLine);
      const [simOffline, setSimOffline] = useState(false);
      const [queued, setQueued] = useState(pendingQueue.length);
      const [voiceGuide, setVoiceGuide] = useState(false);
      const [photo, setPhoto] = useState(null);
      const [scanRes, setScanRes] = useState(null);
      const [weather, setWeather] = useState(null);
      const fileRef = useRef(null);
      const timerRef = useRef(null);

      useEffect(() => { api('/api/outbreaks?status=active').then(o => setDemoOutbreak((o && o[0]) || null)); }, []);
      useEffect(() => { api('/api/weather').then(w => setWeather(w)); }, []);
      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

      const flushQueue = async () => {
        if (pendingQueue.length === 0) return;
        const items = pendingQueue.splice(0);
        saveQueue(); setQueued(0);
        let sent = 0;
        for (const item of items) {
          try {
            if (item.kind === 'crop_check') {
              const res = await fetch(API + '/api/detection/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ crop: item.crop, field_id: item.field_id }) });
              if (res.ok) {
                const det = await res.json();
                await fetch(API + `/api/detections/${det.detection_id}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                sent++;
              } else { pendingQueue.push(item); }
            } else {
              const res = await fetch(API + item.path, { method: item.method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item.body || {}) });
              if (res.ok) sent++; else pendingQueue.push(item);
            }
          } catch (e) { pendingQueue.push(item); }
        }
        saveQueue(); setQueued(pendingQueue.length);
        if (sent > 0) {
          showToast(t('syncedToast'));
          api('/api/outbreaks?status=active').then(o => setDemoOutbreak((o && o[0]) || null));
        }
      };
      const goOnline = () => { setOnline(true); flushQueue(); };
      const goOffline = () => setOnline(false);
      useEffect(() => {
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
      }, []);

      const voiceGuideRef = useRef(false);
      const speak = (text) => {
        if (!voiceGuideRef.current || !text) return;
        try { window.speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = lang === 'ta' ? 'ta-IN' : (lang === 'hi' ? 'hi-IN' : 'en-IN'); u.rate = 0.95; window.speechSynthesis.speak(u); } catch (e) {}
      };
      const toggleVoiceGuide = () => {
        const next = !voiceGuideRef.current;
        voiceGuideRef.current = next;
        setVoiceGuide(next);
        if (!next) { try { window.speechSynthesis.cancel(); } catch (e) {} return; }
        showToast(t('voiceGuideOn'));
        speak(t('homeGreetingVoice'));
      };

      useEffect(() => {
        if (!voiceGuide) return;
        if (screen === 'scan') speak(`${t('checkingCrop')}. ${t('analyzing')}`);
        else if (screen === 'result') speak(`${t('possiblePest')}. ${t('cropCotton')}. ${t('risk')}: ${t('riskHigh')}. 2.1 ${t('acres')}. ${t('recommend')}`);
        else if (screen === 'help') speak(`${t('needHelp')}. ${t('helpDesc')}`);
        else if (screen === 'helpDone') speak(`${t('helpRequested')}. ${t('helpQueued')}`);
      }, [screen, voiceGuide]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

      const startVoice = () => {
        // Text-to-speech: read the current alert aloud in the farmer's language
        if (!window.speechSynthesis) { showToast(t('voiceUnavailable')); return; }
        window.speechSynthesis.cancel();
        const langCode = lang === 'ta' ? 'ta-IN' : lang === 'hi' ? 'hi-IN' : lang === 'te' ? 'te-IN' : lang === 'kn' ? 'kn-IN' : lang === 'ml' ? 'ml-IN' : lang === 'mr' ? 'mr-IN' : 'en-IN';
        let msg;
        if (hasAlert && demoOutbreak) {
          msg = `${t('possiblePest')}. ${t('possibleIssue')} ${demoOutbreak.affected_area_acres} ${t('acres')}. ${t('risk')}: ${t('riskHigh')}. ${t('recommend')}`;
        } else {
          msg = `${t('healthy')}. ${t('cropCotton')} ${t('cropStatus')}.`;
        }
        const u = new SpeechSynthesisUtterance(msg);
        u.lang = langCode; u.rate = 0.9; u.pitch = 1.0;
        setVoiceState('listening');
        u.onend = () => setVoiceState('idle');
        u.onerror = () => setVoiceState('idle');
        window.speechSynthesis.speak(u);
      };

      const onPhotoPicked = (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        const rd = new FileReader();
        rd.onload = () => { setPhoto(String(rd.result)); setScanRes(null); setScreen('scan'); };
        rd.readAsDataURL(f);
      };
      const photoInput = <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onPhotoPicked} />;
      const beginCheck = () => { if (fileRef.current) fileRef.current.click(); };

      useEffect(() => {
        if (screen === 'scan') {
          let alive = true;
          if (!photo) { setScreen(null); return; }
          if (!online || simOffline) {
            pendingQueue.push({ kind: 'crop_check', crop: 'Cotton', field_id: 3, saved_at: new Date().toISOString() });
            saveQueue(); setQueued(pendingQueue.length);
            setScreen('offlineSaved'); return;
          }
          (async () => {
            try {
              const fd = new FormData();
              fd.append('crop', 'Cotton'); fd.append('field_id', '3');
              const bin = atob(photo.split(',')[1]);
              const buf = new Uint8Array(bin.length);
              for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
              fd.append('file', new Blob([buf], { type: 'image/jpeg' }), 'leaf.jpg');
              const res = await fetch(API + '/api/detection/analyze-image', { method: 'POST', body: fd });
              if (!alive) return;
              if (!res.ok) throw new Error('analyze failed');
              const det = await res.json();
              if (!alive) return;
              if (det.mode === 'VISUAL_CHECK') { setScanRes(det); setScreen('retake'); return; }
              if (det.healthy === true) { setScanRes(det); setScreen('healthy'); return; }
              setScanRes(det);
              if (det.detection_id) {
                await fetch(API + `/api/detections/${det.detection_id}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
              }
              await sleep(1800);
              if (alive) setScreen('result');
            } catch (e) {
              if (!alive) return;
              pendingQueue.push({ kind: 'crop_check', crop: 'Cotton', field_id: 3, saved_at: new Date().toISOString() });
              saveQueue(); setQueued(pendingQueue.length);
              setScreen('offlineSaved');
            }
          })();
          return () => { alive = false; };
        }
      }, [screen]);

      const requestHelp = async () => {
        await api('/api/outbreaks?status=active');
        setScreen('helpDone');
      };

      /* Screen: Scan */
      if (screen === 'scan') return (
        <div className="h-full flex flex-col bg-white">
          <TopBar title={t('checkingCrop')} onBack={() => setScreen(null)} />
          <div className="flex-1 flex flex-col items-center justify-center px-8 space-y-6">
            <div className="relative w-52 h-52 rounded-app border border-paper-200 bg-paper-50 overflow-hidden flex items-center justify-center">
              {photo ? <img src={photo} alt="" className="absolute inset-0 w-full h-full object-cover"/> : <span className="text-brand-500">{I.leaf('w-16 h-16')}</span>}
              <div className="scanline"></div>
            </div>
            <p className="text-ink-700 font-medium">{t('analyzing')}</p>
            <div className="w-48 h-1.5 bg-paper-200 rounded-full overflow-hidden">
              <div className="h-full bg-brand-500 rounded-full" style={{width:'65%', transition:'width 0.3s', animation:'waveGrow 2s linear infinite'}}></div>
            </div>
            <p className="text-xs text-ink-400">Real CNN inference · PlantVillage MobileNetV2</p>
          </div>
        </div>
      );

      /* Screen: Result */
      if (screen === 'result') {
        const r = scanRes || { crop: 'Cotton', possible_pest: 'Possible Bollworm', severity: 'High', affected_area_acres: 2.1, confidence: 0.94, mode: 'DEMO_SIMULATION' };
        const sevCls = r.severity === 'High' ? 'text-red-600' : (r.severity === 'Medium' ? 'text-amber2-500' : 'text-brand-600');
        const sevTxt = r.severity === 'High' ? t('riskHigh') : (r.severity === 'Medium' ? (lang === 'ta' ? 'நடுத்தரம்' : 'Medium') : (lang === 'ta' ? 'குறைவு' : 'Low'));
        return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('possiblePest')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <div className="flex items-center gap-2 text-amber2-500 mb-4">
                {I.alert('w-5 h-5')}
                <span className="font-semibold text-sm">{t('possiblePest')}</span>
              </div>
              <div className="flex items-center justify-between mb-4">
                {photo && <img src={photo} alt="" className="w-28 h-28 object-cover rounded-xl border border-paper-200"/>}
                <div className="flex flex-col items-center ml-4">
                  <p className="text-xs text-ink-400 mb-1 font-medium">Detection confidence</p>
                  <ConfidenceArc confidence={r.confidence || 0.94} size={80} />
                </div>
              </div>
              <div className="space-y-3">
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('crop')}</span><span className="font-semibold">{lang === 'ta' && r.crop === 'Cotton' ? t('cropCotton') : r.crop}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('possibleIssueLabel')}</span><span className="font-semibold">{lang === 'ta' && r.possible_pest === 'Possible Bollworm' ? t('possibleIssue') : r.possible_pest}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('risk')}</span><span className={`font-semibold ${sevCls}`}>{sevTxt}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('affectedArea')}</span><span className="font-semibold">{r.affected_area_acres} {t('acres')}</span></div>
              </div>
              {r.mode === 'REAL_MODEL' && <p className="mt-3 text-xs text-ink-400">{t('realModelNote')}</p>}
              {r.mode === 'DEMO_SIMULATION' && <p className="mt-3 text-xs text-amber2-500 bg-amber2-50 rounded-lg px-2 py-1">Prototype Simulation — not a real photo analysis</p>}
            </div>
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <h3 className="font-semibold text-ink-800 mb-1">{t('whatToDo')}</h3>
              <p className="text-sm text-ink-500 mb-4">{t('recommend')}</p>
              <PrimaryButton onClick={() => setScreen('help')}>{t('getHelp')}</PrimaryButton>
            </div>
          </div>
        </div>
        );
      }

      /* Screen: Healthy */
      if (screen === 'healthy') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('healthyResult')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-5">{I.check('w-8 h-8')}</div>
            {photo && <img src={photo} alt="" className="w-40 h-40 object-cover rounded-app border border-paper-200 mb-4"/>}
            <h2 className="text-lg font-semibold text-ink-800">{t('healthyResult')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('healthyDesc')}</p>
            <button onClick={beginCheck} className="mt-6 px-5 py-3 rounded-app bg-brand-50 text-brand-700 font-semibold text-sm border border-paper-200">{t('checkAnother')}</button>
          </div>
        </div>
      );

      /* Screen: Retake */
      if (screen === 'retake') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('photoUnclear')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-amber2-100 text-amber2-500 flex items-center justify-center mb-5">{I.camera('w-8 h-8')}</div>
            {photo && <img src={photo} alt="" className="w-40 h-40 object-cover rounded-app border border-paper-200 mb-4 opacity-60"/>}
            <h2 className="text-lg font-semibold text-ink-800">{t('photoUnclear')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('retakeDesc')}</p>
            <div className="mt-6 w-full px-4"><PrimaryButton onClick={beginCheck}>{t('retake')}</PrimaryButton></div>
          </div>
        </div>
      );

      /* Screen: Help */
      if (screen === 'help') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('needHelp')} onBack={() => setScreen('result')} />
          <div className="flex-1 p-4">
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <p className="text-sm text-ink-500 mb-5">{t('helpDesc')}</p>
              <PrimaryButton onClick={requestHelp}>{t('requestHelp')}</PrimaryButton>
            </div>
          </div>
        </div>
      );

      /* Screen: Offline Saved */
      if (screen === 'offlineSaved') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('savedOffline')} onBack={() => setScreen(null)} />
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-amber2-100 text-amber2-500 flex items-center justify-center mb-5">{I.uploadCloud('w-8 h-8')}</div>
            <h2 className="text-lg font-semibold text-ink-800">{t('savedOffline')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('offlineQueued')}</p>
            <button onClick={() => setScreen(null)} className="mt-8 text-brand-600 font-semibold text-sm">{t('home')}</button>
          </div>
        </div>
      );

      /* Screen: Help Done */
      if (screen === 'helpDone') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('helpRequested')} onBack={() => setScreen(null)} />
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-5 pulse-ring-anim">{I.check('w-8 h-8')}</div>
            <h2 className="text-lg font-semibold text-ink-800">{t('helpRequested')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('helpQueued')}</p>
            <button onClick={() => setScreen(null)} className="mt-8 text-brand-600 font-semibold text-sm">{t('home')}</button>
          </div>
        </div>
      );

      /* Main app with tabs */
      const hasAlert = !!demoOutbreak;
      const pestRisk = weather ? (weather.pest_risk) : null;
      const riskColor = pestRisk === 'HIGH' ? 'text-red-600 bg-red-50' : pestRisk === 'MODERATE' ? 'text-amber2-500 bg-amber2-50' : 'text-brand-600 bg-brand-50';

      return (
        <div className="h-full relative bg-paper-100 max-w-md mx-auto sm:border-x sm:border-paper-200">
          {photoInput}
          {toast && (
            <div role="status" aria-live="polite" className="absolute top-3 inset-x-4 z-50 bg-ink-800 text-white text-sm rounded-app px-4 py-3 shadow-raised">{toast}</div>
          )}
          <div className="absolute inset-0 bottom-14 overflow-y-auto no-scrollbar">
            {tab === 'home' && <FarmerHome t={t} lang={lang} setLang={setLang} hasAlert={hasAlert} beginCheck={beginCheck} startVoice={startVoice} voiceState={voiceState} onExit={onExit} demoOutbreak={demoOutbreak} online={online} queued={queued} voiceGuide={voiceGuide} toggleVoiceGuide={toggleVoiceGuide} weather={weather} pestRisk={pestRisk} riskColor={riskColor} />}
            {tab === 'farm' && <FarmerFarm t={t} hasAlert={hasAlert} />}
            {tab === 'alerts' && <FarmerAlerts t={t} demoOutbreak={demoOutbreak} />}
            {tab === 'profile' && <FarmerProfile t={t} lang={lang} setLang={setLang} online={online} simOffline={simOffline} setSimOffline={v => { setSimOffline(v); if (v) setOnline(false); else { setOnline(true); flushQueue(); } }} />}
          </div>
          <BottomNav tab={tab} setTab={setTab} lang={lang} />
        </div>
      );
    }

      return (
        <div>
          <div className="bg-white border-b border-paper-200 px-4 pt-4 pb-4">
            <div className="flex items-center justify-between mb-4">
              <div className="flex items-center gap-2">
                <span className="text-brand-600">{I.shield('w-5 h-5')}</span>
                <span className="font-bold text-ink-800">FarmShield</span>
              </div>

                  className={`p-1.5 rounded-lg ${voiceGuide ? 'text-brand-600 bg-brand-50' : 'text-ink-400 hover:bg-paper-100'}`}>

              </div>
            </div>
            <p className="text-sm text-ink-400">{t('greeting')}</p>
            <h1 className="text-xl font-bold text-ink-800 mt-0.5">{t('myFarm')}</h1>
            <p className="text-xs text-ink-400 mt-1 flex items-center gap-1">{I.mapPin('w-3.5 h-3.5')} {t('location')} · 2.1 {t('acres')}</p>
            {!online && (
              <div className="mt-3 flex items-center gap-2 text-xs text-amber2-500 bg-amber2-100 rounded-lg px-3 py-2" role="status">

              </div>

          <div className="p-4 space-y-4 pb-6">
            {/* Weather advisory */}

              <div className={`rounded-app border px-4 py-3 flex items-center justify-between ${pestRisk === 'HIGH' ? 'bg-red-50 border-red-200' : 'bg-white border-paper-200'}`}>

              <div className="bg-white rounded-app border border-paper-200 shadow-card p-4 border-l-4 border-l-red-500">

                <p className="text-sm text-ink-600">{demoOutbreak ? `${t('possibleIssue')} · ${demoOutbreak.affected_area_acres} ${t('acres')}` : `2.1 ${t('acres')}`} · {t('highRisk')}</p>
                <button onClick={beginCheck} className="mt-3 text-sm font-semibold text-brand-600">{t('checkCrop')} →</button>

            ) : (
              <div className="bg-white rounded-app border border-paper-200 shadow-card p-4">
                <div className="flex items-center gap-2 text-brand-600 mb-1">{I.check('w-5 h-5')}<span className="font-semibold text-sm">{t('cropStatus')}</span></div>
                <p className="text-lg font-semibold text-ink-800">{t('healthy')}</p>
              </div>

            {/* Primary action */}
            <button onClick={beginCheck}
              className="w-full bg-brand-600 text-white rounded-app py-4 px-5 flex items-center gap-4 shadow-card pressable text-left">

    /* ─────────────────── LIVE DEMO (upgraded split-screen) ─────────────────── */
    function LiveDemo({ onExit, onExpert, lang }) {
      const t = k => tr(lang || 'en', k);
      const [stage, setStage] = useState(-1);
      const [elapsed, setElapsed] = useState(0);
      const [running, setRunning] = useState(false);
      const [error, setError] = useState(null);
      const [done, setDone] = useState(false);
      const [data, setData] = useState({});
      const [events, setEvents] = useState([]);
      const [showEvents, setShowEvents] = useState(true);
      const [containment, setContainment] = useState(false);
      const [litresSaved, setLitresSaved] = useState(0);
      const [litresTimer, setLitresTimer] = useState(null);
      const mapEl = useRef(null);
      const mapRef = useRef(null);
      const timerRef = useRef(null);
      const evLogRef = useRef(null);

      useEffect(() => {
        if (running) timerRef.current = setInterval(() => setElapsed(e => e + 1), 1000);
        else if (timerRef.current) { clearInterval(timerRef.current); timerRef.current = null; }
        return () => { if (timerRef.current) clearInterval(timerRef.current); };
      }, [running]);

      useEffect(() => {
        if (evLogRef.current) evLogRef.current.scrollTop = evLogRef.current.scrollHeight;
      }, [events]);

      const fmt = s => `${String(Math.floor(s / 60)).padStart(2,'0')}:${String(s % 60).padStart(2,'0')}`;

      /* Map init */
      useEffect(() => {
        if (!mapEl.current || mapRef.current) return;
        const map = L.map(mapEl.current, { zoomControl: false, attributionControl: false });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        map.setView([10.7905, 78.7047], 15);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        mapRef.current = map;
        L.polygon([[10.798,78.695],[10.798,78.705],[10.792,78.705],[10.792,78.695]], { color:'#3a9e3d', weight:2, fillOpacity:0.12 }).addTo(map).bindTooltip('North Cotton Block');
        L.polygon([[10.793,78.705],[10.793,78.715],[10.787,78.715],[10.787,78.705]], { color:'#3a9e3d', weight:2, fillOpacity:0.12 }).addTo(map).bindTooltip('East Mixed Plot');
        return () => { if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; } };
      }, []);

      const markOutbreak = (lat, lng, acres) => {
        if (!mapRef.current) return;
        const icon = L.divIcon({ html: `<div class="marker-pin pin-red"></div>`, iconSize:[18,18], iconAnchor:[9,9], className:'' });
        L.marker([lat, lng], { icon }).addTo(mapRef.current).bindPopup(`<b>🔴 Outbreak zone</b><br>${acres} acres · High risk`);
        const circle = L.circle([lat, lng], { radius: acres*100, color:'#dc2626', weight:1, fillOpacity:0.10 }).addTo(mapRef.current);
        mapRef.current.flyTo([lat, lng], 16, { duration: 1.2 });
      };

      const addContainmentRing = (lat, lng) => {
        if (!mapRef.current) return;
        const circle = L.circle([lat, lng], { radius: 200, color:'#3a9e3d', weight:3, fillOpacity:0.08, dashArray:'6 4' }).addTo(mapRef.current);
      };

      const moveAgent = (from, to, agentName) => {
        if (!mapRef.current) return null;
        const icon = L.divIcon({ html: `<div style="font-size:20px;filter:drop-shadow(0 0 6px #3a9e3d)">🛩️</div>`, iconSize:[24,24], iconAnchor:[12,12], className:'' });
        const m = L.marker(from, { icon }).addTo(mapRef.current).bindTooltip(agentName);
        const line = L.polyline([from, to], { color:'#3a9e3d', weight:2, dashArray:'4 6' }).addTo(mapRef.current);
        const steps = 40; let i = 0;
        const iv = setInterval(() => {
          i++;
          const p = i / steps;
          m.setLatLng([from[0] + (to[0]-from[0])*p, from[1] + (to[1]-from[1])*p]);
          if (i >= steps) { clearInterval(iv); }
        }, 75);
        return m;
      };

      const resetAll = async () => {
        setRunning(false); setStage(-1); setElapsed(0); setError(null); setData({}); setEvents([]); setContainment(false); setLitresSaved(0);
        if (litresTimer) { clearInterval(litresTimer); setLitresTimer(null); }
        if (mapRef.current) { mapRef.current.remove(); mapRef.current = null; }
        await api('/api/demo/reset', { method: 'POST' });
        setTimeout(() => { if (mapEl.current && !mapRef.current) {
          const map = L.map(mapEl.current, { zoomControl: false, attributionControl: false });
          L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
          map.setView([10.7905, 78.7047], 15);
          L.control.zoom({ position: 'bottomright' }).addTo(map);
          mapRef.current = map;
          L.polygon([[10.798,78.695],[10.798,78.705],[10.792,78.705],[10.792,78.695]], { color:'#3a9e3d', weight:2, fillOpacity:0.12 }).addTo(map);
          L.polygon([[10.793,78.705],[10.793,78.715],[10.787,78.715],[10.787,78.705]], { color:'#3a9e3d', weight:2, fillOpacity:0.12 }).addTo(map);
        } }, 60);
      };

      const run = async () => {
        if (running) return;
        setError(null); setRunning(true); setStage(0); setElapsed(0); setEvents([]); setData({}); setDone(false); setContainment(false); setLitresSaved(0);
        if (litresTimer) clearInterval(litresTimer);
        const ev = (a, m, icon='') => setEvents(p => [...p, { time: new Date().toLocaleTimeString('en-US',{hour12:false}), a, m, icon }]);
        try {
          await api('/api/demo/reset', { method: 'POST' });
          await sleep(800);

          // Stage 1: Detect
          ev('Detection Agent', 'Scanning East Mixed Plot — multispectral anomaly at coords 10.790°N 78.710°E', '🔍');
          const det = await api('/api/detection/analyze', { method:'POST', body: JSON.stringify({ crop:'Cotton', field_id:3 }) });
          if (!det) throw new Error('detect');
          const conf = await api(`/api/detections/${det.detection_id}/confirm`, { method:'POST' });
          if (!conf) throw new Error('confirm');
          markOutbreak(det.latitude, det.longitude, det.affected_area_acres);
          ev('Detection Agent', `⚠ OUTBREAK FLAGGED — Bollworm, ${(det.confidence*100).toFixed(0)}% confidence, ${det.affected_area_acres} acres`, '🔴');
          await sleep(2500);

          // Stage 2: Predict
          setStage(1);
          const obs = await api('/api/outbreaks?status=active');
          const ob = (obs||[]).find(o => o.id === conf.outbreak_id) || (obs||[])[0];
          // spread/calculate is non-fatal — demo continues even if unavailable
          const spread = await api('/api/spread/calculate', { method:'POST', body: JSON.stringify({ temperature:29, humidity:78, wind_speed:11, base_acres:2.1 }) }).catch(() => null);
          setData(d => ({ ...d, ob, spread }));
          ev('Prediction Agent', 'Degree-day logistic growth model: 29°C · 78% RH · 11 kph wind', '🌡️');
          ev('Prediction Agent', `Spread curve: 2.1 → 3.2 → 5.5 → 8.7 → 14.2 acres in 24h  [±15% band]`, '📈');
          await sleep(2500);

          // Stage 3: Select
          setStage(2);
          const sel = await api('/api/dispatch/select', { method:'POST', body: JSON.stringify({ outbreak_id: conf.outbreak_id }) });
          if (!sel || !sel.selected) throw new Error('Dispatch engine returned no candidates. Check /api/dispatch/select.');
          const cand = (sel.candidates||[]).find(c => c.id === sel.selected);
          const mission = await api('/api/missions', { method:'POST', body: JSON.stringify({ outbreak_id: conf.outbreak_id, agent_id: sel.selected }) });
          if (!mission) throw new Error('Mission creation failed. Check /api/missions POST.');
          setData(d => ({ ...d, sel, cand, mission }));
          ev('Dispatch Engine', `Evaluating ${(sel.candidates||[]).length} agents — scoring by travel time × battery × payload`, '⚙️');
          ev('Dispatch Engine', `DRONE-03 selected: ${cand ? cand.distance_km : '2.3'} km · ~3 min · ${cand ? cand.battery : '100'}% battery · 6.0L payload`, '✅');
          if ((sel.candidates||[]).find(c => c.battery < 50)) ev('Dispatch Engine', `DRONE-04 skipped — battery 35% (charging). System gated correctly.`, '⚡');
          await sleep(1500);

          // Stage 4: En route
          setStage(3);
          ev('Mission Controller', `Mission ${mission.mission_code} created — target: 2.1 acres precision zone`, '📋');
          await api(`/api/missions/${mission.mission_id}/status?action=dispatch`, { method:'POST' });
          const agents = (await api('/api/agents')||[]);
          const agent = agents.find(a => a.id === sel.selected);
          const from = agent ? [agent.latitude, agent.longitude] : [10.785, 78.690];
          moveAgent(from, [det.latitude, det.longitude], cand ? cand.name : 'DRONE-03');
          ev('Drone Agent', `${cand ? cand.name : 'DRONE-03'} airborne → target coordinates`, '🛩️');
          await sleep(1000);
          await api(`/api/missions/${mission.mission_id}/status?action=arrive`, { method:'POST' });
          ev('Drone Agent', 'Arrived at treatment zone — hovering at 15m, confirming coordinates', '📍');
          await sleep(1500);

          // Stage 5: Treat
          setStage(4);
          await api(`/api/missions/${mission.mission_id}/status?action=treat`, { method:'POST' });
          ev('Treatment Agent', 'Precision spray started — Chlorantraniliprole (IRAC Group 28) · 1.8L target', '💧');
          // Animate litre counter
          const totalSaved = 8.4 - 1.8;
          const savedTimer = setInterval(() => {
            setLitresSaved(v => { const next = Math.min(v + 0.15, totalSaved); return Math.round(next * 10) / 10; });
          }, 200);
          setLitresTimer(savedTimer);
          await sleep(2800);
          clearInterval(savedTimer);
          setLitresSaved(totalSaved);
          await api(`/api/missions/${mission.mission_id}/status?action=complete`, { method:'POST' });
          ev('Treatment Agent', '✓ Treatment complete — 2.1 acres, 1.8L precision vs 8.4L conventional (−78.6%)', '✅');
          await sleep(1000);

          // Stage 6: Contain
          setStage(5);
          setContainment(true);
          addContainmentRing(det.latitude, det.longitude);
          ev('Mission Controller', '🟢 OUTBREAK CONTAINED — OUT-' + String(conf.outbreak_id).padStart(4,'0'), '🟢');
          ev('Notification Agent', 'Farmer SMS sent in Tamil language', '📱');
          setDone(true);
          await sleep(1200);
        } catch (e) {
          console.error('Demo error:', e.message);
          setError(e.message || 'demo');
        } finally { setRunning(false); }
      };

      const steps = [
        { key: 'detect', label: t('s1'), busy: t('detecting'), icon: '🔍' },
        { key: 'predict', label: t('s2'), busy: t('predicting'), icon: '📈' },
        { key: 'select', label: t('s3'), busy: t('dispatching'), icon: '⚙️' },
        { key: 'route', label: t('s4'), busy: null, icon: '🛩️' },
        { key: 'treat', label: t('s5'), busy: t('treating'), icon: '💧' },
        { key: 'contain', label: t('s6'), busy: t('containing'), icon: '🟢' },
      ];
      const stepIndex = stage < 0 ? -1 : stage;
      const ob = data.ob || {};
      const sel = data.sel || {};
      const cand = data.cand || {};
      const mission = data.mission || {};
      const spread = data.spread || {};

      return (
        <div className="h-full bg-paper-100 flex flex-col">
          <div className="bg-white border-b border-paper-200 px-4 py-3 flex items-center gap-3 shrink-0">
            {!running && <button onClick={onExit} className="p-1.5 rounded-lg text-ink-400 hover:bg-paper-100">{I.arrowLeft('w-5 h-5')}</button>}
            <span className="text-brand-600">{I.shield('w-5 h-5')}</span>
            <div className="flex-1">
              <div className="font-semibold text-ink-800">FarmShield Live Demo</div>
              <div className="text-xs text-ink-400">{t('demoFarm')}</div>
            </div>
            <span className="font-mono text-sm text-ink-600 bg-paper-100 border border-paper-200 rounded-md px-2 py-1">{fmt(elapsed)}</span>
            <button onClick={onExpert} className="hidden md:block text-xs font-semibold text-ink-500 border border-paper-200 rounded-lg px-2 py-1.5 hover:bg-paper-50">{I.wrench('w-4 h-4 inline mr-1')}Expert Console</button>
          </div>

          {/* Split layout: map + panel */}
          <div className="flex-1 flex overflow-hidden">
            {/* Map */}
            <div className="flex-1 relative min-w-0">
              <div ref={mapEl} className="absolute inset-0" />
              {/* Containment success overlay */}
              {containment && (
                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-[1000] bg-brand-600 text-white px-4 py-2 rounded-full font-semibold text-sm shadow-glow step-reveal flex items-center gap-2">
                  <span>🟢</span> Outbreak Contained!
                </div>
              )}
              {/* Live savings badge */}
              {litresSaved > 0 && (
                <div className="absolute bottom-4 left-4 z-[1000] bg-white border border-brand-200 rounded-app px-3 py-2 shadow-card">
                  <div className="text-xs text-ink-400">Pesticide saved</div>
                  <div className="text-lg font-black text-brand-600">{litresSaved.toFixed(1)} L</div>
                </div>
              )}
            </div>

            {/* Right panel */}
            <div className="w-80 shrink-0 flex flex-col overflow-hidden bg-paper-50 border-l border-paper-200">
              {/* Outbreak summary */}
              <div className="bg-white border-b border-paper-200 p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <h2 className="font-bold text-ink-800 text-sm">{t('outbreakTitle')}</h2>
                    <p className="text-xs text-ink-500 mt-0.5">2.1 acres · High risk · 29°C · 78% RH</p>
                  </div>
                  <span className="text-xs font-semibold bg-amber2-100 text-amber2-500 px-2 py-0.5 rounded-full flex-shrink-0">Demo</span>
                </div>
                {/* Spread prediction mini chart */}
                {spread.predictions && (
                  <div className="mt-3 pt-3 border-t border-paper-100">
                    <p className="text-[10px] text-ink-400 font-semibold uppercase tracking-wide mb-2">Predicted Spread (acres)</p>
                    <div className="flex items-end gap-1 h-10">
                      {spread.predictions.map((p, i) => {
                        const maxA = spread.predictions[spread.predictions.length-1].area;
                        const h = Math.max(4, (p.area / maxA) * 36);
                        const colors = ['#3a9e3d','#7ab33d','#d97706','#e05d3d','#dc2626'];
                        return (
                          <div key={p.hours} className="flex-1 flex flex-col items-center gap-0.5">
                            <div className="rounded-sm w-full" style={{ height: h, background: colors[i] }}></div>
                            <div className="text-[8px] text-ink-400">{p.hours === 0 ? 'Now' : `+${p.hours}h`}</div>
                          </div>
                        );
                      })}
                    </div>
                    <p className="text-[9px] text-ink-400 mt-1">Prototype AI Simulation · ±15% band</p>
                  </div>
                )}
              </div>

              {/* Timeline */}
              <div className="flex-1 overflow-y-auto p-3">
                <p className="text-[10px] font-semibold text-ink-400 uppercase tracking-wide mb-2">{t('responseProgress')}</p>
                <div className="space-y-0">
                  {steps.map((s, i) => {
                    const isDone = stepIndex > i || done;
                    const isNow = stepIndex === i && !done;
                    return (
                      <div key={s.key} className="flex gap-2.5">
                        <div className="flex flex-col items-center">
                          <div className={`tl-dot text-sm ${isDone ? 'bg-brand-600 text-white' : isNow ? 'bg-brand-100 text-brand-700 border border-brand-300' : 'bg-paper-100 text-ink-400 border border-paper-200'}`}>
                            {isDone ? '✓' : s.icon}
                          </div>
                          {i < steps.length - 1 && <div className={`w-px flex-1 min-h-[20px] ${isDone ? 'bg-brand-400' : 'bg-paper-200'}`}></div>}
                        </div>
                        <div className={`pb-3 flex-1 ${i === steps.length - 1 ? 'pb-0' : ''}`}>
                          <p className={`text-sm font-medium ${isDone ? 'text-ink-800' : isNow ? 'text-brand-700 font-semibold' : 'text-ink-400'}`}>
                            {s.label}
                            {isNow && s.busy && <span className="ml-1 text-xs font-normal text-ink-400 animate-pulse">{s.busy}</span>}
                          </p>
                          {s.key === 'predict' && isDone && spread.predictions && (
                            <p className="text-xs text-ink-400 mt-0.5">2.1 → 14.2 acres in 24h · growth rate {spread.growth_rate}</p>
                          )}
                          {s.key === 'select' && isDone && cand && cand.name && (
                            <p className="text-xs text-ink-400 mt-0.5">{cand.name} · {cand.battery}% battery · {cand.distance_km} km</p>
                          )}
                          {s.key === 'treat' && isDone && (
                            <p className="text-xs text-brand-600 font-medium mt-0.5">8.4L → 1.8L precision (−78.6%)</p>
                          )}
                          {s.key === 'contain' && isDone && (
                            <p className="text-xs text-brand-600 font-medium mt-0.5">Farmer notified via SMS (Tamil)</p>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Event log */}
                {events.length > 0 && (
                  <div className="mt-3 pt-3 border-t border-paper-200">
                    <button onClick={() => setShowEvents(s => !s)} className="flex items-center justify-between w-full text-[10px] font-semibold text-ink-400 uppercase tracking-wide mb-2">
                      <span>System Events ({events.length})</span>
                      {I.chevron(`w-3 h-3 transition-transform ${showEvents ? 'rotate-90' : ''}`)}
                    </button>
                    {showEvents && (
                      <div ref={evLogRef} className="max-h-48 overflow-y-auto space-y-1 dark-scroll">
                        {events.map((e, i) => (
                          <div key={i} className="flex gap-2 text-[10px]">
                            <span className="text-ink-400 font-mono shrink-0">{e.time}</span>
                            <span className="text-brand-600 font-semibold shrink-0 w-16 truncate">{e.a.split(' ')[0]}</span>
                            <span className="text-ink-600 leading-tight">{e.m}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Controls */}
              <div className="p-3 border-t border-paper-200 bg-white space-y-2">
                {error && (
                  <div className="bg-red-50 border border-red-200 rounded-app p-3 text-center">
                    <p className="text-sm text-red-700">Demo service unavailable</p>
                    <button onClick={run} className="mt-2 px-4 py-1.5 bg-red-600 text-white rounded-app text-xs font-semibold">Retry</button>
                  </div>
                )}
                <div className="flex gap-2">
                  {!done ? (
                    <button onClick={run} disabled={running}
                      className="flex-1 py-3 rounded-app bg-brand-600 text-white font-semibold text-sm pressable disabled:opacity-50 flex items-center justify-center gap-2">
                      {running ? <><span className="animate-pulse">●</span> {t('running')}</> : <>{I.play('w-4 h-4')} {t('startDemo')}</>}
                    </button>
                  ) : (
                    <button onClick={run} className="flex-1 py-3 rounded-app bg-brand-600 text-white font-semibold text-sm pressable">
                      {t('runAgain')}
                    </button>
                  )}
                  <button onClick={resetAll} disabled={running}
                    className="px-3 py-3 rounded-app bg-white border border-paper-300 text-ink-600 pressable disabled:opacity-50">
                    {I.refresh('w-4 h-4')}
                  </button>
                </div>
                {done && (
                  <button onClick={onExpert} className="w-full py-2.5 rounded-app bg-white border border-paper-300 text-ink-700 font-semibold text-sm pressable flex items-center justify-center gap-2">
                    {I.wrench('w-4 h-4 text-ink-400')} View autonomous system →
                  </button>
                )}
                <p className="text-center text-[10px] text-ink-400">{t('prototypeNote')}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────── EXPERT CONSOLE ─────────────────── */
    function ExpertConsole({ onFarmer, onDemo }) {
      const [page, setPage] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(true);
      const [outbreaks, setOutbreaks] = useState([]);
      const [agents, setAgents] = useState([]);
      const [missions, setMissions] = useState([]);
      const [events, setEvents] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [fields, setFields] = useState([]);
      const [health, setHealth] = useState(null);
      const [scanResult, setScanResult] = useState(null);
      const [scanImage, setScanImage] = useState(null);
      const [scanning, setScanning] = useState(false);
      const [sampleFields, setSampleFields] = useState([]);
      const [rotation, setRotation] = useState(null);
      const [resistanceResult, setResistanceResult] = useState(null);
      const [resistancePest, setResistancePest] = useState('Bollworm');
      const [resistanceCrop, setResistanceCrop] = useState('Cotton');
      const [resistanceApps, setResistanceApps] = useState(0);
      const [waypointMission, setWaypointMission] = useState(null);
      const [waypointData, setWaypointData] = useState(null);
      const [weather, setWeather] = useState(null);
      const [tickerText, setTickerText] = useState('');
      const logRef = useRef(null);
      const mapRef = useRef(null);
      const mapEl = useRef(null);
      const layersRef = useRef([]);

      const load = useCallback(async () => {
        const [o, a, m, e, an, f, h, w, rot] = await Promise.all([
          api('/api/outbreaks'), api('/api/agents'), api('/api/missions'),
          api('/api/events?limit=80'), api('/api/analytics'), api('/api/fields'),
          api('/api/health'), api('/api/weather'), api('/api/chemical-rotation'),
        ]);
        if (o) setOutbreaks(o); if (a) setAgents(a); if (m) setMissions(m);
        if (e) { setEvents(e.reverse()); }
        if (an) setAnalytics(an); if (f) setFields(f); if (h) setHealth(h);
        if (w) setWeather(w); if (rot) setRotation(rot);
      }, []);

      useEffect(() => { load(); }, [load]);
      useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [events]);

      // Build ticker text from events
      useEffect(() => {
        if (events.length > 0) {
          const recent = events.slice(-8).map(e => `[${e.agent_name}] ${e.message}`).join('  ·  ');
          setTickerText(recent);
        }
      }, [events]);

      useEffect(() => {
        if (page !== 'map' || !mapEl.current) return;
        if (mapRef.current) { setTimeout(() => mapRef.current.invalidateSize(), 50); return; }
        const map = L.map(mapEl.current, { zoomControl: false, attributionControl: false });
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        map.setView([10.79, 78.705], 15);
        mapRef.current = map;
        return () => {};
      }, [page]);

      useEffect(() => {
        const map = mapRef.current;
        if (page !== 'map' || !map) return;
        layersRef.current.forEach(l => map.removeLayer(l));
        layersRef.current = [];
        fields.forEach(f => {
          if (!f.polygon || !Array.isArray(f.polygon) || f.polygon.length < 3) return;
          const valid = f.polygon.every(p => Array.isArray(p) && p.length === 2 && !isNaN(p[0]) && !isNaN(p[1]));
          if (!valid) return;
          const color = f.health_status === 'healthy' ? '#2d8230' : '#d97706';
          const poly = L.polygon(f.polygon, { color, weight: 2, fillOpacity: 0.12 }).addTo(map)
            .bindPopup(`<b>${f.name}</b><br>${f.crop} · ${f.area_acres} acres<br>${f.health_status === 'healthy' ? '🟢 Healthy' : '🟡 Stressed'}`);
          layersRef.current.push(poly);
        });
        outbreaks.filter(o => o.status === 'active' && o.latitude != null && o.longitude != null && !isNaN(o.latitude) && !isNaN(o.longitude)).forEach(o => {
          const icon = L.divIcon({ html: `<div class="marker-pin pin-red"></div>`, iconSize:[18,18], iconAnchor:[9,9], className:'' });
          const mk = L.marker([o.latitude, o.longitude], { icon }).addTo(map)
            .bindPopup(`<b>OUT-${String(o.id).padStart(4,'0')}</b><br>${o.pest} · ${o.affected_area_acres} acres<br>Risk: ${o.risk_level}`);
          layersRef.current.push(mk);
          layersRef.current.push(L.circle([o.latitude, o.longitude], { radius: o.affected_area_acres*120, color:'#dc2626', weight:1, fillOpacity:0.07 }).addTo(map));
        });
        agents.filter(a => a.status === 'AVAILABLE' && a.latitude != null && a.longitude != null && !isNaN(a.latitude) && !isNaN(a.longitude)).forEach(a => {
          const icon = L.divIcon({ html: `<div class="marker-pin pin-green"></div>`, iconSize:[14,14], iconAnchor:[7,7], className:'' });
          const mk = L.marker([a.latitude, a.longitude], { icon }).addTo(map).bindTooltip(`${a.name} · available`);
          layersRef.current.push(mk);
        });
      }, [fields, outbreaks, agents, page]);

      const exportLog = () => {
        const content = events.map(e => `${e.created_at ? e.created_at.slice(0,19) : ''} | ${e.agent_name.padEnd(25)} | ${e.event_type.padEnd(12)} | ${e.message}`).join('\n');
        const blob = new Blob([`FarmShield Event Log Export\n${'='.repeat(80)}\n${content}`], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'farmshield_audit_log.txt'; a.click();
      };

      const abortMission = async (missionId, missionCode) => {
        if (!confirm(`Abort mission ${missionCode}? Agent will return to base.`)) return;
        const res = await api(`/api/missions/${missionId}/abort?reason=operator_abort`, { method: 'POST' });
        if (res) { load(); }
      };

      const dm = darkMode;
      const nav = [
        { key:'dashboard', label:'Dashboard', icon:I.grid },
        { key:'map', label:'Field Map', icon:I.mapPin },
        { key:'outbreaks', label:'Outbreaks', icon:I.alert },
        { key:'missions', label:'Missions', icon:I.drone },
        { key:'agents', label:'Fleet', icon:I.settings },
        { key:'events', label:'Event Log', icon:I.history },
        { key:'analytics', label:'Analytics', icon:I.chart },
        { key:'rotation', label:'Chem. Rotation', icon:I.flask },
        { key:'aerial', label:'Aerial Scan', icon:I.image },
        { key:'resistance', label:'Resistance Risk', icon:I.bug },
        { key:'waypoints', label:'Waypoints', icon:I.drone },
      ];

      const Chip = ({ tone, children }) => {
        const tones = {
          green: dm ? 'bg-green-900/50 text-green-400' : 'bg-brand-50 text-brand-700',
          red: dm ? 'bg-red-900/50 text-red-400' : 'bg-red-50 text-red-600',
          amber: dm ? 'bg-amber-900/50 text-amber-400' : 'bg-amber2-100 text-amber2-500',
          gray: dm ? 'bg-dark-600 text-dark-400' : 'bg-paper-100 text-ink-500',
          blue: dm ? 'bg-blue-900/50 text-blue-400' : 'bg-blue-50 text-blue-600',
        };
        return <span className={`text-xs font-semibold px-2.5 py-1 rounded-full ${tones[tone]||tones.gray}`}>{children}</span>;
      };

      const StatCard = ({ label, value, tone='green', sub='', sparkData=null }) => (
        <div className={`${dm ? 'dark-card border rounded-app p-4' : 'bg-white border border-paper-200 rounded-app p-4 shadow-card'}`}>
          <div className={`text-xs font-medium ${dm ? 'text-green-300' : 'text-ink-400'}`}>{label}</div>
          <div className={`text-2xl font-bold mt-1 ${tone==='red' ? (dm ? 'text-red-400' : 'text-red-600') : tone==='green' ? (dm ? 'text-green-400' : 'text-brand-600') : tone==='blue' ? (dm ? 'text-blue-400' : 'text-blue-600') : (dm ? 'text-dark-400' : 'text-ink-800')}`}>{value}</div>
          {sub && <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{sub}</div>}
          {sparkData && <div className="mt-2"><Sparkline data={sparkData} color={tone === 'red' ? '#dc2626' : '#3a9e3d'} /></div>}
        </div>
      );

      const activeObs = outbreaks.filter(o => o.status === 'active');
      const activeMs = missions.filter(m => !['completed','aborted'].includes(m.status));

      const panelClass = dm ? 'h-full flex flex-col dark-panel' : 'h-full flex flex-col bg-paper-100';
      const headerClass = dm ? 'dark-header border-b px-5 py-3 flex items-center gap-3 shrink-0 dark-border' : 'bg-white border-b border-paper-200 px-5 py-3 flex items-center gap-3 shrink-0';
      const navClass = dm ? 'w-52 dark-nav border-r py-3 shrink-0 dark-border' : 'w-52 bg-white border-r border-paper-200 py-3 shrink-0';
      const navItemBase = dm ? 'w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium pressable dark-nav-item' : 'w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium pressable';
      const navItemActive = dm ? 'active' : 'text-brand-700 bg-brand-50 border-r-2 border-brand-600';
      const navItemInactive = dm ? '' : 'text-ink-500 hover:bg-paper-50';
      const cardClass = dm ? 'dark-card border rounded-app dark-border' : 'bg-white border border-paper-200 rounded-app shadow-card';

      return (
        <div className={panelClass}>
          {/* Header */}
          <header className={headerClass}>
            <span className={dm ? 'text-green-400' : 'text-brand-600'}>{I.shield('w-5 h-5')}</span>
            <div className="flex-1">
              <div className={`font-semibold leading-tight ${dm ? 'text-white' : 'text-ink-800'}`}>FarmShield Operations</div>
              <div className={`text-xs leading-tight ${dm ? 'text-green-300' : 'text-ink-400'}`}>
                {health ? <span className="inline-flex items-center gap-1"><span className={`w-1.5 h-1.5 rounded-full ${health.database === 'connected' ? 'bg-green-400' : 'bg-red-400'}`}></span>API {health.database}</span> : '…'}
                <span className="mx-2 opacity-30">|</span>Demo Mode
                {weather && <span className="ml-2">{I.thermometer('w-3 h-3 inline')} {weather.temperature_c}°C · {weather.humidity_percent}%RH</span>}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setDarkMode(d => !d)}
                className={`p-1.5 rounded-lg pressable ${dm ? 'text-yellow-400 bg-yellow-900/30 hover:bg-yellow-900/50' : 'text-ink-500 hover:bg-paper-100'}`}
                title="Toggle dark mode">
                {dm ? I.sun('w-4 h-4') : I.moon('w-4 h-4')}
              </button>
              <button onClick={() => load()} className={`p-1.5 rounded-lg pressable ${dm ? 'text-dark-400 hover:bg-dark-700' : 'text-ink-400 hover:bg-paper-100'}`} title="Refresh">{I.refresh('w-4 h-4')}</button>
              <button onClick={onDemo} className={`text-sm font-semibold border rounded-lg px-3 py-1.5 ${dm ? 'text-green-400 border-green-800 hover:bg-green-900/30' : 'text-brand-600 border-brand-200 hover:bg-brand-50'}`}>Live Demo</button>
              <button onClick={onFarmer} className={`text-sm font-semibold border rounded-lg px-3 py-1.5 ${dm ? 'text-dark-400 border-dark-600 hover:bg-dark-700' : 'text-ink-600 border-paper-300 hover:bg-paper-50'}`}>Farmer App</button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            {/* Sidebar */}
            <nav className={navClass}>
              {nav.map(n => (
                <button key={n.key} onClick={() => setPage(n.key)}
                  className={`${navItemBase} ${page===n.key ? navItemActive : navItemInactive}`}>
                  {n.icon('w-4 h-4')}
                  <span className="text-sm">{n.label}</span>
                </button>
              ))}
            </nav>

            {/* Content + Ticker */}
            <div className="flex-1 flex flex-col overflow-hidden">
              <main className="flex-1 overflow-y-auto">

                {/* DASHBOARD */}
                {page === 'dashboard' && (
                  <div className="p-5 space-y-5 max-w-5xl">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                      <StatCard label="Active outbreaks" value={activeObs.length} tone={activeObs.length ? 'red' : 'green'} sub={activeObs.length ? 'Response required' : 'All clear'} sparkData={[1,2,1,3,1,0,activeObs.length]} />
                      <StatCard label="Active missions" value={activeMs.length} tone="amber" sub="In progress" sparkData={[0,1,2,1,2,1,activeMs.length]} />
                      <StatCard label="Available agents" value={agents.filter(a=>a.status==='AVAILABLE').length} sub={`of ${agents.length} total`} sparkData={[3,4,3,5,4,3,agents.filter(a=>a.status==='AVAILABLE').length]} />
                      <StatCard label="Fields monitored" value={analytics ? analytics.fields_monitored : '—'} sub={analytics ? `${analytics.area_monitored_acres} acres` : ''} />
                    </div>

                    {/* Weather + quick stats */}
                    {weather && analytics && (
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Pest Risk Level</div>
                          <div className={`text-xl font-bold ${weather.pest_risk === 'HIGH' ? (dm ? 'text-red-400' : 'text-red-600') : weather.pest_risk === 'MODERATE' ? (dm ? 'text-amber-400' : 'text-amber2-500') : (dm ? 'text-green-400' : 'text-brand-600')}`}>{weather.pest_risk}</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{weather.temperature_c}°C · {weather.humidity_percent}% RH</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>CO₂ Saved</div>
                          <div className={`text-xl font-bold ${dm ? 'text-green-400' : 'text-brand-600'}`}>{analytics.co2_saved_kg} kg</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>vs. blanket tractor spray</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Pesticide Saved</div>
                          <div className={`text-xl font-bold ${dm ? 'text-green-400' : 'text-brand-600'}`}>{analytics.pesticide_savings_percent}%</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{analytics.estimated_pesticide_saved_l} L saved</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Yield Protected</div>
                          <div className={`text-xl font-bold ${dm ? 'text-blue-400' : 'text-blue-600'}`}>₹{(analytics.yield_protected_inr/1000).toFixed(0)}K</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Prototype Estimate</div>
                        </div>
                      </div>
                    )}

                    {/* Active Outbreaks */}
                    <div className={cardClass}>
                      <div className={`px-5 py-4 border-b flex items-center justify-between ${dm ? 'dark-border' : 'border-paper-100'}`}>
                        <h3 className={`font-semibold ${dm ? 'text-white' : 'text-ink-800'}`}>Active Outbreaks</h3>
                        {activeObs.length > 0 && <Chip tone="red">{activeObs.length} open</Chip>}
                      </div>
                      {activeObs.length === 0 ? (
                        <div className={`px-5 py-8 text-center text-sm ${dm ? 'text-green-300' : 'text-ink-400'}`}>No active outbreaks. All fields clear. 🟢</div>
                      ) : activeObs.map(o => (
                        <div key={o.id} className={`px-5 py-4 flex items-center justify-between gap-4 border-b last:border-0 ${dm ? 'dark-border' : 'border-paper-100'}`}>
                          <div>
