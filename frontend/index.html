                            const bb = waypointData.bounding_box;
                            const wpts = waypointData.waypoints;
                            const oc = waypointData.outbreak_center;
                            if (!bb || !wpts || wpts.length < 2) return <p className="text-xs text-dark-400">No waypoints available</p>;
                            const W = 500, H = 200, px = 24, py = 16;
                            const latR = bb.lat_max - bb.lat_min || 0.001;
                            const lonR = bb.lon_max - bb.lon_min || 0.001;
                            const X = lon => px + ((lon - bb.lon_min) / lonR) * (W - 2*px);
                            const Y = lat => py + ((bb.lat_max - lat) / latR) * (H - 2*py);
                            const pairs = [];
                            for (let i = 0; i < wpts.length-1; i+=2) pairs.push([wpts[i], wpts[i+1]]);
                            return (
                              <svg viewBox={'0 0 '+W+' '+H} width="100%" style={{background: dm?'#0d1117':'#f8f8f4', borderRadius:8}}>
                                <rect x={X(bb.lon_min)} y={Y(bb.lat_max)} width={X(bb.lon_max)-X(bb.lon_min)} height={Y(bb.lat_min)-Y(bb.lat_max)}
                                  fill="rgba(34,197,94,0.06)" stroke={dm?'#22c55e':'#3a9e3d'} strokeWidth="1" strokeDasharray="4 2" />
                                {pairs.map(([a,b],i) => (
                                  <line key={i} x1={X(a.lon)} y1={Y(a.lat)} x2={X(b.lon)} y2={Y(b.lat)}
                                    stroke={dm?'#3b82f6':'#2563eb'} strokeWidth="1.5" strokeDasharray="3 3">
                                    <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="0.8s" repeatCount="indefinite" />
                                  </line>
                                ))}
                                {wpts[0] && <circle cx={X(wpts[0].lon)} cy={Y(wpts[0].lat)} r="5" fill="#22c55e" />}
                                {oc && <circle cx={X(oc.lon)} cy={Y(oc.lat)} r="7" fill="rgba(239,68,68,0.35)" stroke="#ef4444" strokeWidth="1.5"/>}
                                <text x={X(bb.lon_min)+3} y={Y(bb.lat_max)+12} fill='#4ade80' fontSize='10' fontWeight='bold'>START</text>
                                {oc && <text x={X(oc.lon)+10} y={Y(oc.lat)+4} fill='#f87171' fontSize='10' fontWeight='bold'>OUTBREAK</text>}
                              </svg>
                            );
                          })()}
                          <div className="flex gap-5 mt-3 text-xs flex-wrap">
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-5 border-t-2 border-dashed border-blue-400 inline-block"></span>Spray sweep</span>
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-3 h-3 rounded-full bg-green-500 inline-block"></span>Drone start</span>
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-3 h-3 rounded-full bg-red-500 inline-block"></span>Outbreak</span>
                          </div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <p className={`font-semibold mb-2 text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>Spray Parameters</p>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-y-2 gap-x-4 text-xs">
                            {[['Mission',waypointData.mission_code],['Altitude',waypointData.altitude_m+'m'],['Swath',waypointData.swath_width_m+'m'],
                              ['Spray Time',waypointData.spray_time_min+' min'],['Blanket Equiv.',waypointData.blanket_volume_l+'L'],['Precision',waypointData.chemical_volume_l+'L']].map(([k,v]) => (
                              <div key={k} className="flex gap-2">
                                <span className={dm?'text-dark-400':'text-ink-400'}>{k}:</span>
                                <span className={`font-semibold ${dm?'text-green-300':'text-brand-700'}`}>{v}</span>
                              </div>
                            ))}
                          </div>
                          <p className={`text-[10px] mt-3 ${dm?'text-dark-400':'text-ink-400'}`}>Prototype lawnmower path. Production: DGCA-compliant geofenced polygon scan.</p>
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </main>

              {/* Event ticker */}
              {tickerText && (
                <div className={`shrink-0 border-t py-1.5 overflow-hidden ${dm ? 'bg-dark-900 border-dark-700' : 'bg-paper-100 border-paper-200'}`}>
                  <div className="ticker-wrap">
                    <div className="ticker-content">
                      <span className={`text-[10px] font-mono ${dm ? 'text-green-400' : 'text-brand-600'}`}>
                        ▶ LIVE: {tickerText}
                      </span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────── AERIAL SCAN PAGE ─────────────────── */
    function AerialScanPage({ darkMode: dm, scanResult, setScanResult, scanImage, setScanImage, scanning, setScanning, sampleFields, setSampleFields, onConfirm }) {
      const [selectedSample, setSelectedSample] = useState(null);

      useEffect(() => {
        api('/api/detection/sample-fields').then(r => { if (r) setSampleFields(r); });
      }, []);

      const runScan = async (file) => {
        setScanning(true); setScanResult(null);
        const fd = new FormData();
        fd.append('file', file);
        fd.append('field_area_acres', '42');
        fd.append('create_detection', 'true');
        try {
          const res = await fetch(API + '/api/detection/scan-field', { method: 'POST', body: fd });
          const data = await res.json();
          setScanResult(data);
          setScanImage(URL.createObjectURL(file));
        } catch (e) { console.error(e); }
        setScanning(false);
      };

      const runSample = async (sample) => {
        setSelectedSample(sample.name); setScanning(true); setScanResult(null);
        try {
          const res = await fetch(sample.path);
          const blob = await res.blob();
          const fd = new FormData();
          fd.append('file', blob, sample.name);
          fd.append('field_area_acres', '42');
          fd.append('create_detection', 'true');
          const scanRes = await fetch(API + '/api/detection/scan-field', { method: 'POST', body: fd });
          const data = await scanRes.json();
          setScanResult(data);
          setScanImage(URL.createObjectURL(blob));
        } catch (e) { console.error(e); }
        setScanning(false);
      };

      const cardClass = dm ? 'bg-dark-700 border border-dark-600 rounded-app' : 'bg-white border border-paper-200 rounded-app shadow-card';

      return (
        <div className="p-5 max-w-5xl space-y-5">
          <div>
            <h2 className={`text-lg font-bold flex items-center gap-2 ${dm ? 'text-white' : 'text-ink-800'}`}>{I.image('w-5 h-5 text-brand-600')} Aerial Field Scan</h2>
            <p className={`text-sm mt-1 ${dm ? 'text-dark-400' : 'text-ink-500'}`}>Real CNN detection on field imagery — tiles into 6×6 grid, classifies each tile, clusters disease hotspots into infection zones with GPS coordinates.</p>
          </div>

          <div className={`${cardClass} p-4`}>
            <h3 className={`font-semibold text-sm mb-3 ${dm ? 'text-white' : 'text-ink-800'}`}>Sample Field Images</h3>
            <div className="grid grid-cols-2 gap-3">
              {sampleFields.map(s => (
                <button key={s.name} onClick={() => runSample(s)} disabled={scanning}
                  className={`text-left p-3 rounded-app border transition-all pressable ${selectedSample === s.name ? (dm ? 'border-green-500 bg-green-900/20' : 'border-brand-400 bg-brand-50') : (dm ? 'border-dark-500 hover:border-green-600 hover:bg-dark-600' : 'border-paper-200 hover:border-brand-300 hover:bg-paper-50')} disabled:opacity-50`}>
                  <div className={`font-medium text-sm ${dm ? 'text-white' : 'text-ink-700'}`}>{s.name.replace(/_/g, ' ').replace(/\.jpg$/, '')}</div>
                  <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{s.description}</div>
                </button>
              ))}
            </div>
            <div className="mt-3 flex items-center gap-3">
              <label className={`px-4 py-2 rounded-app text-sm font-semibold pressable cursor-pointer flex items-center gap-1.5 ${dm ? 'bg-dark-600 text-dark-300 hover:bg-dark-500 border border-dark-500' : 'bg-white border border-paper-300 text-ink-700 hover:bg-paper-50'}`}>
                {I.camera('w-4 h-4')}Upload your own image
                <input type="file" accept="image/*" onChange={e => { const f = e.target.files?.[0]; if (f) runScan(f); }} className="hidden" />
              </label>
              {scanning && <span className={`text-sm font-medium ${dm ? 'text-green-400' : 'text-brand-600'} animate-pulse`}>Scanning 36 tiles…</span>}
            </div>
          </div>

          {scanResult && (
            <div className={`${cardClass} p-4 space-y-4`}>
              <div className="flex items-center justify-between">
                <h3 className={`font-semibold text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>Scan Results</h3>
                <span className={`text-xs font-mono px-2 py-1 rounded-full ${dm ? 'bg-green-900/40 text-green-400' : 'bg-brand-50 text-brand-700'}`}>{scanResult.mode}</span>
              </div>
              <p className={`text-sm ${dm ? 'text-dark-300' : 'text-ink-600'}`}>{scanResult.detection_summary}</p>

              {scanImage && (
                <div className="relative inline-block rounded-app overflow-hidden border border-paper-200">
                  <img src={scanImage} alt="Scanned field" className="max-w-full max-h-80 object-contain" />
                  {scanResult.image_width && scanResult.image_height && scanResult.clusters && scanResult.clusters.map((cl, i) => {
                    const b = cl.bbox_px;
                    const imgEl = document.querySelector('img[alt="Scanned field"]');
                    const imgW = imgEl ? imgEl.clientWidth : scanResult.image_width;
                    const imgH = imgEl ? imgEl.clientHeight : scanResult.image_height;
                    const sx = imgW / scanResult.image_width;
                    const sy = imgH / scanResult.image_height;
                    return (
                      <div key={i} className="absolute border-2 border-red-500 rounded" style={{ left: b.x * sx, top: b.y * sy, width: b.w * sx, height: b.h * sy }}>
                        <span className="absolute -top-5 left-0 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap">
                          #{cl.id} {cl.main_pest} ({(cl.avg_confidence*100).toFixed(0)}%)
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}

              {scanResult.tiles && (
                <div>
                  <p className={`text-xs mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Per-tile heatmap ({scanResult.grid}×{scanResult.grid} = {scanResult.total_tiles} tiles)</p>
                  <div className="inline-grid gap-px" style={{gridTemplateColumns: `repeat(${scanResult.grid}, 1fr)`}}>
                    {scanResult.tiles.map((t, i) => (
                      <div key={i} className={`w-6 h-6 rounded-sm text-[7px] flex items-center justify-center font-bold ${t.hot ? 'bg-red-500 text-white' : t.healthy ? 'bg-brand-200 text-brand-800' : 'bg-amber2-100 text-amber2-500'}`}
                        title={`${t.label} (${(t.confidence*100).toFixed(0)}%)`}>
                        {t.hot ? '!' : t.healthy ? '' : '?'}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {scanResult.clusters && scanResult.clusters.length > 0 && (
                <div className="space-y-2">
                  <h4 className={`font-semibold text-sm ${dm ? 'text-white' : 'text-ink-700'}`}>Detected Infection Zones</h4>
                  {scanResult.clusters.map(cl => (
                    <div key={cl.id} className="flex items-center justify-between p-3 bg-red-50 border border-red-200 rounded-app">
                      <div>
                        <span className="font-semibold text-red-700">Zone #{cl.id}</span>
                        <span className="text-sm text-ink-600 ml-2">{cl.main_pest}</span>
                        <span className="text-xs text-ink-400 ml-2">({(cl.avg_confidence*100).toFixed(0)}% conf, {cl.tile_count} tiles)</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-red-600">{cl.est_acres} acres</span>
                        {scanResult.clusters.indexOf(cl) === 0 && scanResult.detection_id && (
                          <button onClick={() => onConfirm(scanResult.detection_id)}
                            className="px-3 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-app pressable hover:bg-red-700">
                            Confirm → Outbreak
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {scanResult.clusters && scanResult.clusters.length === 0 && (
                <div className="p-4 bg-brand-50 border border-brand-200 rounded-app text-center">
                  <p className="text-sm text-brand-700 font-medium">No infection zones detected — field appears healthy</p>
                  <p className="text-xs text-ink-400 mt-1">{scanResult.healthy_fraction ? `${(scanResult.healthy_fraction*100).toFixed(0)}% of tiles classified as healthy` : ''}</p>
                </div>
              )}

              <p className={`text-xs ${dm ? 'text-green-300' : 'text-ink-400'}`}>Real CNN inference (PlantVillage MobileNetV2, 38 classes) — not a simulation. Aerial accuracy limited: leaf-level model applied to field imagery. Production: multispectral aerial model.</p>
            </div>
          )}
        </div>
      );
    }

    function AILeafLab({ onBack }) {
      const [samples, setSamples] = useState([]);

        setSelected(sample); setResult(null); setScanning(true);
        const res = await fetch('/api/detection/leaf-samples/' + sample.id + '/analyze', { method: 'POST' });
        const data = res.ok ? await res.json() : null;
        setResult(data); setScanning(false);
        if (data && window.speechSynthesis) {
          const msg = data.healthy
            ? `Crop looks healthy. ${data.crop}. Confidence ${(data.confidence*100).toFixed(0)} percent.`
            : data.possible_pest
              ? `Warning. Possible ${data.possible_pest} detected on ${data.crop}. Confidence ${(data.confidence*100).toFixed(0)} percent. Risk: ${data.risk}.`
              : 'Photo not clear enough. Please try a closer shot.';
          const u = new SpeechSynthesisUtterance(msg);
          u.lang = speakLang; window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
        }
      };

      const analyzeUpload = async (file) => {
        setUploadScanning(true); setUploadResult(null);
        const fd = new FormData(); fd.append('file', file); fd.append('crop', 'Cotton');

                  <div className="agtech-card rounded-2xl p-8 text-center">
                    <div className="text-5xl mb-4">🔬</div>
                    <div className="text-green-200 font-bold text-base">Select a leaf sample to begin analysis</div>

                {scanning && (
                  <div className="agtech-card rounded-2xl p-8 text-center">
                    <div className="w-16 h-16 rounded-full border-2 border-green-500 flex items-center justify-center mx-auto mb-4 relative">
                      <div className="text-3xl">{icons[selected?.icon] || '🌿'}</div>

    /* ═══════════════════════════════════════════════════════════

    function MicroClimateSandbox({ onBack }) {
      const [params, setParams] = useState({ temperature:29, humidity:78, wind_speed:11, wind_direction_deg:225, base_acres:2.1, delay_hours:0, crop:'Cotton', pest:'Bollworm' });
      const [result, setResult] = useState(null);
      const [loading, setLoading] = useState(false);
      const [autoRefresh, setAutoRefresh] = useState(true);
      const timerRef = useRef(null);

      const crops = ['Cotton','Rice','Wheat','Chilli','Tomato'];
      const pests = ['Bollworm','Stem Borer','Aphid Cluster'];

      const fetch_sandbox = async (p) => {
        setLoading(true);
        const qs = Object.entries(p).map(([k,v]) => `${k}=${encodeURIComponent(v)}`).join('&');
        const data = await api('/api/spread/simulate-sandbox?' + qs);
        if (data) setResult(data);
        setLoading(false);
      };

      useEffect(() => { fetch_sandbox(params); }, []);

      const onChange = (k, v) => {
        const np = { ...params, [k]: v };
        setParams(np);
        if (autoRefresh) {
          if (timerRef.current) clearTimeout(timerRef.current);
          timerRef.current = setTimeout(() => fetch_sandbox(np), 400);
        }
      };

      const riskColor = result ? (result.risk_level==='HIGH' ? '#ef4444' : result.risk_level==='MODERATE' ? '#f59e0b' : '#22c55e') : '#22c55e';

      const Slider = ({label, k, min, max, step=1, unit=''}) => (
        <div>
          <div className="flex justify-between mb-1.5">
            <span className="text-xs font-semibold text-green-300">{label}</span>
            <span className="text-xs font-bold" style={{color: riskColor}}>{params[k]}{unit}</span>
          </div>
          <input type="range" min={min} max={max} step={step} value={params[k]}
            onChange={e => onChange(k, parseFloat(e.target.value))}
            className="agtech-slider" />
        </div>
      );

      const preds = result?.predictions || [];
      const maxArea = Math.max(...preds.map(p => p.range_max || p.area), 1);

      return (
        <div className="agtech-bg agtech-grid min-h-screen text-green-100" style={{backgroundColor:'#040d08',color:'#e2fce4'}}>
          <AgTechHeader onBack={onBack} title="Interactive Microclimate Spread Sandbox" badge="LIVE SIMULATION" />

          <div className="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

            {/* Controls */}
            <div className="lg:col-span-1 space-y-4">
              <div className="agtech-card rounded-2xl p-5 space-y-5">
                <div className="flex items-center justify-between">
                  <h2 className="font-bold text-green-200 flex items-center gap-2">{I.wind('w-4 h-4 text-blue-400')} Microclimate Controls</h2>
                  <label className="flex items-center gap-2 cursor-pointer">
                    <span className="text-xs font-medium" style={{color:'#d8f0db'}}>Live</span>
                    <div className={`w-8 h-4 rounded-full transition-colors ${autoRefresh ? 'bg-green-500' : 'bg-gray-700'} relative`} onClick={() => setAutoRefresh(!autoRefresh)}>
                      <div className={`w-3 h-3 bg-white rounded-full absolute top-0.5 transition-all ${autoRefresh ? 'left-4.5' : 'left-0.5'}`} style={{left: autoRefresh ? '18px' : '2px'}} />
                    </div>
                  </label>
                </div>

                <Slider label="🌡️ Temperature" k="temperature" min={15} max={45} unit="°C" />
                <Slider label="💧 Humidity" k="humidity" min={30} max={95} unit="%" />
                <Slider label="🌬️ Wind Speed" k="wind_speed" min={0} max={40} unit=" km/h" />
                <Slider label="🧭 Wind Direction" k="wind_direction_deg" min={0} max={360} unit="°" />
                <Slider label="🌾 Base Outbreak Area" k="base_acres" min={0.5} max={10} step={0.5} unit=" acres" />
                <Slider label="⏱️ Response Delay" k="delay_hours" min={0} max={24} unit="h" />

                <div>
                  <div className="text-xs font-semibold text-green-200 mb-2">Crop</div>
                  <div className="flex gap-2 flex-wrap">
                    {crops.map(c => <button key={c} onClick={() => onChange('crop', c)}
                      className={`px-3 py-1 rounded-lg text-xs font-semibold pressable ${params.crop===c ? 'bg-green-500 text-white' : 'bg-white/10 text-white hover:bg-white/20'}`}>{c}</button>)}
                  </div>
                </div>
                <div>
                  <div className="text-xs font-semibold text-green-200 mb-2">Pest</div>
                  <div className="flex gap-2 flex-wrap">
                    {pests.map(p => <button key={p} onClick={() => onChange('pest', p)}
                      className={`px-3 py-1 rounded-lg text-xs font-semibold pressable ${params.pest===p ? 'bg-red-500 text-white' : 'bg-white/10 text-white hover:bg-white/20'}`}>{p}</button>)}
                  </div>
                </div>
              </div>

              {/* Status quo comparison */}
              <div className="agtech-card rounded-2xl p-4">
                <div className="text-xs font-semibold text-green-300 mb-3 uppercase tracking-wide">📊 Status Quo vs FarmShield</div>
                {result && (
                  <div className="space-y-3">
                    {[
                      {label:'Without FarmShield', area: result.predictions?.at(-1)?.area?.toFixed(1) + ' acres', loss: '₹' + (result.economic_loss_inr||0).toLocaleString(), chemical: result.blanket_chemical_l + ' L', color:'#ef4444'},
                      {label:'With FarmShield', area: result.effective_base_acres?.toFixed(1) + ' acres', loss: '₹' + (result.with_farmshield_loss_inr||0).toLocaleString(), chemical: result.precision_chemical_l + ' L', color:'#22c55e'},
                    ].map(row => (
                      <div key={row.label} className="rounded-lg p-3" style={{background:`${row.color}10`, border:`1px solid ${row.color}30`}}>
                        <div className="text-xs font-bold mb-1.5" style={{color:row.color}}>{row.label}</div>
                        <div className="grid grid-cols-3 gap-2 text-xs">
                          <div><div style={{color:'#d8f0db'}}>Spread</div><div className="font-semibold" style={{color:row.color}}>{row.area}</div></div>
                          <div><div style={{color:'#d8f0db'}}>Crop Loss</div><div className="font-semibold" style={{color:row.color}}>{row.loss}</div></div>
                          <div><div style={{color:'#d8f0db'}}>Chemical</div><div className="font-semibold" style={{color:row.color}}>{row.chemical}</div></div>
                        </div>
                      </div>
                    ))}
                    <div className="rounded-lg p-3 bg-green-500/10 border border-green-500/30">
                      <div className="text-xs font-bold text-green-400 mb-1">✅ FarmShield Saves</div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div><div style={{color:'#d8f0db'}}>INR Saved</div><div className="font-black text-green-300">₹{(result.inr_saved||0).toLocaleString()}</div></div>
                        <div><div style={{color:'#d8f0db'}}>Chemical Saved</div><div className="font-black text-green-300">{result.chemical_saved_pct}%</div></div>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Spread chart + Wind ellipse */}
            <div className="lg:col-span-2 space-y-5">

              {/* Risk banner */}
              {result && (
                <div className="agtech-card rounded-2xl p-4 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-3 h-3 rounded-full animate-pulse" style={{background: riskColor}} />
                    <span className="font-black text-lg" style={{color: riskColor}}>Spread Risk: {result.risk_level}</span>
                    <span className="text-xs font-medium" style={{color:'#d8f0db'}}>Growth rate: {result.growth_rate} /hr</span>
                  </div>
                  {loading && <div className="text-xs text-green-400 animate-pulse">Recalculating...</div>}
                </div>
              )}

              {/* Spread timeline chart */}
              <div className="agtech-card rounded-2xl p-5">
                <h3 className="font-bold text-green-200 mb-4 flex items-center gap-2">{I.chart('w-4 h-4 text-blue-400')} Spread Forecast Timeline</h3>
                <div className="space-y-3">
                  {preds.map((p, i) => {
                    const barPct = ((p.area / maxArea) * 100).toFixed(1);
                    const errMin = ((p.range_min / maxArea) * 100).toFixed(1);
                    const errMax = ((p.range_max / maxArea) * 100).toFixed(1);
                    const hrs = p.hours;
                    return (
                      <div key={i} className="flex items-center gap-3">
                        <div className="text-xs font-semibold w-8 text-right" style={{color:'#d8f0db'}}>{hrs}h</div>
                        <div className="flex-1 relative h-6 rounded overflow-hidden" style={{background:'rgba(255,255,255,0.04)'}}>
                          {/* Uncertainty band */}
                          <div className="absolute top-0 bottom-0 rounded" style={{left:`${errMin}%`, width:`${errMax-errMin}%`, background: `${riskColor}18`}} />
                          {/* Main bar */}
                          <div className="absolute top-1 bottom-1 rounded conf-bar"
                            style={{'--bar-w':`${barPct}%`, width:`${barPct}%`, background: i===0?'#22c55e': i<=2?riskColor:`${riskColor}cc`}} />
                        </div>
                        <div className="text-xs font-bold w-16 text-right" style={{color: i===0?'#22c55e':riskColor}}>{p.area} ac</div>
                        <div className="text-[10px] w-20 text-right" style={{color:'#d8f0db'}}>[{p.range_min}–{p.range_max}]</div>
                      </div>
                    );
                  })}
                </div>
                <div className="mt-2 text-xs" style={{color:'#b8ddbf'}}>Bars show projected spread · Shaded area = ±15% uncertainty band · Degree-day logistic growth model</div>
              </div>

              {/* Wind ellipse visualization */}
              <div className="agtech-card rounded-2xl p-5">
                <h3 className="font-bold text-green-200 mb-2 flex items-center gap-2">{I.wind('w-4 h-4 text-blue-400')} Wind Drift Ellipse (48h Spread Footprint)</h3>
                <div className="text-xs mb-4" style={{color:'#d8f0db'}}>Wind direction: {params.wind_direction_deg}° · Speed: {params.wind_speed} km/h · Ellipse elongated along wind vector</div>
                {result?.wind_drift_ellipse && (
                  <svg viewBox="-1.5 -1.5 3 3" width="100%" style={{maxHeight:200, background:'rgba(0,0,0,0.2)'}} className="rounded-xl overflow-hidden">
                    {/* Grid */}
                    {[-1, -0.5, 0, 0.5, 1].map(v => (
                      <g key={v}>
                        <line x1={v} y1={-1.5} x2={v} y2={1.5} stroke="rgba(34,197,94,0.1)" strokeWidth="0.02"/>
                        <line x1={-1.5} y1={v} x2={1.5} y2={v} stroke="rgba(34,197,94,0.1)" strokeWidth="0.02"/>
                      </g>
                    ))}
                    {/* Center outbreak */}
                    <circle cx={0} cy={0} r={0.05} fill="#ef4444" />
                    <circle cx={0} cy={0} r={0.08} fill="rgba(239,68,68,0.2)" className="outbreak-pulse-anim" />
                    {/* Ellipse */}
                    {(() => {
                      const pts = result.wind_drift_ellipse;
                      const center_lat = 10.7905, center_lon = 78.7047;
                      const svgPts = pts.map(p => {
                        const x = (p.lon - center_lon) * 200;
                        const y = -(p.lat - center_lat) * 200;
                        return `${x},${y}`;
                      }).join(' ');
                      return <polygon points={svgPts} fill="rgba(239,68,68,0.12)" stroke="#ef4444" strokeWidth="0.03" strokeOpacity="0.6" />;
                    })()}
                    {/* Wind arrow */}
                    {(() => {
                      const rad = (params.wind_direction_deg - 90) * Math.PI / 180;
                      const ex = Math.cos(rad) * 0.8, ey = Math.sin(rad) * 0.8;
                      return <line x1={0} y1={0} x2={ex} y2={ey} stroke="#3b82f6" strokeWidth="0.05" markerEnd="url(#arr)" strokeOpacity="0.8" />;
                    })()}
                    <defs>
                      <marker id="arr" markerWidth="4" markerHeight="4" refX="2" refY="2" orient="auto">
                        <path d="M0,0 L4,2 L0,4 Z" fill="#3b82f6" />
                      </marker>
                    </defs>
                  </svg>
                )}
                <div className="flex gap-4 mt-3 text-xs">
                  <span className="flex items-center gap-1"><span className="w-3 h-1 rounded inline-block" style={{background:'#ef4444'}}></span>Spread zone</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-1 rounded inline-block" style={{background:'#3b82f6'}}></span>Wind direction</span>
                  <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full inline-block" style={{background:'#ef4444'}}></span>Outbreak center</span>
                </div>
              </div>

              {/* Economic summary */}
              {result && (
                <div className="agtech-card rounded-2xl p-5">
                  <h3 className="font-bold text-green-200 mb-4 flex items-center gap-2">💰 Economic Impact Calculator</h3>
                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    {[
                      {label:'Crop Loss Averted', val:`₹${(result.inr_saved||0).toLocaleString()}`, color:'#22c55e'},
                      {label:'Chemical Saved', val:`${result.chemical_saved_l} L`, color:'#3b82f6'},
                      {label:'Reduction %', val:`${result.chemical_saved_pct}%`, color:'#f59e0b'},
                      {label:'48h Risk Spread', val:`${result.predictions?.at(-1)?.area||0} ac`, color: riskColor},
                    ].map(({label,val,color}) => (
                      <div key={label} className="agtech-card rounded-xl p-3 text-center">
                        <div className="font-black text-xl" style={{color}}>{val}</div>
                        <div className="text-xs mt-1" style={{color:'#d8f0db'}}>{label}</div>
                      </div>
                    ))}
                  </div>
                  <div className="mt-2 text-xs" style={{color:'#b8ddbf'}}>Prototype Estimates — crop yield from published NFSM benchmarks · Chemical usage from ICAR precision spray studies</div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function JudgeTourModal({ onClose, onDemo, onSandbox, onLab }) {

        { icon: '🎯', title: 'The Problem', content: 'Indian smallholder farmers lose 15–35% of crop yield to pest damage annually. The blocker is not knowledge — it\'s that detection, decision, and action live in 3 different places with no coordination layer.', cta: null },
        { icon: '🧠', title: 'Real AI: PlantVillage CNN', content: 'Every leaf photo runs the REAL PlantVillage MobileNetV2 ONNX model (38 classes, 14 crops) via OpenCV DNN. Zero simulation. Zero cloud. 100% on-device inference.', cta: { label: '→ Try AI Leaf Lab', fn: onLab } },
        { icon: '📡', title: 'Microclimate Spread Model', content: 'A physics-based logistic growth model factoring temperature, humidity, wind velocity, and direction. Judges can drag sliders and watch spread curves + wind ellipses update in real time.', cta: { label: '→ Open Sandbox', fn: onSandbox } },
        { icon: '🛩️', title: 'Lawnmower Spray Path', content: 'Our dispatch engine selects the optimal drone using a scoring formula: 1/(travel_time) × (battery%) × (payload_L). The selected drone flies a precise lawnmower pattern — saving 78.6% of chemical vs blanket spraying.', cta: { label: '→ See Live Demo', fn: onDemo } },
        { icon: '🌾', title: 'Farmer-First Accessibility', content: 'FarmShield\'s protection does NOT live inside the farmer\'s phone. The phone is just one door. 7 Indian languages. Web Speech synthesis reads diagnoses aloud. SMS + IVR for feature phones. Works offline.', cta: null },
        { icon: '✅', title: 'Honest Constraints', content: 'Numbers labeled "Prototype Estimate" are model-computed, not field-validated. Pesticide savings use published precision-vs-blanket benchmarks. RL dispatch is a weighted heuristic — clearly labeled. Every claim visible in working code.', cta: null },
      ];
      const s = steps[step];
      return (
        <div className="fixed inset-0 z-[9999] flex items-center justify-center p-4" style={{background:'rgba(0,0,0,0.85)'}}>
          <div className="agtech-card rounded-3xl max-w-lg w-full p-6 relative" style={{border:'1px solid rgba(34,197,94,0.3)'}}>
            <button onClick={onClose} className="absolute top-4 right-4 text-green-600 hover:text-green-300 text-xl">✕</button>

            <div className="text-5xl mb-4">{s.icon}</div>
            <h2 className="text-xl font-black text-white mb-3">{s.title}</h2>
            <p className="text-sm leading-relaxed" style={{color:'#c5e8c9'}}>{s.content}</p>
            {s.cta && (
              <button onClick={() => { s.cta.fn(); onClose(); }} className="mt-4 px-5 py-2 rounded-xl btn-glow text-sm font-bold pressable">
                {s.cta.label}
              </button>
            )}
            <div className="flex gap-2 mt-6 items-center justify-between">
              <button onClick={() => setStep(Math.max(0, step-1))} disabled={step===0}
                className="px-4 py-2 rounded-xl text-sm font-semibold bg-white/5 text-green-300 disabled:opacity-30 pressable">← Prev</button>
              <div className="flex gap-1.5">
                {steps.map((_,i) => <div key={i} className="w-2 h-2 rounded-full" style={{background: i===step ? '#22c55e' : 'rgba(34,197,94,0.2)'}} />)}
              </div>
              {step < steps.length-1
                ? <button onClick={() => setStep(step+1)} className="px-4 py-2 rounded-xl text-sm font-bold btn-glow pressable">Next →</button>
                : <button onClick={onClose} className="px-4 py-2 rounded-xl text-sm font-bold btn-glow pressable">Finish ✓</button>
              }
            </div>
          </div>
        </div>
      );

                </div>
              </div>
              <div className="ml-8 max-w-xs hidden lg:block">
                <h2 className="text-xl font-bold text-ink-800 mb-2">Farmer Mobile App</h2>
                <p className="text-sm text-ink-500 mb-4">Designed for smallholder farmers. No technical knowledge needed.</p>
                <div className="space-y-2">
                  {['7 Indian languages + voice guide', 'Works offline — syncs when signal returns', 'SMS + IVR for feature phones', 'Real CNN leaf photo analysis', 'Web Speech reads diagnosis aloud'].map(f => (
                    <div key={f} className="flex items-center gap-2 text-sm text-ink-600">
                      <span className="text-brand-600 w-4">{I.check('w-4 h-4')}</span>{f}
                    </div>
                  ))}
                </div>
                <button onClick={() => setMode('landing')} className="mt-6 text-sm text-ink-400 hover:text-ink-600">← Back to landing</button>
              </div>
            </div>
          )}
          {mode === 'farmer' && isMobile && <FarmerApp lang={lang} setLang={setLang} onExit={() => setMode('landing')} />}
          {mode === 'expert' && <ExpertConsole onFarmer={() => setMode('farmer')} onDemo={() => setMode('demo')} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
