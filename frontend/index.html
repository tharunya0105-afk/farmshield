          } catch (e) {}
        } }, 60);
      };

      const run = async () => {
        if (running) return;
        setError(null); setRunning(true); setStage(0); setElapsed(0); setEvents([]); setData({}); setDone(false); setContainment(false); setLitresSaved(0);
        if (litresTimer) clearInterval(litresTimer);
        const ev = (a, m, icon='') => setEvents(p => [...p, { time: new Date().toLocaleTimeString('en-US',{hour12:false}), a, m, icon }]);
        try {
          await api('/api/demo/reset', { method: 'POST' });
          await sleep(800);

          // Stage 1: Detect
          ev('Detection Agent', `Scanning ${activeScenario.field_name || 'plot'} — multispectral anomaly triggered [${activeScenario.name}]`, '🔍');
          const det = await api('/api/detection/analyze', { method:'POST', body: JSON.stringify({ scenario_id: activeScenario.id, crop: activeScenario.crop, field_id: activeScenario.field_id || 1 }) });
          if (!det) throw new Error('detect');
          const conf = await api(`/api/detections/${det.detection_id}/confirm`, { method:'POST' });
          if (!conf) throw new Error('confirm');
          markOutbreak(det.latitude, det.longitude, det.affected_area_acres);
          ev('Detection Agent', `⚠ OUTBREAK FLAGGED — ${det.possible_pest} in ${det.crop}, ${(det.confidence*100).toFixed(0)}% confidence, ${det.affected_area_acres} acres`, '🔴');
          await sleep(2500);

          // Stage 2: Predict
          setStage(1);
          const obs = await api('/api/outbreaks?status=active');
          const ob = (obs||[]).find(o => o.id === conf.outbreak_id) || (obs||[])[0];
          const spread = await api('/api/spread/calculate', { method:'POST', body: JSON.stringify({ temperature: activeScenario.temperature, humidity: activeScenario.humidity, wind_speed: activeScenario.wind_speed, base_acres: activeScenario.affected_area_acres }) }).catch(() => null);
          setData(d => ({ ...d, ob, spread }));
          ev('Prediction Agent', `Degree-day growth model: ${activeScenario.temperature}°C · ${activeScenario.humidity}% RH · ${activeScenario.wind_speed} kph wind`, '🌡️');
          const finalArea = spread?.predictions?.at(-1)?.area || (activeScenario.affected_area_acres * 5.5).toFixed(1);
          ev('Prediction Agent', `Spread curve: ${activeScenario.affected_area_acres} → ${finalArea} acres in 24h  [±15% band]`, '📈');
          await sleep(2500);

          // Stage 3: Select
          setStage(2);
          const sel = await api('/api/dispatch/select', { method:'POST', body: JSON.stringify({ outbreak_id: conf.outbreak_id }) });
          if (!sel || !sel.selected) throw new Error('Dispatch engine returned no candidates. Check /api/dispatch/select.');
          const cand = (sel.candidates||[]).find(c => c.id === sel.selected);
          const mission = await api('/api/missions', { method:'POST', body: JSON.stringify({ outbreak_id: conf.outbreak_id, agent_id: sel.selected }) });
          if (!mission) throw new Error('Mission creation failed. Check /api/missions POST.');
          setData(d => ({ ...d, sel, cand, mission }));
          ev('Dispatch Engine', `Evaluating ${(sel.candidates||[]).length} agents — scoring by travel time × battery × payload`, '⚙️');
          ev('Dispatch Engine', `${cand ? cand.name : 'Selected agent'} optimal: ${cand ? cand.distance_km : '1.8'} km · ${cand ? cand.battery : '95'}% battery`, '✅');
          if ((sel.candidates||[]).find(c => c.battery < 50)) ev('Dispatch Engine', `DRONE-04 skipped — battery 35% (charging). Fleet failover rule enforced.`, '⚡');
          await sleep(1500);

          // Stage 4: En route
          setStage(3);
          ev('Mission Controller', `Mission ${mission.mission_code} created — target: ${activeScenario.affected_area_acres} acres precision zone`, '📋');
          await api(`/api/missions/${mission.mission_id}/status?action=dispatch`, { method:'POST' });
          const agents = (await api('/api/agents')||[]);
          const agent = agents.find(a => a.id === sel.selected);
          const from = agent ? [agent.latitude, agent.longitude] : [10.785, 78.690];
          moveAgent(from, [det.latitude, det.longitude], cand ? cand.name : 'DRONE-03');
          ev('Fleet Controller', `${cand ? cand.name : 'Agent'} airborne → target coordinates`, '🛩️');
          await sleep(1000);
          await api(`/api/missions/${mission.mission_id}/status?action=arrive`, { method:'POST' });
          ev('Fleet Controller', 'Arrived at treatment zone — hovering at 15m, initiating spray matrix', '📍');
          await sleep(1500);

          // Stage 5: Treat
          setStage(4);
          await api(`/api/missions/${mission.mission_id}/status?action=treat`, { method:'POST' });
          const blanketL = Math.round(activeScenario.affected_area_acres * 4.0 * 10) / 10;
          const precisionL = Math.round(activeScenario.affected_area_acres * 4.0 * 0.214 * 10) / 10;
          const totalSaved = Math.round((blanketL - precisionL) * 10) / 10;
          const pctSaved = ((totalSaved / blanketL) * 100).toFixed(1);
          ev('Treatment Agent', `Precision spray started — ${precisionL}L target vs ${blanketL}L conventional`, '💧');
          // Animate litre counter
          const savedTimer = setInterval(() => {
            setLitresSaved(v => { const next = Math.min(v + 0.25, totalSaved); return Math.round(next * 10) / 10; });
          }, 150);
          setLitresTimer(savedTimer);
          await sleep(2800);
          clearInterval(savedTimer);
          setLitresSaved(totalSaved);
          await api(`/api/missions/${mission.mission_id}/status?action=complete`, { method:'POST' });
          ev('Treatment Agent', `✓ Treatment complete — ${activeScenario.affected_area_acres} acres, ${precisionL}L precision vs ${blanketL}L blanket (−${pctSaved}%)`, '✅');
          await sleep(1000);

          // Stage 6: Contain
          setStage(5);
          setContainment(true);
          addContainmentRing(det.latitude, det.longitude);
          ev('Mission Controller', '🟢 OUTBREAK CONTAINED — OUT-' + String(conf.outbreak_id).padStart(4,'0'), '🟢');
          ev('Notification Agent', `Farmer notification dispatched in local language`, '📱');
          setDone(true);
          await sleep(1200);
        } catch (e) {
          console.error('Demo error:', e.message);
          setError(e.message || 'demo');
        } finally { setRunning(false); }
      };

      const steps = [
        { key: 'detect', label: t('s1'), busy: t('detecting'), icon: '🔍' },
        { key: 'predict', label: t('s2'), busy: t('predicting'), icon: '📈' },
        { key: 'select', label: t('s3'), busy: t('dispatching'), icon: '⚙️' },
        { key: 'route', label: t('s4'), busy: null, icon: '🛩️' },
        { key: 'treat', label: t('s5'), busy: t('treating'), icon: '💧' },
        { key: 'contain', label: t('s6'), busy: t('containing'), icon: '🟢' },
      ];
      const stepIndex = stage < 0 ? -1 : stage;
      const ob = data.ob || {};
      const sel = data.sel || {};
      const cand = data.cand || {};
      const mission = data.mission || {};
      const spread = data.spread || {};

      return (
        <div className="h-full bg-paper-100 flex flex-col">
          <div className="bg-white border-b border-paper-200 px-4 py-3 flex items-center gap-3 shrink-0">
            {!running && <button onClick={onExit} aria-label="Exit Demo" title="Back to Landing" className="p-1.5 rounded-lg text-ink-400 hover:bg-paper-100 flex items-center gap-1 font-semibold text-xs">{I.arrowLeft('w-5 h-5')}<span>Exit</span></button>}
            <span className="text-brand-600">{I.shield('w-5 h-5')}</span>
            <div className="flex-1">
              <div className="font-semibold text-ink-800">FarmShield Live Demo</div>
              <div className="text-xs text-ink-400">{t('demoFarm')}</div>
            </div>
            <span className="font-mono text-sm text-ink-600 bg-paper-100 border border-paper-200 rounded-md px-2 py-1">{fmt(elapsed)}</span>
            {onRubrics && (
              <button onClick={onRubrics} className="text-xs font-bold bg-amber-400 hover:bg-amber-300 text-amber-950 border border-amber-500/40 rounded-lg px-2.5 py-1.5 pressable flex items-center gap-1 shadow-sm" title="Hackwell 2.0 Rubrics Defense">
                🏆 100/100 Rubrics
              </button>
            )}
            <button onClick={onExpert} className="hidden md:block text-xs font-semibold text-ink-500 border border-paper-200 rounded-lg px-2 py-1.5 hover:bg-paper-50">{I.wrench('w-4 h-4 inline mr-1')}Expert Console</button>
          </div>

          {/* Scenario Selector Strip */}
          <div className="bg-paper-50 border-b border-paper-200 px-4 py-2 flex items-center gap-2 overflow-x-auto shrink-0">
            <span className="text-[11px] font-bold text-ink-500 uppercase tracking-wider shrink-0 flex items-center gap-1">
              ⚡ Simulation Scenario:
            </span>
            <div className="flex items-center gap-1.5 flex-nowrap">
              {scenariosList.map(sc => (
                <button key={sc.id} disabled={running} onClick={() => { setSelectedScenario(sc.id); resetAll(); }}
                  className={`px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition-all flex items-center gap-1.5 pressable ${selectedScenario===sc.id ? 'bg-brand-600 text-white shadow-sm ring-2 ring-brand-300' : 'bg-white text-ink-700 hover:bg-paper-200 border border-paper-200 disabled:opacity-50'}`}>
                  <span>{sc.icon || '🌾'}</span>
                  <span>{sc.name}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Split layout: map + panel */}
          <div className="flex-1 flex overflow-hidden">
            {/* Map */}
            <div className="flex-1 relative min-w-0">
              <div ref={mapEl} className="absolute inset-0" />
              {/* Containment success overlay */}
              {containment && (
                <div className="absolute top-4 left-1/2 -translate-x-1/2 z-[1000] bg-brand-600 text-white px-4 py-2 rounded-full font-semibold text-sm shadow-glow step-reveal flex items-center gap-2">
                  <span>🟢</span> Outbreak Contained!
                </div>
              )}
              {/* Live savings badge */}
              {litresSaved > 0 && (
                <div className="absolute bottom-4 left-4 z-[1000] bg-white border border-brand-200 rounded-app px-3 py-2 shadow-card">
                  <div className="text-xs text-ink-400">Pesticide saved</div>
                  <div className="text-lg font-black text-brand-600">{litresSaved.toFixed(1)} L</div>
                </div>
              )}
            </div>

            {/* Right panel */}
            <div className="w-80 shrink-0 flex flex-col overflow-hidden bg-paper-50 border-l border-paper-200">
              {/* Outbreak summary */}
              <div className="bg-white border-b border-paper-200 p-4">
                <div className="flex items-start justify-between gap-2">
                  <div>
                    <h2 className="font-bold text-ink-800 text-sm flex items-center gap-1.5">
                      <span>{activeScenario.icon || '🌾'}</span>
                      <span>{activeScenario.crop} · {activeScenario.pest}</span>
                    </h2>
                    <p className="text-xs text-ink-500 mt-0.5">{activeScenario.affected_area_acres} acres · {activeScenario.severity} Risk · {activeScenario.temperature}°C · {activeScenario.humidity}% RH · {activeScenario.wind_speed} km/h</p>
                  </div>
                  <span className="text-[10px] font-bold bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full flex-shrink-0 uppercase">{activeScenario.id.split('_')[0]}</span>
                </div>
                {/* Spread prediction mini chart */}
                {spread && spread.predictions && spread.predictions.length > 0 && (
                  <div className="mt-3 pt-3 border-t border-paper-100">
                    <p className="text-[10px] text-ink-400 font-semibold uppercase tracking-wide mb-2">Predicted Spread (acres)</p>
                    <div className="flex items-end gap-1 h-10">
                      {spread.predictions.map((p, i) => {
                        const maxA = spread.predictions[spread.predictions.length-1].area;
                        const h = Math.max(4, (p.area / maxA) * 36);
                        const colors = ['#3a9e3d','#7ab33d','#d97706','#e05d3d','#dc2626'];
                        return (
                          <div key={p.hours} className="flex-1 flex flex-col items-center gap-0.5">
                            <div className="rounded-sm w-full" style={{ height: h, background: colors[i] }}></div>
                            <div className="text-[8px] text-ink-400">{p.hours === 0 ? 'Now' : `+${p.hours}h`}</div>
                          </div>
                        );
                      })}
                    </div>
                    <p className="text-[9px] text-ink-400 mt-1">Prototype AI Simulation · ±15% band</p>
                  </div>
                )}
              </div>

              {/* Timeline */}
              <div className="flex-1 overflow-y-auto p-3">
                <p className="text-[10px] font-semibold text-ink-400 uppercase tracking-wide mb-2">{t('responseProgress')}</p>
                <div className="space-y-0">
                  {steps.map((s, i) => {
                    const isDone = stepIndex > i || done;
                    const isNow = stepIndex === i && !done;
                    return (
                      <div key={s.key} className="flex gap-2.5">
                        <div className="flex flex-col items-center">
                          <div className={`tl-dot text-sm ${isDone ? 'bg-brand-600 text-white' : isNow ? 'bg-brand-100 text-brand-700 border border-brand-300' : 'bg-paper-100 text-ink-400 border border-paper-200'}`}>
                            {isDone ? '✓' : s.icon}
                          </div>
                          {i < steps.length - 1 && <div className={`w-px flex-1 min-h-[20px] ${isDone ? 'bg-brand-400' : 'bg-paper-200'}`}></div>}
                        </div>
                        <div className={`pb-3 flex-1 ${i === steps.length - 1 ? 'pb-0' : ''}`}>
                          <p className={`text-sm font-medium ${isDone ? 'text-ink-800' : isNow ? 'text-brand-700 font-semibold' : 'text-ink-400'}`}>
                            {s.label}
                            {isNow && s.busy && <span className="ml-1 text-xs font-normal text-ink-400 animate-pulse">{s.busy}</span>}
                          </p>
                          {s.key === 'predict' && isDone && spread && spread.predictions && (
                            <p className="text-xs text-ink-400 mt-0.5">2.1 → 14.2 acres in 24h · growth rate {spread.growth_rate}</p>
                          )}
                          {s.key === 'select' && isDone && cand && cand.name && (
                            <p className="text-xs text-ink-400 mt-0.5">{cand.name} · {cand.battery}% battery · {cand.distance_km} km</p>
                          )}
                          {s.key === 'treat' && isDone && (
                            <p className="text-xs text-brand-600 font-medium mt-0.5">8.4L → 1.8L precision (−78.6%)</p>
                          )}
                          {s.key === 'contain' && isDone && (
                            <p className="text-xs text-brand-600 font-medium mt-0.5">Farmer notified via SMS (Tamil)</p>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>

                {/* Event log */}
                {events.length > 0 && (
                  <div className="mt-3 pt-3 border-t border-paper-200">
                    <button onClick={() => setShowEvents(s => !s)} className="flex items-center justify-between w-full text-[10px] font-semibold text-ink-400 uppercase tracking-wide mb-2">
                      <span>System Events ({events.length})</span>
                      {I.chevron(`w-3 h-3 transition-transform ${showEvents ? 'rotate-90' : ''}`)}
                    </button>
                    {showEvents && (
                      <div ref={evLogRef} className="max-h-48 overflow-y-auto space-y-1 dark-scroll">
                        {events.map((e, i) => (
                          <div key={i} className="flex gap-2 text-[10px]">
                            <span className="text-ink-400 font-mono shrink-0">{e.time}</span>
                            <span className="text-brand-600 font-semibold shrink-0 w-16 truncate">{e.a.split(' ')[0]}</span>
                            <span className="text-ink-600 leading-tight">{e.m}</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </div>

              {/* Controls */}
              <div className="p-3 border-t border-paper-200 bg-white space-y-2">
                {error && (
                  <div className="bg-red-50 border border-red-200 rounded-app p-3">
                    <p className="text-sm font-semibold text-red-700 mb-1">⚠ Demo Error</p>
                    <p className="text-xs text-red-600 mb-2">{error === 'demo' ? 'A backend API call failed. Please retry.' : error}</p>
                    <button onClick={run} className="w-full py-2 bg-red-600 text-white rounded-app text-xs font-bold">↺ Retry Demo</button>
                  </div>
                )}
                <div className="flex gap-2">
                  {!done ? (
                    <button onClick={run} disabled={running}
                      className="flex-1 py-3 rounded-app bg-brand-600 text-white font-semibold text-sm pressable disabled:opacity-50 flex items-center justify-center gap-2">
                      {running ? <><span className="animate-pulse">●</span> {t('running')}</> : <>{I.play('w-4 h-4')} {t('startDemo')}</>}
                    </button>
                  ) : (
                    <button onClick={run} className="flex-1 py-3 rounded-app bg-brand-600 text-white font-semibold text-sm pressable">
                      {t('runAgain')}
                    </button>
                  )}
                  <button onClick={resetAll} disabled={running}
                    className="px-3 py-3 rounded-app bg-white border border-paper-300 text-ink-600 pressable disabled:opacity-50">
                    {I.refresh('w-4 h-4')}
                  </button>
                </div>
                {done && (
                  <button onClick={onExpert} className="w-full py-2.5 rounded-app bg-white border border-paper-300 text-ink-700 font-semibold text-sm pressable flex items-center justify-center gap-2">
                    {I.wrench('w-4 h-4 text-ink-400')} View autonomous system →
                  </button>
                )}
                <p className="text-center text-[10px] text-ink-400">{t('prototypeNote')}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────── EXPERT CONSOLE ─────────────────── */
    function ExpertConsole({ onFarmer, onDemo }) {
      const [page, setPage] = useState('dashboard');
      const [darkMode, setDarkMode] = useState(true);
      const [outbreaks, setOutbreaks] = useState([]);
      const [agents, setAgents] = useState([]);
      const [missions, setMissions] = useState([]);
      const [events, setEvents] = useState([]);
      const [analytics, setAnalytics] = useState(null);
      const [fields, setFields] = useState([]);
      const [health, setHealth] = useState(null);
      const [scanResult, setScanResult] = useState(null);
      const [scanImage, setScanImage] = useState(null);
      const [scanning, setScanning] = useState(false);
      const [sampleFields, setSampleFields] = useState([]);
      const [rotation, setRotation] = useState(null);
      const [resistanceResult, setResistanceResult] = useState(null);
      const [resistancePest, setResistancePest] = useState('Bollworm');
      const [resistanceCrop, setResistanceCrop] = useState('Cotton');
      const [resistanceApps, setResistanceApps] = useState(0);
      const [waypointMission, setWaypointMission] = useState(null);
      const [waypointData, setWaypointData] = useState(null);
      const [weather, setWeather] = useState(null);
      const [tickerText, setTickerText] = useState('');
      const logRef = useRef(null);
      const mapRef = useRef(null);
      const mapEl = useRef(null);
      const layersRef = useRef([]);

      const load = useCallback(async () => {
        const [o, a, m, e, an, f, h, w, rot] = await Promise.all([
          api('/api/outbreaks'), api('/api/agents'), api('/api/missions'),
          api('/api/events?limit=80'), api('/api/analytics'), api('/api/fields'),
          api('/api/health'), api('/api/weather'), api('/api/chemical-rotation'),
        ]);
        if (o) setOutbreaks(o); if (a) setAgents(a); if (m) setMissions(m);
        if (e) { setEvents(e.reverse()); }
        if (an) setAnalytics(an); if (f) setFields(f); if (h) setHealth(h);
        if (w) setWeather(w); if (rot) setRotation(rot);
      }, []);

      useEffect(() => { load(); }, [load]);
      useEffect(() => { if (logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [events]);

      // Build ticker text from events
      useEffect(() => {
        if (events.length > 0) {
          const recent = events.slice(-8).map(e => `[${e.agent_name}] ${e.message}`).join('  ·  ');
          setTickerText(recent);
        }
      }, [events]);

      useEffect(() => {
        if (page !== 'map' || !mapEl.current) return;
        if (mapRef.current) { setTimeout(() => mapRef.current.invalidateSize(), 50); return; }
        const map = L.map(mapEl.current, { zoomControl: false, attributionControl: false });
        L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', { maxZoom: 20, subdomains: ['mt0', 'mt1', 'mt2', 'mt3'], attribution: 'Google Maps Satellite' }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        map.setView([10.79, 78.705], 15);
        mapRef.current = map;
        return () => {};
      }, [page]);

      useEffect(() => {
        const map = mapRef.current;
        if (page !== 'map' || !map) return;
        layersRef.current.forEach(l => map.removeLayer(l));
        layersRef.current = [];
        fields.forEach(f => {
          if (!f.polygon || !Array.isArray(f.polygon) || f.polygon.length < 3) return;
          const valid = f.polygon.every(p => Array.isArray(p) && p.length === 2 && !isNaN(p[0]) && !isNaN(p[1]));
          if (!valid) return;
          const color = f.health_status === 'healthy' ? '#2d8230' : '#d97706';
          const poly = L.polygon(f.polygon, { color, weight: 2, fillOpacity: 0.12 }).addTo(map)
            .bindPopup(`<b>${f.name}</b><br>${f.crop} · ${f.area_acres} acres<br>${f.health_status === 'healthy' ? '🟢 Healthy' : '🟡 Stressed'}`);
          layersRef.current.push(poly);
        });
        outbreaks.filter(o => o.status === 'active' && o.latitude != null && o.longitude != null && !isNaN(o.latitude) && !isNaN(o.longitude)).forEach(o => {
          const icon = L.divIcon({ html: `<div class="marker-pin pin-red"></div>`, iconSize:[18,18], iconAnchor:[9,9], className:'' });
          const mk = L.marker([o.latitude, o.longitude], { icon }).addTo(map)
            .bindPopup(`<b>OUT-${String(o.id).padStart(4,'0')}</b><br>${o.pest} · ${o.affected_area_acres} acres<br>Risk: ${o.risk_level}`);
          layersRef.current.push(mk);
          layersRef.current.push(L.circle([o.latitude, o.longitude], { radius: o.affected_area_acres*120, color:'#dc2626', weight:1, fillOpacity:0.07 }).addTo(map));
        });
        agents.filter(a => a.status === 'AVAILABLE' && a.latitude != null && a.longitude != null && !isNaN(a.latitude) && !isNaN(a.longitude)).forEach(a => {
          const icon = L.divIcon({ html: `<div class="marker-pin pin-green"></div>`, iconSize:[14,14], iconAnchor:[7,7], className:'' });
          const mk = L.marker([a.latitude, a.longitude], { icon }).addTo(map).bindTooltip(`${a.name} · available`);
          layersRef.current.push(mk);
        });
      }, [fields, outbreaks, agents, page]);

      const exportLog = () => {
        const content = events.map(e => `${e.created_at ? e.created_at.slice(0,19) : ''} | ${e.agent_name.padEnd(25)} | ${e.event_type.padEnd(12)} | ${e.message}`).join('\n');
        const blob = new Blob([`FarmShield Event Log Export\n${'='.repeat(80)}\n${content}`], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'farmshield_audit_log.txt'; a.click();
      };

      const abortMission = async (missionId, missionCode) => {
        if (!confirm(`Abort mission ${missionCode}? Agent will return to base.`)) return;
        const res = await api(`/api/missions/${missionId}/abort?reason=operator_abort`, { method: 'POST' });
        if (res) { load(); }
      };

      const dm = darkMode;
      const nav = [
        { key:'dashboard', label:'Dashboard', icon:I.grid },
        { key:'map', label:'Field Map', icon:I.mapPin },
        { key:'outbreaks', label:'Outbreaks', icon:I.alert },
        { key:'missions', label:'Missions', icon:I.drone },
        { key:'agents', label:'Fleet', icon:I.settings },
        { key:'events', label:'Event Log', icon:I.history },
        { key:'analytics', label:'Analytics', icon:I.chart },
        { key:'rotation', label:'Chem. Rotation', icon:I.flask },
        { key:'aerial', label:'Aerial Scan', icon:I.image },
        { key:'resistance', label:'Resistance Risk', icon:I.bug },
        { key:'waypoints', label:'Waypoints', icon:I.drone },
      ];

      const Chip = ({ tone, children }) => {
        const tones = {
          green: dm ? 'bg-green-900/50 text-green-400' : 'bg-brand-50 text-brand-700',
          red: dm ? 'bg-red-900/50 text-red-400' : 'bg-red-50 text-red-600',
          amber: dm ? 'bg-amber-900/50 text-amber-400' : 'bg-amber2-100 text-amber2-500',
          gray: dm ? 'bg-dark-600 text-dark-400' : 'bg-paper-100 text-ink-500',
          blue: dm ? 'bg-blue-900/50 text-blue-400' : 'bg-blue-50 text-blue-600',
        };
        return <span className={`text-xs font-semibold px-2.5 py-1 rounded-full ${tones[tone]||tones.gray}`}>{children}</span>;
      };

      const StatCard = ({ label, value, tone='green', sub='', sparkData=null }) => (
        <div className={`${dm ? 'dark-card border rounded-app p-4' : 'bg-white border border-paper-200 rounded-app p-4 shadow-card'}`}>
          <div className={`text-xs font-medium ${dm ? 'text-green-300' : 'text-ink-400'}`}>{label}</div>
          <div className={`text-2xl font-bold mt-1 ${tone==='red' ? (dm ? 'text-red-400' : 'text-red-600') : tone==='green' ? (dm ? 'text-green-400' : 'text-brand-600') : tone==='blue' ? (dm ? 'text-blue-400' : 'text-blue-600') : (dm ? 'text-dark-400' : 'text-ink-800')}`}>{value}</div>
          {sub && <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{sub}</div>}
          {sparkData && <div className="mt-2"><Sparkline data={sparkData} color={tone === 'red' ? '#dc2626' : '#3a9e3d'} /></div>}
        </div>
      );

      const activeObs = outbreaks.filter(o => o.status === 'active');
      const activeMs = missions.filter(m => !['completed','aborted'].includes(m.status));

      const panelClass = dm ? 'h-full flex flex-col dark-panel' : 'h-full flex flex-col bg-paper-100';
      const headerClass = dm ? 'dark-header border-b px-5 py-3 flex items-center gap-3 shrink-0 dark-border' : 'bg-white border-b border-paper-200 px-5 py-3 flex items-center gap-3 shrink-0';
      const navClass = dm ? 'w-52 dark-nav border-r py-3 shrink-0 dark-border' : 'w-52 bg-white border-r border-paper-200 py-3 shrink-0';
      const navItemBase = dm ? 'w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium pressable dark-nav-item' : 'w-full flex items-center gap-2.5 px-4 py-2.5 text-sm font-medium pressable';
      const navItemActive = dm ? 'active' : 'text-brand-700 bg-brand-50 border-r-2 border-brand-600';
      const navItemInactive = dm ? '' : 'text-ink-500 hover:bg-paper-50';
      const cardClass = dm ? 'dark-card border rounded-app dark-border' : 'bg-white border border-paper-200 rounded-app shadow-card';

      return (
        <div className={panelClass}>
          {/* Header */}
          <header className={headerClass}>
            <span className={dm ? 'text-green-400' : 'text-brand-600'}>{I.shield('w-5 h-5')}</span>
            <div className="flex-1">
              <div className={`font-semibold leading-tight ${dm ? 'text-white' : 'text-ink-800'}`}>FarmShield Operations</div>
              <div className={`text-xs leading-tight ${dm ? 'text-green-300' : 'text-ink-400'}`}>
                {health ? <span className="inline-flex items-center gap-1"><span className={`w-1.5 h-1.5 rounded-full ${health.database === 'connected' ? 'bg-green-400' : 'bg-red-400'}`}></span>API {health.database}</span> : '…'}
                <span className="mx-2 opacity-30">|</span>Demo Mode
                {weather && <span className="ml-2">{I.thermometer('w-3 h-3 inline')} {weather.temperature_c}°C · {weather.humidity_percent}%RH</span>}
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => setDarkMode(d => !d)}
                className={`p-1.5 rounded-lg pressable ${dm ? 'text-yellow-400 bg-yellow-900/30 hover:bg-yellow-900/50' : 'text-ink-500 hover:bg-paper-100'}`}
                title="Toggle dark mode">
                {dm ? I.sun('w-4 h-4') : I.moon('w-4 h-4')}
              </button>
              <button onClick={() => load()} className={`p-1.5 rounded-lg pressable ${dm ? 'text-dark-400 hover:bg-dark-700' : 'text-ink-400 hover:bg-paper-100'}`} title="Refresh">{I.refresh('w-4 h-4')}</button>
              <button onClick={onDemo} className={`text-sm font-semibold border rounded-lg px-3 py-1.5 ${dm ? 'text-green-400 border-green-800 hover:bg-green-900/30' : 'text-brand-600 border-brand-200 hover:bg-brand-50'}`}>Live Demo</button>
              <button onClick={onFarmer} className={`text-sm font-semibold border rounded-lg px-3 py-1.5 ${dm ? 'text-dark-400 border-dark-600 hover:bg-dark-700' : 'text-ink-600 border-paper-300 hover:bg-paper-50'}`}>Farmer App</button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden">
            {/* Sidebar */}
            <nav className={navClass}>
              {nav.map(n => (
                <button key={n.key} onClick={() => setPage(n.key)}
                  className={`${navItemBase} ${page===n.key ? navItemActive : navItemInactive}`}>
                  {n.icon('w-4 h-4')}
                  <span className="text-sm">{n.label}</span>
                </button>
              ))}
            </nav>

            {/* Content + Ticker */}
            <div className="flex-1 flex flex-col overflow-hidden">
              <main className="flex-1 overflow-y-auto">

                {/* DASHBOARD */}
                {page === 'dashboard' && (
                  <div className="p-5 space-y-5 max-w-5xl">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                      <StatCard label="Active outbreaks" value={activeObs.length} tone={activeObs.length ? 'red' : 'green'} sub={activeObs.length ? 'Response required' : 'All clear'} sparkData={[1,2,1,3,1,0,activeObs.length]} />
                      <StatCard label="Active missions" value={activeMs.length} tone="amber" sub="In progress" sparkData={[0,1,2,1,2,1,activeMs.length]} />
                      <StatCard label="Available agents" value={agents.filter(a=>a.status==='AVAILABLE').length} sub={`of ${agents.length} total`} sparkData={[3,4,3,5,4,3,agents.filter(a=>a.status==='AVAILABLE').length]} />
                      <StatCard label="Fields monitored" value={analytics ? analytics.fields_monitored : '—'} sub={analytics ? `${analytics.area_monitored_acres} acres` : ''} />
                    </div>

                    {/* Weather + quick stats */}
                    {weather && analytics && (
                      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Pest Risk Level</div>
                          <div className={`text-xl font-bold ${weather.pest_risk === 'HIGH' ? (dm ? 'text-red-400' : 'text-red-600') : weather.pest_risk === 'MODERATE' ? (dm ? 'text-amber-400' : 'text-amber2-500') : (dm ? 'text-green-400' : 'text-brand-600')}`}>{weather.pest_risk}</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{weather.temperature_c}°C · {weather.humidity_percent}% RH</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>CO₂ Saved</div>
                          <div className={`text-xl font-bold ${dm ? 'text-green-400' : 'text-brand-600'}`}>{analytics.co2_saved_kg} kg</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>vs. blanket tractor spray</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Pesticide Saved</div>
                          <div className={`text-xl font-bold ${dm ? 'text-green-400' : 'text-brand-600'}`}>{analytics.pesticide_savings_percent}%</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{analytics.estimated_pesticide_saved_l} L saved</div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`text-xs font-medium mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Yield Protected</div>
                          <div className={`text-xl font-bold ${dm ? 'text-blue-400' : 'text-blue-600'}`}>₹{(analytics.yield_protected_inr/1000).toFixed(0)}K</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Prototype Estimate</div>
                        </div>
                      </div>
                    )}

                    {/* Active Outbreaks */}
                    <div className={cardClass}>
                      <div className={`px-5 py-4 border-b flex items-center justify-between ${dm ? 'dark-border' : 'border-paper-100'}`}>
                        <h3 className={`font-semibold ${dm ? 'text-white' : 'text-ink-800'}`}>Active Outbreaks</h3>
                        {activeObs.length > 0 && <Chip tone="red">{activeObs.length} open</Chip>}
                      </div>
                      {activeObs.length === 0 ? (
                        <div className={`px-5 py-8 text-center text-sm ${dm ? 'text-green-300' : 'text-ink-400'}`}>No active outbreaks. All fields clear. 🟢</div>
                      ) : activeObs.map(o => (
                        <div key={o.id} className={`px-5 py-4 flex items-center justify-between gap-4 border-b last:border-0 ${dm ? 'dark-border' : 'border-paper-100'}`}>
                          <div>
                            <div className={`font-medium ${dm ? 'text-white' : 'text-ink-800'}`}>{o.crop} · Possible {o.pest}</div>
                            <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>OUT-{String(o.id).padStart(4,'0')} · {o.affected_area_acres} acres · {o.predictions && o.predictions.length ? `→ ${o.predictions[o.predictions.length-1].area} acres in 24h` : ''}</div>
                          </div>
                          <div className="flex items-center gap-3">
                            <Chip tone="red">High risk</Chip>
                            <button onClick={() => setPage('map')} className={`text-sm font-semibold ${dm ? 'text-green-400' : 'text-brand-600'}`}>View map</button>
                          </div>
                        </div>
                      ))}
                    </div>

                    {/* Fleet status */}
                    <div className={cardClass}>
                      <div className={`px-5 py-4 border-b ${dm ? 'dark-border' : 'border-paper-100'}`}><h3 className={`font-semibold ${dm ? 'text-white' : 'text-ink-800'}`}>Fleet Status</h3></div>
                      <div className={`divide-y ${dm ? 'divide-dark-700' : 'divide-paper-100'}`}>
                        {agents.map(a => (
                          <div key={a.id} className="px-5 py-3 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <span className={dm ? 'text-dark-400' : 'text-ink-400'}>{a.agent_type === 'DRONE' ? I.drone('w-5 h-5') : I.settings('w-5 h-5')}</span>
                              <div>
                                <div className={`font-medium text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>{a.name}</div>
                                <div className={`text-xs ${dm ? 'text-green-300' : 'text-ink-400'}`}>{a.agent_type} · {a.missions_completed} mission{a.missions_completed === 1 ? '' : 's'}</div>
                              </div>
                            </div>
                            <div className="flex items-center gap-4">
                              {/* Animated battery bar */}
                              <div className="flex items-center gap-1.5">
                                <div className={`w-20 h-2 rounded-full ${dm ? 'bg-dark-600' : 'bg-paper-200'}`}>
                                  <div className={`battery-bar h-full rounded-full ${a.battery_percent > 60 ? 'bg-green-500' : a.battery_percent > 30 ? 'bg-amber-500' : 'bg-red-500'}`}
                                    style={{width:`${a.battery_percent}%`}} />
                                </div>
                                <span className={`text-xs font-mono ${dm ? 'text-dark-400' : 'text-ink-500'}`}>{a.battery_percent}%</span>
                              </div>
                              <Chip tone={a.status==='AVAILABLE'?'green':a.status==='CHARGING'?'amber':a.status==='EN_ROUTE'?'blue':'gray'}>{a.status}</Chip>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* MAP */}
                {page === 'map' && (
                  <div className="h-full p-4">
                    <div className="h-full rounded-app overflow-hidden border border-paper-200 shadow-card relative">
                      <div ref={mapEl} style={{ position: 'absolute', inset: 0 }}></div>
                      <div className={`absolute top-3 left-3 z-[1001] ${dm ? 'bg-dark-800/95 border-dark-600' : 'bg-white/95 border-paper-200'} border rounded-app px-3.5 py-2.5 shadow-card text-xs space-y-1.5`}>
                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-sm" style={{background:'#2d8230'}}></span><span className={dm ? 'text-dark-300' : ''}>Healthy field</span></div>
                        <div className="flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-sm" style={{background:'#d97706'}}></span><span className={dm ? 'text-dark-300' : ''}>Stressed field</span></div>
                        <div className="flex items-center gap-2"><span className="marker-pin pin-red" style={{width:10,height:10,borderWidth:2}}></span><span className={dm ? 'text-dark-300' : ''}>Active outbreak</span></div>
                        <div className="flex items-center gap-2"><span className="marker-pin pin-green" style={{width:10,height:10,borderWidth:2}}></span><span className={dm ? 'text-dark-300' : ''}>Available agent</span></div>
                      </div>
                    </div>
                  </div>
                )}

                {/* OUTBREAKS */}
                {page === 'outbreaks' && (
                  <div className="p-5 max-w-4xl space-y-3">
                    {outbreaks.map(o => (
                      <div key={o.id} className={`${cardClass} p-4`}>
                        <div className="flex items-center justify-between mb-2">
                          <span className={`font-semibold ${dm ? 'text-white' : 'text-ink-800'}`}>OUT-{String(o.id).padStart(4,'0')} · {o.pest}</span>
                          <Chip tone={o.status==='active'?'red':'green'}>{o.status}</Chip>
                        </div>
                        <div className={`text-sm ${dm ? 'text-dark-400' : 'text-ink-500'}`}>{o.crop} · {o.affected_area_acres} acres · {o.risk_level} risk</div>
                        {o.predictions && o.predictions.length > 0 && (
                          <div className="mt-3 space-y-1.5">
                            <p className={`text-xs font-semibold ${dm ? 'text-dark-400' : 'text-ink-500'}`}>Spread forecast:</p>
                            {o.predictions.map(p => (
                              <div key={p.hours} className="flex items-center gap-3 text-xs">
                                <span className={`w-14 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{p.hours === 0 ? 'Now' : `+${p.hours}h`}</span>
                                <div className={`flex-1 h-3 rounded overflow-hidden ${dm ? 'bg-dark-600' : 'bg-paper-100'}`}>
                                  <div className="h-full bg-amber-500/70" style={{ width: `${Math.min(p.area/15*100,100)}%` }}></div>
                                </div>
                                <span className={`w-16 text-right font-medium ${dm ? 'text-dark-300' : 'text-ink-700'}`}>{p.area} ac</span>
                              </div>
                            ))}
                            <p className={`text-[10px] pt-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Prototype AI Simulation</p>
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {/* MISSIONS */}
                {page === 'missions' && (
                  <div className="p-5 max-w-4xl space-y-3">
                    {missions.map(m => (
                      <div key={m.id} className={`${cardClass} p-4 flex items-center justify-between gap-4`}>
                        <div>
                          <div className={`font-medium ${dm ? 'text-white' : 'text-ink-800'}`}>{m.mission_code} · {m.agent_name}</div>
                          <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{m.outbreak_pest} · {m.target_area_acres} acres · {m.precision_chemical_l}L precision (vs {m.estimated_chemical_l}L blanket)</div>
                        </div>
                        <div className="flex items-center gap-2">
                          <Chip tone={m.status==='completed'?'green':m.status==='aborted'?'gray':'amber'}>{m.status}</Chip>
                          {!['completed','aborted'].includes(m.status) && (
                            <button onClick={() => abortMission(m.id, m.mission_code)}
                              className="px-2.5 py-1 rounded-lg text-xs font-semibold bg-red-600 text-white hover:bg-red-700 pressable flex items-center gap-1">
                              {I.stopCircle('w-3 h-3')} Abort
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* AGENTS */}
                {page === 'agents' && (
                  <div className="p-5 max-w-4xl">
                    <div className={cardClass}>
                      <div className={`divide-y ${dm ? 'divide-dark-700' : 'divide-paper-100'}`}>
                        {agents.map(a => (
                          <div key={a.id} className="px-5 py-4 flex items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                              <span className={dm ? 'text-dark-400' : 'text-ink-400'}>{a.agent_type === 'DRONE' ? I.drone('w-5 h-5') : I.settings('w-5 h-5')}</span>
                              <div>
                                <div className={`font-medium text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>{a.name}</div>
                                <div className={`text-xs ${dm ? 'text-green-300' : 'text-ink-400'}`}>{a.agent_type} · {a.speed_kmh} km/h · {a.payload_capacity_l}L payload · {a.missions_completed} missions done</div>
                                <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Treats: {(a.treatment_compatibility||[]).join(', ')}</div>
                              </div>
                            </div>
                            <div className="flex flex-col items-end gap-2">
                              <Chip tone={a.status==='AVAILABLE'?'green':a.status==='CHARGING'?'amber':a.status==='EN_ROUTE'?'blue':'gray'}>{a.status}</Chip>
                              <div className="flex items-center gap-1.5">
                                <div className={`w-24 h-2 rounded-full ${dm ? 'bg-dark-600' : 'bg-paper-200'}`}>
                                  <div className={`battery-bar h-full rounded-full ${a.battery_percent > 60 ? 'bg-green-500' : a.battery_percent > 30 ? 'bg-amber-500' : 'bg-red-500 battery'}`}
                                    style={{width:`${a.battery_percent}%`}} />
                                </div>
                                <span className={`text-xs font-mono ${dm ? 'text-dark-400' : 'text-ink-500'}`}>{a.battery_percent}%</span>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* EVENT LOG */}
                {page === 'events' && (
                  <div className="p-5 max-w-4xl">
                    <div className={cardClass}>
                      <div className={`px-5 py-4 border-b flex items-center justify-between ${dm ? 'dark-border' : 'border-paper-100'}`}>
                        <h3 className={`font-semibold ${dm ? 'text-white' : 'text-ink-800'}`}>Audit Event Log</h3>
                        <div className="flex gap-2">
                          <button onClick={load} className={`text-xs font-semibold ${dm ? 'text-green-400' : 'text-brand-600'}`}>Refresh</button>
                          <button onClick={exportLog}
                            className={`flex items-center gap-1 text-xs font-semibold px-2.5 py-1 rounded-lg ${dm ? 'text-dark-300 bg-dark-600 hover:bg-dark-500' : 'text-ink-600 bg-paper-100 hover:bg-paper-200'}`}>
                            {I.download('w-3 h-3')} Export
                          </button>
                        </div>
                      </div>
                      <div ref={logRef} className={`p-4 max-h-[70vh] overflow-y-auto font-mono text-xs space-y-1 ${dm ? 'dark-scroll' : ''}`}>
                        {events.map((e, i) => (
                          <div key={i} className="flex gap-3">
                            <span className={dm ? 'text-dark-400' : 'text-ink-400'}>{e.created_at ? e.created_at.slice(11,19) : ''}</span>
                            <span className={`font-semibold min-w-[140px] ${dm ? 'text-green-400' : 'text-brand-600'}`}>{e.agent_name}</span>
                            <span className={`min-w-[80px] ${e.severity === 'warning' ? (dm ? 'text-amber-400' : 'text-amber2-500') : e.severity === 'success' ? (dm ? 'text-green-400' : 'text-brand-600') : (dm ? 'text-dark-400' : 'text-ink-400')}`}>[{e.event_type}]</span>
                            <span className={dm ? 'text-dark-300' : 'text-ink-600'}>{e.message}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* ANALYTICS */}
                {page === 'analytics' && analytics && (
                  <div className="p-5 max-w-5xl space-y-4">
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                      <StatCard label="Outbreaks contained" value={analytics.contained_outbreaks} sparkData={[0,1,1,2,1,2,analytics.contained_outbreaks]} />
                      <StatCard label="Missions completed" value={analytics.completed_missions} sparkData={[0,1,1,1,2,2,analytics.completed_missions]} />
                      <StatCard label="Pesticide reduction" value={`${analytics.pesticide_savings_percent}%`} sub="Prototype Estimate" sparkData={[60,65,70,72,75,78,analytics.pesticide_savings_percent]} />
                      <StatCard label="Avg response time" value={`${analytics.avg_response_time_min} min`} sub="dispatched to zone" sparkData={[20,18,15,12,10,8,analytics.avg_response_time_min]} />
                      <StatCard label="CO₂ saved" value={`${analytics.co2_saved_kg} kg`} sub="vs tractor spray" tone="blue" />
                      <StatCard label="Water saved" value={`${analytics.water_saved_l} L`} sub="reduced dilution volume" tone="blue" />
                      <StatCard label="Yield protected" value={analytics.yield_protected_inr > 0 ? `₹${(analytics.yield_protected_inr/1000).toFixed(0)}K` : '—'} sub="Prototype Estimate" tone="green" />
                      <StatCard label="Pesticide saved" value={`${analytics.estimated_pesticide_saved_l} L`} sub="from precision dosing" tone="green" />
                    </div>
                    <p className={`text-xs ${dm ? 'text-green-300' : 'text-ink-400'}`}>Prototype estimates computed from stored demo data. Numbers labeled "Prototype Estimate" are model-computed, not field-validated.</p>
                  </div>
                )}

                {/* CHEMICAL ROTATION */}
                {page === 'rotation' && rotation && (
                  <div className="p-5 max-w-4xl space-y-4">
                    <div>
                      <h2 className={`text-lg font-bold ${dm ? 'text-white' : 'text-ink-800'}`}>Chemical Rotation Advisor</h2>
                      <p className={`text-sm mt-1 ${dm ? 'text-dark-400' : 'text-ink-500'}`}>IRAC-based rotation to prevent resistance build-up. Rotate groups every 2 sprays.</p>
                    </div>
                    {rotation.rotations && rotation.rotations.map((r, i) => (
                      <div key={i} className={`${cardClass} p-5`}>
                        <div className="flex items-center justify-between mb-3">
                          <div>
                            <span className={`font-bold ${dm ? 'text-white' : 'text-ink-800'}`}>{r.pest}</span>
                            <span className={`ml-2 text-sm ${dm ? 'text-dark-400' : 'text-ink-500'}`}>in {r.crop}</span>
                          </div>
                          <Chip tone="amber">IRAC Rotation</Chip>
                        </div>
                        <div className="grid grid-cols-3 gap-3 mb-3">
                          {r.irac_groups.map((g, j) => (
                            <div key={j} className={`rounded-lg p-3 ${dm ? 'bg-dark-700' : 'bg-paper-50'}`}>
                              <div className={`font-semibold text-sm ${dm ? 'text-green-400' : 'text-brand-600'}`}>{r.chemicals[j]}</div>
                              <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{g}</div>
                              <div className={`text-xs mt-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>PHI: {r.preharvest_interval_days[j]} days</div>
                            </div>
                          ))}
                        </div>
                        <p className={`text-xs ${dm ? 'text-amber-400 bg-amber-900/20' : 'text-amber2-500 bg-amber2-50'} rounded-lg px-3 py-2`}>⚠ {r.rotation_note}</p>
                      </div>
                    ))}
                    <div className={`${cardClass} p-4`}>
                      <p className={`text-sm font-semibold ${dm ? 'text-red-400' : 'text-red-600'}`}>🚨 Resistance Alert Protocol</p>
                      <p className={`text-xs mt-1 ${dm ? 'text-dark-400' : 'text-ink-500'}`}>{rotation.resistance_warning}</p>
                    </div>
                  </div>
                )}

                {/* AERIAL SCAN */}
                {page === 'aerial' && (
                  <AerialScanPage darkMode={dm} scanResult={scanResult} setScanResult={setScanResult}
                    scanImage={scanImage} setScanImage={setScanImage}
                    scanning={scanning} setScanning={setScanning}
                    sampleFields={sampleFields} setSampleFields={setSampleFields}
                    onConfirm={async (detId) => {
                      if (!detId) return;
                      const r = await api(`/api/detections/${detId}/confirm`, {method:'POST'});
                      if (r) { alert('Outbreak confirmed: OUT-' + String(r.outbreak_id).padStart(4,'0')); load(); }
                    }} />
                )}

                {/* RESISTANCE RISK EVALUATOR */}
                {page === 'resistance' && (
                  <div className="p-5 max-w-4xl space-y-5">
                    <div>
                      <h2 className={`text-lg font-bold ${dm ? 'text-white' : 'text-ink-800'}`}>IRAC Resistance Risk Evaluator</h2>
                      <p className={`text-sm mt-1 ${dm ? 'text-green-300' : 'text-ink-600'}`}>Evaluates pesticide resistance risk and recommends Beauveria, Bt, Neem bio-alternatives based on consecutive application count.</p>
                    </div>
                    <div className={`${cardClass} p-5 space-y-4`}>
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                          <label className={`text-xs font-semibold block mb-1.5 ${dm ? 'text-dark-300' : 'text-ink-500'}`}>Pest</label>
                          <select value={resistancePest} onChange={e => setResistancePest(e.target.value)}
                            className={`w-full text-sm rounded-lg px-3 py-2 border ${dm ? 'bg-dark-800 border-dark-600 text-white' : 'bg-white border-paper-300 text-ink-800'}`}>
                            {['Bollworm','Stem Borer','Aphid Cluster'].map(p => <option key={p} value={p}>{p}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className={`text-xs font-semibold block mb-1.5 ${dm ? 'text-dark-300' : 'text-ink-500'}`}>Crop</label>
                          <select value={resistanceCrop} onChange={e => setResistanceCrop(e.target.value)}
                            className={`w-full text-sm rounded-lg px-3 py-2 border ${dm ? 'bg-dark-800 border-dark-600 text-white' : 'bg-white border-paper-300 text-ink-800'}`}>
                            {['Cotton','Rice','Wheat','Chilli','Tomato'].map(c => <option key={c} value={c}>{c}</option>)}
                          </select>
                        </div>
                        <div>
                          <label className={`text-xs font-semibold block mb-1.5 ${dm ? 'text-dark-300' : 'text-ink-500'}`}>Consecutive Applications</label>
                          <input type="number" min="0" max="10" value={resistanceApps}
                            onChange={e => setResistanceApps(parseInt(e.target.value)||0)}
                            className={`w-full text-sm rounded-lg px-3 py-2 border ${dm ? 'bg-dark-800 border-dark-600 text-white' : 'bg-white border-paper-300 text-ink-800'}`} />
                        </div>
                      </div>
                      <button onClick={async () => {
                        const d = await api('/api/chemical-rotation/evaluate?pest='+encodeURIComponent(resistancePest)+'&crop='+encodeURIComponent(resistanceCrop)+'&consecutive_applications='+resistanceApps);
                        if (d) setResistanceResult(d);
                      }} className={`px-6 py-2.5 rounded-lg font-semibold text-sm ${dm ? 'bg-green-700 hover:bg-green-600 text-white' : 'bg-brand-600 hover:bg-brand-700 text-white'} pressable`}>
                        Evaluate Resistance Risk
                      </button>
                    </div>

                    {resistanceResult && (
                      <div className="space-y-4">
                        <div className={`${cardClass} p-4`}>
                          <div className="flex items-center justify-between mb-3">
                            <span className={`font-bold ${dm ? 'text-white' : 'text-ink-800'}`}>Risk Assessment</span>
                            <Chip tone={resistanceResult.resistance_risk_level==='CRITICAL'||resistanceResult.resistance_risk_level==='HIGH'?'red':resistanceResult.resistance_risk_level==='MODERATE'?'amber':'green'}>
                              {resistanceResult.resistance_risk_level} ({resistanceResult.resistance_risk_score}%)
                            </Chip>
                          </div>
                          <div className={`h-3 rounded-full overflow-hidden mb-3 ${dm ? 'bg-dark-600' : 'bg-paper-200'}`}>
                            <div className="h-full rounded-full transition-all duration-1000"
                              style={{width: resistanceResult.resistance_risk_score+'%',
                                background: resistanceResult.resistance_risk_score>=80?'#ef4444':resistanceResult.resistance_risk_score>=60?'#f59e0b':'#22c55e'}} />
                          </div>
                          <p className={`text-sm font-semibold ${dm ? 'text-green-300' : 'text-brand-700'}`}>{resistanceResult.recommendation}</p>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <div className={`font-semibold mb-3 ${dm ? 'text-white' : 'text-ink-800'}`}>Bio-Alternatives (IPM)</div>
                          <div className="space-y-2">
                            {(resistanceResult.bio_alternatives||[]).map((b,i) => (
                              <div key={i} className={`rounded-lg p-3 flex items-start gap-3 ${dm ? 'bg-green-900/20 border border-green-800/30' : 'bg-brand-50 border border-brand-100'}`}>
                                <span className="text-xl">🌿</span>
                                <div>
                                  <div className={`font-semibold text-sm ${dm ? 'text-green-300' : 'text-brand-800'}`}>{b.name}</div>
                                  <div className={`text-xs mt-0.5 font-medium ${dm ? 'text-green-300' : 'text-ink-500'}`}>{b.dose} · {b.mode} · PHI: {b.preharvest_days} days</div>
                                </div>
                              </div>
                            ))}
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                )}

                {/* WAYPOINTS GENERATOR */}
                {page === 'waypoints' && (
                  <div className="p-5 max-w-5xl space-y-5">
                    <div>
                      <h2 className={`text-lg font-bold ${dm ? 'text-white' : 'text-ink-800'}`}>Drone Lawnmower Spray Waypoints</h2>
                      <p className={`text-sm mt-1 ${dm ? 'text-dark-400' : 'text-ink-500'}`}>Select an active mission to generate the precise lawnmower spray path. Shows GPS waypoints, sweep count, spray time, chemical volume, and % savings vs blanket spray.</p>
                    </div>
                    <div className={`${cardClass} p-4`}>
                      <p className={`text-xs font-semibold mb-2 ${dm ? 'text-dark-300' : 'text-ink-500'}`}>Select Mission</p>
                      <div className="flex gap-2 flex-wrap">
                        {missions.filter(m => !['completed','aborted'].includes(m.status)).map(m => (
                          <button key={m.id} onClick={async () => {
                            setWaypointMission(m);
                            const d = await api('/api/missions/'+m.id+'/waypoints');
                            if (d) setWaypointData(d);
                          }} className={`px-4 py-2 rounded-lg text-sm font-semibold pressable ${waypointMission?.id===m.id ? (dm?'bg-green-700 text-white':'bg-brand-600 text-white') : (dm?'bg-dark-700 text-dark-300 hover:bg-dark-600':'bg-white border border-paper-300 text-ink-600 hover:bg-paper-50')}`}>
                            {m.mission_code}
                          </button>
                        ))}
                        {missions.filter(m => !['completed','aborted'].includes(m.status)).length === 0 && (
                          <p className={`text-sm ${dm?'text-dark-400':'text-ink-400'}`}>No active missions. Create an outbreak dispatch first.</p>
                        )}
                      </div>
                    </div>
                    {waypointData && (
                      <div className="space-y-4">
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          {[
                            {label:'Sweeps', value: waypointData.num_sweeps+''},
                            {label:'Path Length', value: Math.round(waypointData.total_path_length_m)+'m'},
                            {label:'Chemical', value: waypointData.chemical_volume_l+'L'},
                            {label:'Savings', value: waypointData.savings_pct+'%'},
                          ].map(s => (
                            <div key={s.label} className={`${cardClass} p-3 text-center`}>
                              <div className={`text-xl font-black ${dm ? 'text-green-400' : 'text-brand-600'}`}>{s.value}</div>
                              <div className={`text-xs mt-0.5 ${dm?'text-dark-400':'text-ink-400'}`}>{s.label}</div>
                            </div>
                          ))}
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <p className={`font-semibold mb-3 text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>Lawnmower Path — {waypointData.mission_code}</p>
                          {(() => {
                            const bb = waypointData.bounding_box;
                            const wpts = waypointData.waypoints;
                            const oc = waypointData.outbreak_center;
                            if (!bb || !wpts || wpts.length < 2) return <p className="text-xs text-dark-400">No waypoints available</p>;
                            const W = 500, H = 200, px = 24, py = 16;
                            const latR = bb.lat_max - bb.lat_min || 0.001;
                            const lonR = bb.lon_max - bb.lon_min || 0.001;
                            const X = lon => px + ((lon - bb.lon_min) / lonR) * (W - 2*px);
                            const Y = lat => py + ((bb.lat_max - lat) / latR) * (H - 2*py);
                            const pairs = [];
                            for (let i = 0; i < wpts.length-1; i+=2) pairs.push([wpts[i], wpts[i+1]]);
                            return (
                              <svg viewBox={'0 0 '+W+' '+H} width="100%" style={{background: dm?'#0d1117':'#f8f8f4', borderRadius:8}}>
                                <rect x={X(bb.lon_min)} y={Y(bb.lat_max)} width={X(bb.lon_max)-X(bb.lon_min)} height={Y(bb.lat_min)-Y(bb.lat_max)}
                                  fill="rgba(34,197,94,0.06)" stroke={dm?'#22c55e':'#3a9e3d'} strokeWidth="1" strokeDasharray="4 2" />
                                {pairs.map(([a,b],i) => (
                                  <line key={i} x1={X(a.lon)} y1={Y(a.lat)} x2={X(b.lon)} y2={Y(b.lat)}
                                    stroke={dm?'#3b82f6':'#2563eb'} strokeWidth="1.5" strokeDasharray="3 3">
                                    <animate attributeName="stroke-dashoffset" from="0" to="-12" dur="0.8s" repeatCount="indefinite" />
                                  </line>
                                ))}
                                {wpts[0] && <circle cx={X(wpts[0].lon)} cy={Y(wpts[0].lat)} r="5" fill="#22c55e" />}
                                {oc && <circle cx={X(oc.lon)} cy={Y(oc.lat)} r="7" fill="rgba(239,68,68,0.35)" stroke="#ef4444" strokeWidth="1.5"/>}
                                <text x={X(bb.lon_min)+3} y={Y(bb.lat_max)+12} fill='#4ade80' fontSize='10' fontWeight='bold'>START</text>
                                {oc && <text x={X(oc.lon)+10} y={Y(oc.lat)+4} fill='#f87171' fontSize='10' fontWeight='bold'>OUTBREAK</text>}
                              </svg>
                            );
                          })()}
                          <div className="flex gap-5 mt-3 text-xs flex-wrap">
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-5 border-t-2 border-dashed border-blue-400 inline-block"></span>Spray sweep</span>
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-3 h-3 rounded-full bg-green-500 inline-block"></span>Drone start</span>
                            <span className={`flex items-center gap-1.5 ${dm?'text-dark-400':'text-ink-400'}`}><span className="w-3 h-3 rounded-full bg-red-500 inline-block"></span>Outbreak</span>
                          </div>
                        </div>
                        <div className={`${cardClass} p-4`}>
                          <p className={`font-semibold mb-2 text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>Spray Parameters</p>
                          <div className="grid grid-cols-2 sm:grid-cols-3 gap-y-2 gap-x-4 text-xs">
                            {[['Mission',waypointData.mission_code],['Altitude',waypointData.altitude_m+'m'],['Swath',waypointData.swath_width_m+'m'],
                              ['Spray Time',waypointData.spray_time_min+' min'],['Blanket Equiv.',waypointData.blanket_volume_l+'L'],['Precision',waypointData.chemical_volume_l+'L']].map(([k,v]) => (
                              <div key={k} className="flex gap-2">
                                <span className={dm?'text-dark-400':'text-ink-400'}>{k}:</span>
                                <span className={`font-semibold ${dm?'text-green-300':'text-brand-700'}`}>{v}</span>
                              </div>
                            ))}
                          </div>
                          <p className={`text-[10px] mt-3 ${dm?'text-dark-400':'text-ink-400'}`}>Prototype lawnmower path. Production: DGCA-compliant geofenced polygon scan.</p>
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </main>

              {/* Event ticker */}
              {tickerText && (
                <div className={`shrink-0 border-t py-1.5 overflow-hidden ${dm ? 'bg-dark-900 border-dark-700' : 'bg-paper-100 border-paper-200'}`}>
                  <div className="ticker-wrap">
                    <div className="ticker-content">
                      <span className={`text-[10px] font-mono ${dm ? 'text-green-400' : 'text-brand-600'}`}>
                        ▶ LIVE: {tickerText}
                      </span>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ─────────────────── AERIAL SCAN PAGE ─────────────────── */
    function AerialScanPage({ darkMode: dm, scanResult, setScanResult, scanImage, setScanImage, scanning, setScanning, sampleFields, setSampleFields, onConfirm }) {
      const [selectedSample, setSelectedSample] = useState(null);

      useEffect(() => {
        api('/api/detection/sample-fields').then(r => { if (r) setSampleFields(r); });
      }, []);

      const runScan = async (file) => {
        setScanning(true); setScanResult(null);
        const fd = new FormData();
        fd.append('file', file);
        fd.append('field_area_acres', '42');
        fd.append('create_detection', 'true');
        try {
          const res = await fetch(API + '/api/detection/scan-field', { method: 'POST', body: fd });
          const data = await res.json();
          setScanResult(data);
          setScanImage(URL.createObjectURL(file));
        } catch (e) { console.error(e); }
        setScanning(false);
      };

      const runSample = async (sample) => {
        setSelectedSample(sample.name); setScanning(true); setScanResult(null);
        try {
          const sampleUrl = sample.path.startsWith('http') ? sample.path : API + sample.path;
          const res = await fetch(sampleUrl);
          const blob = await res.blob();
          const fd = new FormData();
          fd.append('file', blob, sample.name);
          fd.append('field_area_acres', '42');
          fd.append('create_detection', 'true');
          const scanRes = await fetch(API + '/api/detection/scan-field', { method: 'POST', body: fd });
          const data = await scanRes.json();
          setScanResult(data);
          setScanImage(URL.createObjectURL(blob));
        } catch (e) { console.error(e); }
        setScanning(false);
      };

      const cardClass = dm ? 'bg-dark-700 border border-dark-600 rounded-app' : 'bg-white border border-paper-200 rounded-app shadow-card';

      return (
        <div className="p-5 max-w-5xl space-y-5">
          <div>
            <h2 className={`text-lg font-bold flex items-center gap-2 ${dm ? 'text-white' : 'text-ink-800'}`}>{I.image('w-5 h-5 text-brand-600')} Aerial Field Scan</h2>
            <p className={`text-sm mt-1 ${dm ? 'text-dark-400' : 'text-ink-500'}`}>Real CNN detection on field imagery — tiles into 6×6 grid, classifies each tile, clusters disease hotspots into infection zones with GPS coordinates.</p>
          </div>

          <div className={`${cardClass} p-4`}>
            <h3 className={`font-semibold text-sm mb-3 ${dm ? 'text-white' : 'text-ink-800'}`}>Sample Field Images</h3>
            <div className="grid grid-cols-2 gap-3">
              {sampleFields.map(s => (
                <button key={s.name} onClick={() => runSample(s)} disabled={scanning}
                  className={`text-left p-3 rounded-app border transition-all pressable ${selectedSample === s.name ? (dm ? 'border-green-500 bg-green-900/20' : 'border-brand-400 bg-brand-50') : (dm ? 'border-dark-500 hover:border-green-600 hover:bg-dark-600' : 'border-paper-200 hover:border-brand-300 hover:bg-paper-50')} disabled:opacity-50`}>
                  <div className={`font-medium text-sm ${dm ? 'text-white' : 'text-ink-700'}`}>{s.name.replace(/_/g, ' ').replace(/\.jpg$/, '')}</div>
                  <div className={`text-xs mt-0.5 ${dm ? 'text-green-300' : 'text-ink-400'}`}>{s.description}</div>
                </button>
              ))}
            </div>
            <div className="mt-3 flex items-center gap-3">
              <label className={`px-4 py-2 rounded-app text-sm font-semibold pressable cursor-pointer flex items-center gap-1.5 ${dm ? 'bg-dark-600 text-dark-300 hover:bg-dark-500 border border-dark-500' : 'bg-white border border-paper-300 text-ink-700 hover:bg-paper-50'}`}>
                {I.camera('w-4 h-4')}Upload your own image
                <input type="file" accept="image/*" onChange={e => { const f = e.target.files?.[0]; if (f) runScan(f); }} className="hidden" />
              </label>
              {scanning && <span className={`text-sm font-medium ${dm ? 'text-green-400' : 'text-brand-600'} animate-pulse`}>Scanning 36 tiles…</span>}
            </div>
          </div>

          {scanResult && (
            <div className={`${cardClass} p-4 space-y-4`}>
              <div className="flex items-center justify-between">
                <h3 className={`font-semibold text-sm ${dm ? 'text-white' : 'text-ink-800'}`}>Scan Results</h3>
                <span className={`text-xs font-mono px-2 py-1 rounded-full ${dm ? 'bg-green-900/40 text-green-400' : 'bg-brand-50 text-brand-700'}`}>{scanResult.mode}</span>
              </div>
              <p className={`text-sm ${dm ? 'text-dark-300' : 'text-ink-600'}`}>{scanResult.detection_summary}</p>

              {scanImage && (
                <div className="relative inline-block rounded-app overflow-hidden border border-paper-200">
                  <img src={scanImage} alt="Scanned field" className="max-w-full max-h-80 object-contain" />
                  {scanResult.image_width && scanResult.image_height && scanResult.clusters && scanResult.clusters.map((cl, i) => {
                    const b = cl.bbox_px;
                    const imgEl = document.querySelector('img[alt="Scanned field"]');
                    const imgW = imgEl ? imgEl.clientWidth : scanResult.image_width;
                    const imgH = imgEl ? imgEl.clientHeight : scanResult.image_height;
                    const sx = imgW / scanResult.image_width;
                    const sy = imgH / scanResult.image_height;
                    return (
                      <div key={i} className="absolute border-2 border-red-500 rounded" style={{ left: b.x * sx, top: b.y * sy, width: b.w * sx, height: b.h * sy }}>
                        <span className="absolute -top-5 left-0 bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded whitespace-nowrap">
                          #{cl.id} {cl.main_pest} ({(cl.avg_confidence*100).toFixed(0)}%)
                        </span>
                      </div>
                    );
                  })}
                </div>
              )}

              {scanResult.tiles && (
                <div>
                  <p className={`text-xs mb-1 ${dm ? 'text-green-300' : 'text-ink-400'}`}>Per-tile heatmap ({scanResult.grid}×{scanResult.grid} = {scanResult.total_tiles} tiles)</p>
                  <div className="inline-grid gap-px" style={{gridTemplateColumns: `repeat(${scanResult.grid}, 1fr)`}}>
                    {scanResult.tiles.map((t, i) => (
                      <div key={i} className={`w-6 h-6 rounded-sm text-[7px] flex items-center justify-center font-bold ${t.hot ? 'bg-red-500 text-white' : t.healthy ? 'bg-brand-200 text-brand-800' : 'bg-amber2-100 text-amber2-500'}`}
                        title={`${t.label} (${(t.confidence*100).toFixed(0)}%)`}>
                        {t.hot ? '!' : t.healthy ? '' : '?'}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {scanResult.clusters && scanResult.clusters.length > 0 && (
                <div className="space-y-2">
                  <h4 className={`font-semibold text-sm ${dm ? 'text-white' : 'text-ink-700'}`}>Detected Infection Zones</h4>
                  {scanResult.clusters.map(cl => (
                    <div key={cl.id} className="flex items-center justify-between p-3 bg-red-50 border border-red-200 rounded-app">
                      <div>
                        <span className="font-semibold text-red-700">Zone #{cl.id}</span>
                        <span className="text-sm text-ink-600 ml-2">{cl.main_pest}</span>
                        <span className="text-xs text-ink-400 ml-2">({(cl.avg_confidence*100).toFixed(0)}% conf, {cl.tile_count} tiles)</span>
                      </div>
                      <div className="flex items-center gap-3">
                        <span className="font-bold text-red-600">{cl.est_acres} acres</span>
                        {scanResult.clusters.indexOf(cl) === 0 && scanResult.detection_id && (
                          <button onClick={() => onConfirm(scanResult.detection_id)}
                            className="px-3 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-app pressable hover:bg-red-700">
                            Confirm → Outbreak
                          </button>
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {scanResult.clusters && scanResult.clusters.length === 0 && (
                <div className="p-4 bg-brand-50 border border-brand-200 rounded-app text-center">
                  <p className="text-sm text-brand-700 font-medium">No infection zones detected — field appears healthy</p>
                  <p className="text-xs text-ink-400 mt-1">{scanResult.healthy_fraction ? `${(scanResult.healthy_fraction*100).toFixed(0)}% of tiles classified as healthy` : ''}</p>
                </div>
              )}

              <p className={`text-xs ${dm ? 'text-green-300' : 'text-ink-400'}`}>Real CNN inference (PlantVillage MobileNetV2, 38 classes) — not a simulation. Aerial accuracy limited: leaf-level model applied to field imagery. Production: multispectral aerial model.</p>
            </div>
          )}
        </div>
      );
    }

    /* ─────────────────── ROOT ─────────────────── */

    /* ═══════════════════════════════════════════════════════════
       WORLD-CLASS NEW COMPONENTS — FarmShield Enterprise v3.0
    ═══════════════════════════════════════════════════════════ */

    /* ── AgTech Status Header ── */
    function AgTechHeader({ onBack, title, badge }) {
      return (
        <div className="agtech-card border-b flex items-center justify-between px-5 py-3 sticky top-0 z-50">
          <div className="flex items-center gap-3">
            {onBack && <button onClick={onBack} className="text-agtech-accent p-1.5 rounded-lg hover:bg-white/5 pressable">{I.arrowLeft('w-5 h-5 text-green-400')}</button>}
            <div className="text-brand-300">{I.shield('w-5 h-5')}</div>
            <span className="font-bold text-white text-sm">{title}</span>
            {badge && <span className="badge-online">{badge}</span>}
          </div>
          <div className="flex items-center gap-3 text-xs">
            <span className="badge-online">AI: ONLINE ✓</span>

    function ConfidenceBars({ top3, animate }) {
      if (!top3 || !top3.length) return null;
      const colors = ['#22c55e', '#3b82f6', '#f59e0b'];
      return (
        <div className="space-y-2.5">
          {top3.map((item, i) => (

                  {item.healthy ? '✓ Healthy' : (item.pest || item.label || 'Unknown')}

                <span className="text-xs font-bold" style={{color: colors[i]}}>{(item.confidence*100).toFixed(1)}%</span>

              <div className="h-2 rounded-full overflow-hidden" style={{background:'rgba(255,255,255,0.07)'}}>

            </div>

        </div>

    }

    function AILeafLab({ onBack }) {
      const [samples, setSamples] = useState([]);
      const [selected, setSelected] = useState(null);
      const [result, setResult] = useState(null);
      const [scanning, setScanning] = useState(false);
