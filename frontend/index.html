<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FarmShield — Detect Early. Predict Spread. Protect Precisely.</title>
  <meta name="description" content="FarmShield: AI-powered autonomous crop pest containment. Real CNN detection, predictive spread modeling, and precision drone dispatch for Indian farmers." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Noto Sans Tamil', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0faf0', 100: '#dcf5dc', 200: '#b8eab8', 300: '#87d487',
              400: '#55ba58', 500: '#3a9e3d', 600: '#2d8230', 700: '#246828',
              800: '#1f5523', 900: '#1a451e', 950: '#0d2410',
            },
            paper: {
              50: '#fafaf7', 100: '#f4f4ef', 200: '#e8e8e0', 300: '#d6d6cb',
            },
            ink: {
              300: '#b0b5ab', 400: '#8a8f86', 500: '#6b7169', 600: '#525750',
              700: '#3d423b', 800: '#2a2e28', 900: '#1c1f1a',
            },
            amber2: { 500: '#d97706', 100: '#fef3c7', 50: '#fffbeb' },
            dark: {
              900: '#0d1117', 800: '#161b22', 700: '#21262d', 600: '#30363d',
              500: '#484f58', 400: '#6e7681',
            },
          },
          boxShadow: {
            card: '0 1px 2px rgba(28,31,26,0.06), 0 1px 3px rgba(28,31,26,0.08)',
            raised: '0 4px 12px rgba(28,31,26,0.12)',
            glow: '0 0 20px rgba(58,158,61,0.3)',
            'glow-red': '0 0 20px rgba(220,38,38,0.3)',
          },
          borderRadius: { 'app': '12px' },
          animation: {
            'count-up': 'countUp 1.5s ease-out forwards',
            'slide-in': 'slideIn 0.4s ease-out forwards',
            'fade-up': 'fadeUp 0.5s ease-out forwards',
            'pulse-ring': 'pulseRing 2s ease-out infinite',
            'ticker': 'ticker 20s linear infinite',
            'battery': 'batteryPulse 2s ease-in-out infinite',
          },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter','Noto Sans Tamil',system-ui,sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    /* Drone Optical Macro Leaf Scanner */
    .laser-scanner-box {
      position: relative;
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }
    .laser-line-anim {
      position: absolute;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22c55e, #86efac, #22c55e, transparent);
      box-shadow: 0 0 15px #22c55e, 0 0 25px #86efac;
      animation: laserSweep 2.2s ease-in-out infinite;
      z-index: 20;
    }
    @keyframes laserSweep {
      0% { top: 2%; opacity: 0.8; }
      50% { top: 96%; opacity: 1; }
      100% { top: 2%; opacity: 0.8; }
    }
    .hud-reticle {
      position: absolute;
      border: 2px solid rgba(34, 197, 94, 0.75);
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.08);
      animation: reticlePulse 1.8s ease-in-out infinite;
      z-index: 15;
    }
    @keyframes reticlePulse {
      0%, 100% { border-color: rgba(34, 197, 94, 0.85); box-shadow: 0 0 12px rgba(34, 197, 94, 0.3); }
      50% { border-color: rgba(239, 68, 68, 0.95); box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); }
    }

    /* Leaflet overrides */
    .leaflet-container { background: #e8e8e0 !important; font-family: 'Inter',sans-serif; }
    .leaflet-container.dark-map { background: #161b22 !important; filter: brightness(0.8) saturate(0.9); }
    .leaflet-control-zoom a { background: #fff !important; color: #2d8230 !important; border-color: #d6d6cb !important; }
    .leaflet-popup-content-wrapper { border-radius: 12px; }
    .marker-pin { width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35); }
    .pin-red { background:#dc2626; animation: pinPulse 1.8s ease-in-out infinite; }
    .pin-green { background:#2d8230; }
    .pin-blue { background:#2563eb; }

    /* Realtime Farm Satellite & Radar styles */
    .pulse-beacon {
      position: relative;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #22c55e;
      border: 2px solid #ffffff;
      box-shadow: 0 0 10px #22c55e;
    }
    .pulse-beacon::after {
      content: '';
      position: absolute;
      top: -6px;
      left: -6px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #22c55e;
      animation: beaconWave 1.8s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    @keyframes beaconWave {
      0% { transform: scale(0.6); opacity: 1; }
      100% { transform: scale(2.4); opacity: 0; }
    }
    .drone-radar-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.8);
      font-size: 16px;
      color: #fff;
      transition: transform 0.4s ease;
    }
    .drone-radar-icon.spraying {
      border-color: #38bdf8;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.9);
      animation: sprayPulse 1s ease-in-out infinite alternate;
    }
    @keyframes sprayPulse {
      0% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.6); }
      100% { box-shadow: 0 0 25px rgba(56, 189, 248, 1); }
    }
    .sensor-radar-icon {
      background: rgba(15, 23, 42, 0.95);
      border: 1.5px solid #f59e0b;
      border-radius: 8px;
      padding: 2px 6px;
      font-size: 10px;
      font-weight: 700;
      color: #fef08a;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .thermal-vision {
      filter: contrast(180%) hue-rotate(180deg) saturate(250%) invert(20%);
    }
    .ndvi-vision {
      filter: contrast(160%) hue-rotate(90deg) saturate(300%);
    }

    /* Animations */
    @keyframes pinPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.3)} }
    @keyframes scanline { from{top:8%} to{top:90%} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideIn { from{opacity:0;transform:translateX(-20px)} to{opacity:1;transform:translateX(0)} }
    @keyframes pulseRing {
      0%{box-shadow:0 0 0 0 rgba(58,158,61,0.5)}
      70%{box-shadow:0 0 0 20px rgba(58,158,61,0)}
      100%{box-shadow:0 0 0 0 rgba(58,158,61,0)}
    }
    @keyframes pulseRingRed {
      0%{box-shadow:0 0 0 0 rgba(220,38,38,0.5)}
      70%{box-shadow:0 0 0 16px rgba(220,38,38,0)}
      100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}
    }
    @keyframes ticker { from{transform:translateX(100%)} to{transform:translateX(-100%)} }
    @keyframes droneFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    @keyframes spreadRing { 0%{transform:scale(0);opacity:0.8} 100%{transform:scale(1);opacity:0} }
    @keyframes containRing { 0%{transform:scale(0.5);opacity:0} 30%{opacity:1} 100%{transform:scale(1.05);opacity:0.8} }
    @keyframes heroFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-12px) rotate(2deg)} }
    @keyframes waveGrow { from{width:0%} to{width:var(--target-w)} }
    @keyframes arcDraw { from{stroke-dashoffset:var(--arc-len)} to{stroke-dashoffset:var(--arc-end)} }
    @keyframes batteryPulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
    @keyframes countUp { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
    @keyframes glowPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
    @keyframes stepReveal { from{opacity:0;transform:translateX(-10px)} to{opacity:1;transform:translateX(0)} }

    /* Utilities */
    .scanline { position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#3a9e3d,transparent);animation:scanline 1.6s ease-in-out infinite alternate; }
    .tl-dot { width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700; }
    ::-webkit-scrollbar { width:6px;height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:#d6d6cb;border-radius:4px; }
    .dark-scroll::-webkit-scrollbar-thumb { background:#30363d; }
    .no-scrollbar::-webkit-scrollbar { display:none; }
    .pressable:active { transform:scale(0.97); }
    .pressable { transition:transform .1s ease; }

    /* High-contrast mode for low-vision users */
    .high-contrast { filter: contrast(1.8) saturate(0.3); }
    .high-contrast .bg-white { background: #000 !important; color: #fff !important; }
    .high-contrast .text-ink-800, .high-contrast .text-ink-700, .high-contrast .text-ink-600, .high-contrast .text-ink-500 { color: #fff !important; }
    .high-contrast .bg-brand-600 { background: #000 !important; border: 3px solid #fff !important; }
    .high-contrast .border { border-color: #fff !important; }
    .high-contrast .rounded-app { border-radius: 4px !important; }
    .high-contrast button { min-height: 56px !important; min-width: 56px !important; font-size: 18px !important; font-weight: 700 !important; }
    .high-contrast .text-xs { font-size: 16px !important; }
    .high-contrast .text-sm { font-size: 20px !important; }
    .high-contrast .text-base { font-size: 22px !important; }
    .high-contrast .text-xl { font-size: 28px !important; }
    .glass { backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px); }
    .pulse-ring-anim { animation: pulseRing 2s ease-out infinite; }
    .pulse-ring-red { animation: pulseRingRed 1.5s ease-out infinite; }
    .drone-float { animation: heroFloat 4s ease-in-out infinite; }
    .spread-ring { animation: spreadRing 2s ease-out forwards; }
    .contain-ring { animation: containRing 2s ease-out forwards; }
    .step-reveal { animation: stepReveal 0.4s ease-out forwards; }

    /* Hero animated background */
    .hero-bg {
      background-color: #1a451e;
      background: linear-gradient(135deg, #0d2410 0%, #1a451e 30%, #1f5523 60%, #246828 100%);
      position: relative; overflow: hidden;
    }
    .hero-bg::before {
      content:''; position:absolute; inset:0;
      background: radial-gradient(ellipse at 20% 50%, rgba(58,158,61,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(87,212,90,0.1) 0%, transparent 50%);
    }
    .hero-grid {
      background-image: linear-gradient(rgba(58,158,61,0.08) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(58,158,61,0.08) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* Dark mode for Expert Console */
    .dark-panel { background: #161b22; color: #e6edf3; }
    .dark-panel .dark-card { background: #21262d; border-color: #30363d; }
    .dark-panel .dark-nav { background: #161b22; border-color: #21262d; }
    .dark-panel .dark-header { background: #161b22; border-color: #21262d; }
    .dark-panel .dark-text-primary { color: #e6edf3; }
    .dark-panel .dark-text-secondary { color: #8b949e; }
    .dark-panel .dark-text-accent { color: #58a6ff; }
    .dark-panel .dark-border { border-color: #30363d; }
    .dark-panel .dark-nav-item { color: #c9d1d9; }
    .dark-panel .dark-nav-item.active { background: rgba(58,158,61,0.15); color: #3fb950; border-right: 2px solid #3fb950; }
    .dark-panel .dark-nav-item:hover:not(.active) { background: #21262d; color: #e6edf3; }

    /* Phone frame */
    .phone-frame {
      background: #1a1a1a; border-radius: 44px; padding: 12px;
      box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
    }
    .phone-frame::before {
      content:''; position:absolute; top:18px; left:50%; transform:translateX(-50%);
      width:80px; height:6px; background:#333; border-radius:3px; z-index:10;
    }
    .phone-screen { border-radius:34px; overflow:hidden; background:#fff; position:relative; }

    /* Confidence arc */
    .conf-arc { transform: rotate(-90deg); transform-origin: center; }
    .conf-arc circle { transition: stroke-dashoffset 1.5s cubic-bezier(0.4,0,0.2,1); }

    /* Stat counter */
    .stat-counter { font-variant-numeric: tabular-nums; }

    /* Sparkline */
    .sparkline { position:relative; display:inline-flex; align-items:flex-end; gap:2px; height:32px; }
    .sparkline-bar { border-radius:2px 2px 0 0; transition: height 0.5s ease; }

    /* Event ticker */
    .ticker-wrap { overflow:hidden; white-space:nowrap; }
    .ticker-content { display:inline-block; animation:ticker 25s linear infinite; }

    /* Battery bar */
    .battery-bar { transition: width 1s ease, background-color 0.5s ease; }

    /* Containment success */
    .containment-success {
      background: radial-gradient(ellipse at center, rgba(58,158,61,0.2) 0%, transparent 70%);
      border: 2px solid rgba(58,158,61,0.5); border-radius: 50%;
      animation: containRing 2s ease-out forwards;
    }

    /* === WORLD-CLASS UPGRADE CSS === */

    /* Premium dark AgTech theme */
    :root {
      --agtech-bg: #040d08;
      --agtech-surface: #0a1a10;
      --agtech-card: #0f2318;
      --agtech-border: rgba(58,158,61,0.18);
      --agtech-glow: rgba(58,158,61,0.35);
      --agtech-accent: #22c55e;
      --agtech-accent2: #4ade80;
      --agtech-warn: #f59e0b;
      --agtech-danger: #ef4444;
      --agtech-text: #e2fce4;
      --agtech-muted: #aadbb0;
    }

    /* AgTech command-center body */
    .agtech-bg::-webkit-scrollbar { width: 6px; height: 6px; }
    .agtech-bg::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    .agtech-bg::-webkit-scrollbar-thumb { background: rgba(34,197,94,0.3); border-radius: 4px; }
    .agtech-bg::-webkit-scrollbar-thumb:hover { background: rgba(34,197,94,0.5); }
    .agtech-bg { color: #e2fce4; font-family: 'Inter', 'Noto Sans Tamil', system-ui, sans-serif;
      background-color: #040d08;
      background: radial-gradient(ellipse at 10% 30%, rgba(34,197,94,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 90% 70%, rgba(59,130,246,0.06) 0%, transparent 50%),
                  linear-gradient(160deg, #040d08 0%, #060f0a 40%, #04100c 100%);
      min-height: 100%;
    }

    /* AgTech glassmorphism card */
    .agtech-card {
      background-color: #0f2318;
      background: rgba(15, 35, 24, 0.95);
      border: 1px solid rgba(58,158,61,0.25);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #e2fce4;
    }

    /* Cyber grid overlay */
    .agtech-grid {
      background-image:
        linear-gradient(rgba(34,197,94,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34,197,94,0.04) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    /* Neon status badges */
    .badge-online { background: rgba(34,197,94,0.2); color: #86efac; border: 1px solid rgba(34,197,94,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .badge-warn   { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }
    .badge-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.4); border-radius: 20px; padding: 2px 10px; font-size: 11px; font-weight: 700; }

    /* Glowing primary button */
    .btn-glow {
      background: linear-gradient(135deg, #16a34a, #22c55e);
      color: white; font-weight: 700; border-radius: 12px;
      box-shadow: 0 0 24px rgba(34,197,94,0.4), 0 4px 12px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }
    .btn-glow:hover { box-shadow: 0 0 36px rgba(34,197,94,0.6), 0 6px 16px rgba(0,0,0,0.4); transform: translateY(-1px); }
    .btn-glow:active { transform: scale(0.97); }

    /* Slider styling */
    input[type=range].agtech-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 6px;
      background: rgba(34,197,94,0.2); border-radius: 4px; outline: none; }
    input[type=range].agtech-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      background: #22c55e; border-radius: 50%; cursor: pointer; box-shadow: 0 0 8px rgba(34,197,94,0.6); }

    /* Scanning animation for AI lab */
    @keyframes scanbeam { 0%{top:0%} 100%{top:96%} }
    .scan-beam { position:absolute; left:0; right:0; height:3px;
      background: linear-gradient(90deg, transparent, #22c55e, transparent);
      animation: scanbeam 1.4s ease-in-out infinite alternate;
      box-shadow: 0 0 12px rgba(34,197,94,0.8); }

    /* Confidence bar */
    @keyframes barGrow { from{width:0} to{width:var(--bar-w)} }
    .conf-bar { animation: barGrow 1.2s cubic-bezier(0.4,0,0.2,1) forwards; }

    /* Drone lawnmower path */
    @keyframes droneMove { 0%{offset-distance:0%} 100%{offset-distance:100%} }
    .drone-path-anim { animation: droneMove 8s linear infinite; }

    /* Wind arrow rotation */
    @keyframes windSpin { 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }

    /* Glowing spread ring on map */
    @keyframes outbreakPulse { 0%{opacity:0.8;transform:scale(1)} 100%{opacity:0;transform:scale(2.2)} }
    .outbreak-pulse-anim { animation: outbreakPulse 2s ease-out infinite; }

    /* INR ticker */
    @keyframes numFlip { 0%{transform:translateY(-10px);opacity:0} 100%{transform:translateY(0);opacity:1} }
    .num-flip { animation: numFlip 0.3s ease-out forwards; }

    /* Tab active indicator */
    .agtech-tab { border-bottom: 2px solid transparent; transition: all 0.2s ease; color: #c4e8ca; }
    .agtech-tab.active { border-bottom-color: #22c55e; color: #4ade80; }
    .agtech-tab:hover:not(.active) { color: #a3d9a8; }

    /* WhatsApp simulator */
    .whatsapp-bg { background: linear-gradient(180deg, #075e54 0%, #128c7e 100%); }
    .wa-bubble-in { background: #dcf8c6; color: #111; border-radius: 18px 18px 18px 4px; }
    .wa-bubble-out { background: #fff; color: #111; border-radius: 18px 18px 4px 18px; }

    /* IVR phone */
    .ivr-phone { background: linear-gradient(135deg, #1a1a2e, #16213e); border: 2px solid #0f3460; border-radius: 24px; }
    @keyframes phonePulse { 0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,0.4)} 50%{box-shadow:0 0 0 12px rgba(34,197,94,0)} }
    .phone-calling { animation: phonePulse 1.5s ease-in-out infinite; }

    /* Lawnmower path on mini map */
    .path-segment { stroke-dasharray: 4 4; animation: dashMove 0.8s linear infinite; }
    @keyframes dashMove { to { stroke-dashoffset: -16; } }

    /* Judge tour highlight */
    .judge-highlight { border: 2px solid #22c55e; box-shadow: 0 0 20px rgba(34,197,94,0.3); border-radius: 12px; }
  </style>
</head>
<body class="h-full bg-white text-ink-800 antialiased">
  <div id="root" class="h-full">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#1a451e;color:#e2fce4;font-family:Inter,system-ui,sans-serif;">
      <div style="font-size:48px;margin-bottom:16px;">🛡️</div>
      <div style="font-size:20px;font-weight:700;">FarmShield</div>
      <div style="font-size:13px;margin-top:8px;color:#87d487;">Detect Early. Predict Spread. Protect Precisely.</div>
      <div style="margin-top:24px;width:40px;height:4px;background:rgba(255,255,255,0.15);border-radius:2px;overflow:hidden;">
        <div style="width:100%;height:100%;background:#3a9e3d;border-radius:2px;animation:loadBar 1.5s ease-in-out infinite;"></div>
      </div>
    </div>
    <style>@keyframes loadBar{0%{transform:translateX(-100%)}50%{transform:translateX(0)}100%{transform:translateX(100%)}}</style>
  </div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;
    const API = window.FARMSHIELD_API || '';

    /* ─────────────────── SVG ICONS ─────────────────── */

    let _cachedSpeechVoices = [];
    function updateSpeechVoices() {
      if (typeof window !== 'undefined' && window.speechSynthesis && window.speechSynthesis.getVoices) {
        _cachedSpeechVoices = window.speechSynthesis.getVoices();
      }
    }
    if (typeof window !== 'undefined' && window.speechSynthesis) {
      updateSpeechVoices();
      window.speechSynthesis.onvoiceschanged = updateSpeechVoices;
    }

    function getBestVoiceForLang(targetLang) {
      if (!_cachedSpeechVoices || _cachedSpeechVoices.length === 0) {
        updateSpeechVoices();
      }
      const voices = _cachedSpeechVoices || [];
      if (!voices.length) return null;
      
      const targetLower = targetLang.toLowerCase();
      const prefix = targetLang.split('-')[0].toLowerCase();
      
      // 1. Exact match e.g. 'ta-IN' or 'ta_IN'
      let v = voices.find(v => v.lang && (v.lang.toLowerCase() === targetLower || v.lang.toLowerCase().replace('_', '-') === targetLower));
      if (v) return { voice: v, isNative: true };
      
      // 2. Language prefix match e.g. 'ta', 'hi', 'te'
      v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith(prefix));
      if (v) return { voice: v, isNative: true };

      // 3. Indian English fallback e.g. 'en-IN'
      v = voices.find(v => v.lang && (v.lang.toLowerCase().includes('en-in') || v.lang.toLowerCase().includes('en_in')));
      if (v) return { voice: v, isNative: false };

      // 4. Any English voice e.g. 'en-US', 'en-GB'
      v = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en'));
      if (v) return { voice: v, isNative: false };

      // 5. Default voice
      v = voices.find(v => v.default) || voices[0];
      return { voice: v, isNative: false };
    }

    let _audioCtx = null;
    function getAudioContext() {
      if (typeof window === 'undefined') return null;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return null;
        if (!_audioCtx) {
          _audioCtx = new AudioCtx();
        }
        if (_audioCtx.state === 'suspended') {
          _audioCtx.resume().catch(() => {});
        }
        return _audioCtx;
      } catch (e) {
        return null;
      }
    }

    function playAudioTone(freq1 = 520, freq2 = 880, duration = 0.12) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq1, now);
        osc.frequency.exponentialRampToValueAtTime(freq2, now + duration);
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + duration + 0.05);
      } catch (e) {}
    }

    let _globalAudioPlayer = null;
    let _activeSpeechUtterance = null;
    let _voiceGreetingLockUntil = 0;
    let _audioSessionId = 0;

    function stopAllAudioAndSpeech() {
      // Invalidate any pending fallbacks or callbacks
      ++_audioSessionId;

      if (_globalAudioPlayer) {
        try {
          _globalAudioPlayer.pause();
          _globalAudioPlayer.currentTime = 0;
          _globalAudioPlayer.onended = null;
          _globalAudioPlayer.onerror = null;
          _globalAudioPlayer.src = '';
        } catch (e) {}
        _globalAudioPlayer = null;
      }
      if (typeof window !== 'undefined' && window.speechSynthesis) {
        try {
          window.speechSynthesis.cancel();
        } catch (e) {}
      }
    }

    function playTTSAudio(text, lang = 'en', onEnd, englishFallback = '') {
      if (!text && !englishFallback) return;
      const cleanText = (text || englishFallback).trim();
      const cleanEnglish = (englishFallback || text).trim();

      // Immediately terminate any prior speech or audio playback
      stopAllAudioAndSpeech();
      const thisSession = _audioSessionId;

      const encoded = encodeURIComponent(cleanText.slice(0, 250));
      const proxyUrl = `/api/tts?text=${encoded}&lang=${lang}`;

      const audio = new Audio();
      _globalAudioPlayer = audio;

      let fallbackTriggered = false;
      const doFallback = (err) => {
        // Stale session or aborted? Do not fall back to speech synthesis!
        if (thisSession !== _audioSessionId) return;
        if (err && (err.name === 'AbortError' || (err.message && err.message.includes('interrupted')))) {
          return;
        }
        if (fallbackTriggered) return;
        fallbackTriggered = true;

        if (_globalAudioPlayer === audio) {
          try {
            audio.pause();
            audio.src = '';
          } catch(e) {}
          _globalAudioPlayer = null;
        }

        speakViaSpeechSynthesis(cleanText, lang, onEnd, cleanEnglish, thisSession);
      };

      audio.onended = () => {
        if (thisSession === _audioSessionId) {
          _globalAudioPlayer = null;
          if (onEnd) onEnd();
        }
      };

      audio.onerror = (e) => {
        doFallback(e);
      };

      audio.src = proxyUrl;
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch((err) => {
          doFallback(err);
        });
      }
    }

    function speakViaSpeechSynthesis(text, lang = 'en', onEnd, englishFallback = '', sessionId = null) {
      if (typeof window === 'undefined' || !window.speechSynthesis) return;
      // Stale session check: if a new audio session started, abort immediately!
      if (sessionId !== null && sessionId !== _audioSessionId) return;

      try {
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        window.speechSynthesis.cancel();

        const langMap = { ta: 'ta-IN', hi: 'hi-IN', te: 'te-IN', kn: 'kn-IN', ml: 'ml-IN', mr: 'mr-IN', en: 'en-IN' };
        const targetBcp = langMap[lang] || 'en-IN';
        const match = getBestVoiceForLang(targetBcp);

        let spokenText = text;
        let spokenLang = targetBcp;

        if (match && match.isNative) {
          spokenText = text;
          spokenLang = match.voice.lang || targetBcp;
        } else {
          // If system only has English voice (Hazel/Zira), raw Indic text will be completely silent!
          // We speak the English accessibility fallback text with a language prefix so it is 100% audible!
          spokenLang = match && match.voice ? match.voice.lang : 'en-US';
          const langObj = typeof LANGS !== 'undefined' ? LANGS.find(l => l.code === lang) : null;
          const langPrefix = lang !== 'en' && langObj ? `${langObj.label} mode. ` : '';
          spokenText = `${langPrefix}${englishFallback || text}`;
        }

        const u = new SpeechSynthesisUtterance(spokenText);
        u.rate = 0.95;
        u.pitch = 1.0;
        u.volume = 1.0;
        u.lang = spokenLang;
        if (match && match.voice) {
          u.voice = match.voice;
        }

        _activeSpeechUtterance = u;
        u.onend = () => {
          if (sessionId === null || sessionId === _audioSessionId) {
            _activeSpeechUtterance = null;
            if (onEnd) onEnd();
          }
        };
        u.onerror = () => {
          if (sessionId === null || sessionId === _audioSessionId) {
            _activeSpeechUtterance = null;
            if (onEnd) onEnd();
          }
        };

        setTimeout(() => {
          if (sessionId !== null && sessionId !== _audioSessionId) return;
          try {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            window.speechSynthesis.speak(u);
          } catch (e) {}
        }, 20);
      } catch (e) {}
    }

      try {

        playAudioTone(520, 880, 0.10);

        let cleanText = '';

        if (!cleanText) return;

        playTTSAudio(cleanText, lang, onEnd, englishText);
      } catch (err) {
        console.warn('narrateFeature error:', err);

    }

    /* ─── Animated Counter ─── */
    function AnimatedCounter({ target, suffix='', prefix='', duration=1500 }) {
      const [val, setVal] = useState(0);
      const ref = useRef(null);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
          if (e.isIntersecting) {
            const start = Date.now();
            const tick = () => {
              const p = Math.min((Date.now() - start) / duration, 1);
              const ease = 1 - Math.pow(1 - p, 3);
              setVal(Math.round(ease * target));
              if (p < 1) requestAnimationFrame(tick);
            };
            requestAnimationFrame(tick);
            obs.disconnect();
          }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, [target]);
      return <span ref={ref} className="stat-counter">{prefix}{val.toLocaleString()}{suffix}</span>;
    }

    /* ─── Mini Sparkline ─── */
    function Sparkline({ data, color='#3a9e3d', height=32 }) {
      if (!data || data.length === 0) return null;
      const max = Math.max(...data);
      const min = Math.min(...data);
      const range = max - min || 1;
      return (
        <div className="sparkline" style={{ height }}>
          {data.map((v, i) => {
            const h = Math.max(4, ((v - min) / range) * height);
            return (
              <div key={i} className="sparkline-bar w-2" style={{ height: h, background: i === data.length - 1 ? color : color + '70' }} />
            );
          })}
        </div>
      );
    }

    /* ─── Confidence Arc ─── */
    function ConfidenceArc({ confidence, size=80, animated=true }) {
      const r = 32, cx = 40, cy = 40;
      const circ = 2 * Math.PI * r;
      const filled = confidence * circ;
      const color = confidence >= 0.8 ? '#3a9e3d' : confidence >= 0.55 ? '#d97706' : '#dc2626';
      return (
        <svg width={size} height={size} viewBox="0 0 80 80">
          <circle cx={cx} cy={cy} r={r} fill="none" stroke="#e8e8e0" strokeWidth="6" />
          <circle cx={cx} cy={cy} r={r} fill="none" stroke={color} strokeWidth="6"
            strokeLinecap="round" strokeDasharray={`${filled} ${circ - filled}`}
            className="conf-arc" style={{ transformOrigin: '40px 40px', transform: 'rotate(-90deg)',
              transition: animated ? 'stroke-dasharray 1.5s cubic-bezier(0.4,0,0.2,1)' : 'none' }} />
          <text x={cx} y={cy + 5} textAnchor="middle" fontSize="14" fontWeight="700" fill={color}>
            {Math.round(confidence * 100)}%
          </text>
        </svg>
      );
    }

    function FarmerLocationModal({ t, lang, onSave, onClose, currentLocation }) {
      const [mode, setMode] = React.useState('choice'); // 'choice' | 'gps' | 'manual'
      const [gpsStatus, setGpsStatus] = React.useState('');
      const [states, setStates] = React.useState([]);
      const [districts, setDistricts] = React.useState([]);
      const [selectedState, setSelectedState] = React.useState(currentLocation?.state || '');
      const [selectedDistrict, setSelectedDistrict] = React.useState(currentLocation?.district || '');
      const [village, setVillage] = React.useState(currentLocation?.village || '');
      const [pincode, setPincode] = React.useState('');
      const [farmSize, setFarmSize] = React.useState(currentLocation?.farm_size_acres || 2.1);
      const [coords, setCoords] = React.useState(currentLocation ? { lat: currentLocation.latitude, lon: currentLocation.longitude } : null);
      const [locationInfo, setLocationInfo] = React.useState(null);
      const [saving, setSaving] = React.useState(false);
      const mapRef = React.useRef(null);
      const leafletMapRef = React.useRef(null);
      const markerRef = React.useRef(null);

      React.useEffect(() => {
        api('/api/locations/states').then(s => s && setStates(s));
      }, []);

      React.useEffect(() => {
        if (!selectedState) return;
        api(`/api/locations/districts?state=${encodeURIComponent(selectedState)}`).then(d => d && setDistricts(d));
        api(`/api/location/lookup?state=${encodeURIComponent(selectedState)}`).then(r => {
          if (r) setCoords({ lat: r.latitude, lon: r.longitude });
        });
      }, [selectedState]);

      React.useEffect(() => {
        if (!coords) return;
        api(`/api/location/info?latitude=${coords.lat}&longitude=${coords.lon}`).then(info => {
          if (info) setLocationInfo(info);
        });
      }, [coords]);

      // Initialize Leaflet map when mode is 'manual' or 'gps'
      React.useEffect(() => {
        if ((mode !== 'manual' && mode !== 'gps') || !mapRef.current) return;
        if (leafletMapRef.current) return; // Already initialized
        // Ensure Leaflet is loaded
        if (!window.L) return;
        const initialCoords = coords || { lat: 20.5937, lon: 78.9629 };
        const map = window.L.map(mapRef.current, { zoomControl: true }).setView([initialCoords.lat, initialCoords.lon], coords ? 12 : 5);
        window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
          maxZoom: 19
        }).addTo(map);
        const marker = window.L.marker([initialCoords.lat, initialCoords.lon], { draggable: true }).addTo(map);
        marker.on('dragend', e => {
          const ll = marker.getLatLng();
          setCoords({ lat: parseFloat(ll.lat.toFixed(6)), lon: parseFloat(ll.lng.toFixed(6)) });
        });
        map.on('click', e => {
          marker.setLatLng(e.latlng);
          setCoords({ lat: parseFloat(e.latlng.lat.toFixed(6)), lon: parseFloat(e.latlng.lng.toFixed(6)) });
        });
        markerRef.current = marker;
        leafletMapRef.current = map;
        setTimeout(() => map.invalidateSize(), 200);
      }, [mode]);

      // Update map marker when coords change
      React.useEffect(() => {
        if (!coords || !markerRef.current || !leafletMapRef.current) return;
        markerRef.current.setLatLng([coords.lat, coords.lon]);
        leafletMapRef.current.setView([coords.lat, coords.lon], 13);
      }, [coords]);

      const useGPS = () => {
        setMode('gps');
        setGpsStatus(t('locatingGPS'));
        if (!navigator.geolocation) {
          setGpsStatus(t('gpsDenied')); return;
        }
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = parseFloat(pos.coords.latitude.toFixed(6));
            const lon = parseFloat(pos.coords.longitude.toFixed(6));
            setCoords({ lat, lon });
            setGpsStatus('');
          },
          err => setGpsStatus(t('gpsDenied')),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      };

      const handlePinLookup = async () => {
        if (pincode.length === 6) {
          const r = await api(`/api/location/lookup?pincode=${pincode}`);
          if (r) setCoords({ lat: r.latitude, lon: r.longitude });
        }
      };

      const handleSave = async () => {
        if (!coords) return;
        setSaving(true);
        const body = {
          latitude: coords.lat, longitude: coords.lon,
          village: village || undefined,
          district: selectedDistrict || undefined,
          state: selectedState || undefined,
          pincode: pincode || undefined,
          farm_size_acres: parseFloat(farmSize) || 2.1
        };
        const res = await api('/api/farmers/1/location', {
          method: 'PUT',
          body: JSON.stringify(body)
        });
        setSaving(false);
        if (res && res.ok) {
          onSave({ ...body, locationInfo: res });
        }
      };

      const dgcaColor = locationInfo?.dgca_airspace?.status === 'GREEN' ? 'text-green-700 bg-green-50 border-green-200' : locationInfo?.dgca_airspace?.status === 'YELLOW' ? 'text-amber-700 bg-amber-50 border-amber-200' : 'text-red-700 bg-red-50 border-red-200';

      if (mode === 'choice') return (
        <div className="fixed inset-0 z-[9999] bg-ink-900/80 flex items-end justify-center" onClick={onClose}>
          <div className="bg-white w-full max-w-md rounded-t-3xl p-6 pb-10 shadow-2xl" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
              <h2 className="text-lg font-bold text-ink-800">📍 {t('setFarmLocation')}</h2>
              <button onClick={onClose} className="text-ink-400 hover:text-ink-600 text-xl">✕</button>
            </div>
            <button onClick={useGPS}
              className="w-full bg-brand-600 text-white rounded-app py-4 px-5 flex items-center gap-4 shadow-card mb-3 hover:bg-brand-700 active:scale-[0.98] transition-all">
              <span className="text-2xl">📍</span>
              <span>
                <span className="block font-bold text-base">{t('useCurrentGPS')}</span>
                <span className="block text-xs text-white/70 mt-0.5">High-accuracy GPS · Auto-detect state, district</span>
              </span>
            </button>
            <button onClick={() => setMode('manual')}
              className="w-full bg-paper-50 border border-paper-200 rounded-app py-4 px-5 flex items-center gap-4 shadow-card hover:bg-paper-100 active:scale-[0.98] transition-all">
              <span className="text-2xl">🗺️</span>
              <span>
                <span className="block font-bold text-base text-ink-800">{t('orEnterManually')}</span>
                <span className="block text-xs text-ink-500 mt-0.5">Select State, District, Village or PIN</span>
              </span>
            </button>
          </div>
        </div>
      );

      return (
        <div className="fixed inset-0 z-[9999] bg-ink-900/80 flex items-end justify-center">
          <div className="bg-white w-full max-w-md rounded-t-3xl shadow-2xl flex flex-col" style={{maxHeight:'95vh'}}>
            <div className="flex items-center justify-between px-5 pt-5 pb-3 border-b border-paper-100">
              <button onClick={() => setMode('choice')} className="text-ink-400 hover:text-ink-600 text-sm font-medium">← Back</button>
              <h2 className="text-base font-bold text-ink-800">📍 {t('setFarmLocation')}</h2>
              <button onClick={onClose} className="text-ink-400 hover:text-ink-600 text-xl">✕</button>
            </div>

            <div className="overflow-y-auto flex-1 px-5 py-4 space-y-4">
              {/* GPS Status */}
              {gpsStatus && (
                <div className="bg-brand-50 border border-brand-100 rounded-lg px-3 py-2 text-sm text-brand-700 flex items-center gap-2">
                  <span className="animate-spin">⟳</span> {gpsStatus}
                </div>
              )}

              {/* Coordinates display */}
              {coords && (
                <div className="bg-ink-800 text-white rounded-app px-4 py-3 flex items-center justify-between">
                  <div>
                    <p className="text-xs text-white/60 font-medium">GPS COORDINATES</p>
                    <p className="font-mono text-sm mt-0.5">{coords.lat.toFixed(5)}°N, {coords.lon.toFixed(5)}°E</p>
                  </div>
                  {locationInfo?.dgca_airspace && (
                    <span className={`text-xs font-bold px-2 py-1 rounded-full border ${dgcaColor}`}>
                      {locationInfo.dgca_airspace.status === 'GREEN' ? '✅ Green Zone' : locationInfo.dgca_airspace.status === 'YELLOW' ? '⚠️ Yellow' : '🚫 Red Zone'}
                    </span>
                  )}
                </div>
              )}

              {/* Interactive Map */}
              <div className="rounded-app overflow-hidden border border-paper-200" style={{height:220}}>
                <div ref={mapRef} style={{height:'100%', width:'100%'}} />
                {!window.L && <div className="h-full bg-brand-50 flex items-center justify-center text-sm text-brand-600">🗺️ {t('mapInstruction')}</div>}
              </div>
              <p className="text-xs text-ink-400 text-center -mt-2">{t('mapInstruction')}</p>

              {/* Manual Entry Fields */}
              {mode === 'manual' && (
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-semibold text-ink-500 block mb-1">{t('selectState')}</label>
                    <select value={selectedState} onChange={e => setSelectedState(e.target.value)}
                      className="w-full border border-paper-200 rounded-lg px-3 py-2.5 text-sm bg-white">
                      <option value="">-- {t('selectState')} --</option>
                      {states.map(s => <option key={s} value={s}>{s}</option>)}
                    </select>
                  </div>
                  {districts.length > 0 && (
                    <div>
                      <label className="text-xs font-semibold text-ink-500 block mb-1">{t('selectDistrict')}</label>
                      <select value={selectedDistrict} onChange={e => setSelectedDistrict(e.target.value)}
                        className="w-full border border-paper-200 rounded-lg px-3 py-2.5 text-sm bg-white">
                        <option value="">-- {t('selectDistrict')} --</option>
                        {districts.map(d => <option key={d} value={d}>{d}</option>)}
                      </select>
                    </div>
                  )}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-semibold text-ink-500 block mb-1">{t('villageOrTaluk')}</label>
                      <input type="text" value={village} onChange={e => setVillage(e.target.value)} placeholder="e.g. Lalgudi"
                        className="w-full border border-paper-200 rounded-lg px-3 py-2.5 text-sm" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-ink-500 block mb-1">{t('pinCode')}</label>
                      <div className="flex gap-1">
                        <input type="tel" maxLength={6} value={pincode} onChange={e => setPincode(e.target.value)} placeholder="621010"
                          className="flex-1 min-w-0 border border-paper-200 rounded-lg px-2 py-2.5 text-sm" />
                        <button onClick={handlePinLookup} className="px-2 py-2 bg-brand-600 text-white rounded-lg text-xs font-bold hover:bg-brand-700">Go</button>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="text-xs font-semibold text-ink-500 block mb-1">{t('farmSizeAcres')}</label>
                    <input type="number" min="0.1" max="500" step="0.1" value={farmSize} onChange={e => setFarmSize(e.target.value)}
                      className="w-full border border-paper-200 rounded-lg px-3 py-2.5 text-sm" />
                  </div>
                </div>
              )}

              {/* Zone Intelligence Panel */}
              {locationInfo && (
                <div className="space-y-2">
                  <h4 className="text-xs font-bold text-ink-500 uppercase tracking-wide">🌿 {t('farmZoneIntel') || 'Farm Zone Intelligence'}</h4>

                      <p className="text-xs font-semibold">DGCA Airspace</p>

        api(url).then(w => setWeather(w));
      }, [farmLocation]);
      useEffect(() => () => { if (timerRef.current) clearTimeout(timerRef.current); }, []);

      // Load location intelligence when farm location changes
      useEffect(() => {
        if (!farmLocation?.latitude) return;
        api(`/api/location/info?latitude=${farmLocation.latitude}&longitude=${farmLocation.longitude}`).then(info => {
          if (info) setLocationInfo(info);
        });
      }, [farmLocation]);

      // Fetch farmer data from API on mount
      useEffect(() => {
        api('/api/farmers/1').then(farmer => {
          if (farmer && farmer.latitude && farmer.longitude && farmer.latitude !== 10.7905) {
            // Use API farmer data if coordinates are non-default
            const loc = { latitude: farmer.latitude, longitude: farmer.longitude, district: farmer.district, state: farmer.state, village: farmer.village, farm_size_acres: farmer.farm_size_acres };
            setFarmLocation(prev => prev || loc);
          }
        });
      }, []);

      const handleLocationSave = (loc) => {
        setFarmLocation(loc);
        setLocationInfo(loc.locationInfo || null);
        try { localStorage.setItem('fs_farm_location', JSON.stringify(loc)); } catch(e) {}
        setShowLocationModal(false);
        showToast(t('locationSaved'));
      };

      const flushQueue = async () => {
        if (pendingQueue.length === 0) return;
        const items = pendingQueue.splice(0);
        saveQueue(); setQueued(0);
        let sent = 0;
        for (const item of items) {
          try {
            if (item.kind === 'crop_check') {
              const res = await fetch(API + '/api/detection/analyze', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ crop: item.crop, field_id: item.field_id }) });
              if (res.ok) {
                const det = await res.json();
                await fetch(API + `/api/detections/${det.detection_id}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                sent++;
              } else { pendingQueue.push(item); }
            } else {
              const res = await fetch(API + item.path, { method: item.method || 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(item.body || {}) });
              if (res.ok) sent++; else pendingQueue.push(item);
            }
          } catch (e) { pendingQueue.push(item); }
        }
        saveQueue(); setQueued(pendingQueue.length);
        if (sent > 0) {
          showToast(t('syncedToast'));
          api('/api/outbreaks?status=active').then(o => setDemoOutbreak((o && o[0]) || null));
        }
      };
      const goOnline = () => { setOnline(true); flushQueue(); };
      const goOffline = () => setOnline(false);
      useEffect(() => {
        window.addEventListener('online', goOnline);
        window.addEventListener('offline', goOffline);
        return () => { window.removeEventListener('online', goOnline); window.removeEventListener('offline', goOffline); };
      }, []);

      const voiceGuideRef = useRef(false);
      const speak = (text) => {
        if (!voiceGuideRef.current || !text) return;
        playAudioTone(520, 880, 0.08);
        playTTSAudio(text, lang, null, text);
      };
      const toggleVoiceGuide = () => {
        getAudioContext();
        playAudioTone(440, 880, 0.15);
        const next = !voiceGuideRef.current;
        voiceGuideRef.current = next;
        setVoiceGuide(next);
        if (!next) {
          if (_globalAudioPlayer) { try { _globalAudioPlayer.pause(); _globalAudioPlayer.currentTime = 0; } catch (e) {} }
          if (window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
          showToast(t('voiceGuideOff'));
          return;
        }
        showToast(t('voiceGuideOn'));
        const greeting = t('homeGreetingVoice') || 'FarmShield. Your farm is open. Click Check Crop to scan leaves.';
        setTimeout(() => playTTSAudio(greeting, lang, null, greeting), 120);
      };

      useEffect(() => {
        if (!voiceGuideRef.current) return;
        if (screen === 'scan') speak(`${t('checkingCrop')}. ${t('analyzing')}`);
        else if (screen === 'result') {
          const cName = scanRes?.crop || chosenCrop || 'Cotton';
          const pName = scanRes?.possible_pest || '';
          speak(`${t('possiblePest')}. ${cName}. ${pName}. ${t('risk')}: ${scanRes?.severity || t('riskHigh')}. ${t('recommend')}`);
        }
        else if (screen === 'help') speak(`${t('needHelp')}. ${t('helpDesc')}`);
        else if (screen === 'helpDone') speak(`${t('helpRequested')}. ${t('helpQueued')}`);
        else if (screen === 'healthy') {
          const cName = scanRes?.crop || chosenCrop || 'Crop';
          speak(`${t('healthyResult')}. ${cName}. ${t('healthyDesc')}`);
        }
        else if (screen === 'retake') speak(t('photoUnclear') + '. ' + t('retakeDesc'));
      }, [screen, voiceGuide]);

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };

      const startVoice = () => {
        getAudioContext();
        playAudioTone(520, 880, 0.12);
        let msg;
        if (hasAlert && demoOutbreak) {
          msg = `${t('possiblePest')}. ${t('possibleIssue')} ${demoOutbreak.affected_area_acres} ${t('acres')}. ${t('risk')}: ${t('riskHigh')}. ${t('recommend')}`;
        } else {
          msg = `${t('healthy')}. ${t('cropCotton')} ${t('cropStatus')}.`;
        }
        setVoiceState('listening');
        playTTSAudio(msg, lang, () => setVoiceState('idle'), msg);
      };

      const onPhotoPicked = (e) => {
        const f = e.target.files && e.target.files[0];
        e.target.value = '';
        if (!f) return;
        setChosenCrop('Cotton');
        const rd = new FileReader();
        rd.onload = () => { setPhoto(String(rd.result)); setScanRes(null); setScreen('scan'); };
        rd.readAsDataURL(f);
      };
      const photoInput = <input ref={fileRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={onPhotoPicked} />;
      const beginCheck = () => { if (fileRef.current) fileRef.current.click(); };

      const selectSampleLeaf = async (sample) => {
        haptic();
        setChosenCrop(sample.crop);
        setScanRes(null);
        try {
          const res = await fetch(sample.img);
          const blob = await res.blob();
          const rd = new FileReader();
          rd.onload = () => {
            setPhoto(String(rd.result));
            setScreen('scan');
          };
          rd.readAsDataURL(blob);
        } catch (err) {
          setPhoto(sample.img);
          setScreen('scan');
        }
      };

      useEffect(() => {
        if (screen === 'scan') {
          let alive = true;
          if (!photo) { setScreen(null); return; }
          if (!online || simOffline) {
            pendingQueue.push({ kind: 'crop_check', crop: 'Cotton', field_id: 3, saved_at: new Date().toISOString() });
            saveQueue(); setQueued(pendingQueue.length);
            setScreen('offlineSaved'); return;
          }
          (async () => {
            try {
              const fd = new FormData();
              fd.append('crop', chosenCrop || 'Cotton'); fd.append('field_id', '3');
              if (photo.startsWith('data:')) {
                const bin = atob(photo.split(',')[1]);
                const buf = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
                fd.append('file', new Blob([buf], { type: 'image/jpeg' }), 'leaf.jpg');
              } else {
                const imgRes = await fetch(photo);
                const blob = await imgRes.blob();
                fd.append('file', blob, 'leaf.jpg');
              }
              const res = await fetch(API + '/api/detection/analyze-image', { method: 'POST', body: fd });
              if (!alive) return;
              if (!res.ok) throw new Error('analyze failed');
              const det = await res.json();
              if (!alive) return;
              if (det.mode === 'VISUAL_CHECK') { setScanRes(det); setScreen('retake'); return; }
              const finalCrop = (chosenCrop && chosenCrop !== 'Cotton') ? chosenCrop : det.crop;
              if (det.healthy === true) { setScanRes({ ...det, crop: finalCrop }); setScreen('healthy'); return; }
              setScanRes({ ...det, crop: finalCrop });
              if (det.detection_id) {
                await fetch(API + `/api/detections/${det.detection_id}/confirm`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
              }
              await sleep(1800);
              if (alive) setScreen('result');
            } catch (e) {
              if (!alive) return;
              pendingQueue.push({ kind: 'crop_check', crop: chosenCrop || 'Cotton', field_id: 3, saved_at: new Date().toISOString() });
              saveQueue(); setQueued(pendingQueue.length);
              setScreen('offlineSaved');

          return () => { alive = false; };

              <div className="scanline"></div>
            </div>
            <p className="text-ink-700 font-medium">{t('analyzing')}</p>
            <div className="w-48 h-1.5 bg-paper-200 rounded-full overflow-hidden">
              <div className="h-full bg-brand-500 rounded-full" style={{width:'65%', transition:'width 0.3s', animation:'waveGrow 2s linear infinite'}}></div>
            </div>
            <p className="text-xs text-ink-400">Real CNN inference · PlantVillage MobileNetV2</p>
          </div>
        </div>
      );

      /* Screen: Result */
      if (screen === 'result') {
        const r = scanRes || { crop: 'Cotton', possible_pest: 'Possible Bollworm', severity: 'High', affected_area_acres: 2.1, confidence: 0.94, mode: 'DEMO_SIMULATION' };
        const sevCls = r.severity === 'High' ? 'text-red-600' : (r.severity === 'Medium' ? 'text-amber2-500' : 'text-brand-600');
        const sevTxt = r.severity === 'High' ? t('riskHigh') : (r.severity === 'Medium' ? (lang === 'ta' ? 'நடுத்தரம்' : 'Medium') : (lang === 'ta' ? 'குறைவு' : 'Low'));
        return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('possiblePest')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 overflow-y-auto p-4 space-y-4">
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <div className="flex items-center gap-2 text-amber2-500 mb-4">
                {I.alert('w-5 h-5')}
                <span className="font-semibold text-sm">{t('possiblePest')}</span>
              </div>
              <div className="flex items-center justify-between mb-4">
                {photo && <img src={photo} alt="" className="w-28 h-28 object-cover rounded-xl border border-paper-200"/>}
                <div className="flex flex-col items-center ml-4">
                  <p className="text-xs text-ink-400 mb-1 font-medium">Detection confidence</p>
                  <ConfidenceArc confidence={r.confidence || 0.94} size={80} />
                </div>
              </div>
              <div className="space-y-3">
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('crop')}</span><span className="font-semibold">{lang === 'ta' && r.crop === 'Cotton' ? t('cropCotton') : r.crop}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('possibleIssueLabel')}</span><span className="font-semibold">{lang === 'ta' && r.possible_pest === 'Possible Bollworm' ? t('possibleIssue') : r.possible_pest}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('risk')}</span><span className={`font-semibold ${sevCls}`}>{sevTxt}</span></div>
                <div className="flex justify-between text-sm"><span className="text-ink-400">{t('affectedArea')}</span><span className="font-semibold">{r.affected_area_acres} {t('acres')}</span></div>
              </div>
              {r.mode === 'REAL_MODEL' && <p className="mt-3 text-xs text-ink-400">{t('realModelNote')}</p>}
              {r.mode === 'DEMO_SIMULATION' && <p className="mt-3 text-xs text-amber2-500 bg-amber2-50 rounded-lg px-2 py-1">Prototype Simulation — not a real photo analysis</p>}
            </div>
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <h3 className="font-semibold text-ink-800 mb-1">{t('whatToDo')}</h3>
              <p className="text-sm text-ink-500 mb-4">{t('recommend')}</p>
              <PrimaryButton onClick={() => setScreen('help')}>{t('getHelp')}</PrimaryButton>
            </div>
          </div>
        </div>
        );
      }

      /* Screen: Healthy */
      if (screen === 'healthy') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('healthyResult')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-5">{I.check('w-8 h-8')}</div>
            {photo && <img src={photo} alt="" className="w-40 h-40 object-cover rounded-app border border-paper-200 mb-4"/>}
            <h2 className="text-lg font-semibold text-ink-800">{t('healthyResult')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('healthyDesc')}</p>
            <button onClick={beginCheck} className="mt-6 px-5 py-3 rounded-app bg-brand-50 text-brand-700 font-semibold text-sm border border-paper-200">{t('checkAnother')}</button>
          </div>
        </div>
      );

      /* Screen: Retake */
      if (screen === 'retake') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('photoUnclear')} onBack={() => setScreen(null)} />
          {photoInput}
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-amber2-100 text-amber2-500 flex items-center justify-center mb-5">{I.camera('w-8 h-8')}</div>
            {photo && <img src={photo} alt="" className="w-40 h-40 object-cover rounded-app border border-paper-200 mb-4 opacity-60"/>}
            <h2 className="text-lg font-semibold text-ink-800">{t('photoUnclear')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('retakeDesc')}</p>
            <div className="mt-6 w-full px-4"><PrimaryButton onClick={beginCheck}>{t('retake')}</PrimaryButton></div>
          </div>
        </div>
      );

      /* Screen: Help */
      if (screen === 'help') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('needHelp')} onBack={() => setScreen('result')} />
          <div className="flex-1 p-4">
            <div className="bg-white rounded-app border border-paper-200 shadow-card p-5">
              <p className="text-sm text-ink-500 mb-5">{t('helpDesc')}</p>
              <PrimaryButton onClick={requestHelp}>{t('requestHelp')}</PrimaryButton>
            </div>
          </div>
        </div>
      );

      /* Screen: Offline Saved */
      if (screen === 'offlineSaved') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('savedOffline')} onBack={() => setScreen(null)} />
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-amber2-100 text-amber2-500 flex items-center justify-center mb-5">{I.uploadCloud('w-8 h-8')}</div>
            <h2 className="text-lg font-semibold text-ink-800">{t('savedOffline')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('offlineQueued')}</p>
            <button onClick={() => setScreen(null)} className="mt-8 text-brand-600 font-semibold text-sm">{t('home')}</button>
          </div>
        </div>
      );

      /* Screen: Help Done */
      if (screen === 'helpDone') return (
        <div className="h-full flex flex-col bg-paper-100">
          <TopBar title={t('helpRequested')} onBack={() => setScreen(null)} />
          <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
            <div className="w-16 h-16 rounded-full bg-brand-50 text-brand-600 flex items-center justify-center mb-5 pulse-ring-anim">{I.check('w-8 h-8')}</div>
            <h2 className="text-lg font-semibold text-ink-800">{t('helpRequested')}</h2>
            <p className="text-sm text-ink-500 mt-2 max-w-xs">{t('helpQueued')}</p>
            <button onClick={() => setScreen(null)} className="mt-8 text-brand-600 font-semibold text-sm">{t('home')}</button>
          </div>
        </div>
      );

      /* Main app with tabs */
      const hasAlert = !!demoOutbreak;
      const pestRisk = weather ? (weather.pest_risk) : null;
      const riskColor = pestRisk === 'HIGH' ? 'text-red-600 bg-red-50' : pestRisk === 'MODERATE' ? 'text-amber2-500 bg-amber2-50' : 'text-brand-600 bg-brand-50';

      return (
        <div className={`h-full relative bg-paper-100 max-w-md mx-auto sm:border-x sm:border-paper-200 ${highContrast ? 'high-contrast' : ''}`}>
          {photoInput}
          {showLocationModal && (
            <FarmerLocationModal t={t} lang={lang} onSave={handleLocationSave} onClose={() => setShowLocationModal(false)} currentLocation={farmLocation} />
          )}
          {toast && (
            <div role="status" aria-live="polite" className="absolute top-3 inset-x-4 z-50 bg-ink-800 text-white text-sm rounded-app px-4 py-3 shadow-raised">{toast}</div>
          )}
          <div className="absolute inset-0 bottom-14 overflow-y-auto no-scrollbar">
            {tab === 'home' && <FarmerHome t={t} lang={lang} setLang={setLang} hasAlert={hasAlert} beginCheck={beginCheck} selectSampleLeaf={selectSampleLeaf} startVoice={startVoice} voiceState={voiceState} onExit={onExit} demoOutbreak={demoOutbreak} online={online} queued={queued} voiceGuide={voiceGuide} toggleVoiceGuide={toggleVoiceGuide} weather={weather} pestRisk={pestRisk} riskColor={riskColor} highContrast={highContrast} setHighContrast={setHighContrast} haptic={haptic} farmLocation={farmLocation} locationInfo={locationInfo} onSetLocation={() => { haptic(); setShowLocationModal(true); }} />}
            {tab === 'farm' && <FarmerFarm t={t} hasAlert={hasAlert} farmLocation={farmLocation} locationInfo={locationInfo} onSetLocation={() => { haptic(); setShowLocationModal(true); }} weather={weather} pestRisk={pestRisk} />}
            {tab === 'alerts' && <FarmerAlerts t={t} demoOutbreak={demoOutbreak} />}
            {tab === 'profile' && <FarmerProfile t={t} lang={lang} setLang={setLang} online={online} simOffline={simOffline} farmLocation={farmLocation} locationInfo={locationInfo} onSetLocation={() => { haptic(); setShowLocationModal(true); }} setSimOffline={v => { setSimOffline(v); if (v) setOnline(false); else { setOnline(true); flushQueue(); } }} />}
          </div>
          <BottomNav tab={tab} setTab={setTab} lang={lang} />
        </div>
      );
    }

    function FarmerHome({ t, lang, setLang, hasAlert, beginCheck, selectSampleLeaf, startVoice, voiceState, onExit, demoOutbreak, online, queued, voiceGuide, toggleVoiceGuide, weather, pestRisk, riskColor, highContrast, setHighContrast, haptic, farmLocation, locationInfo, onSetLocation }) {
      const locationLabel = farmLocation
        ? `${farmLocation.village ? farmLocation.village + ', ' : ''}${farmLocation.district || ''}, ${farmLocation.state || ''}`
        : t('location');

        <div role="main" aria-label="FarmShield Farmer App">
          <div className="bg-white border-b border-paper-200 px-4 pt-4 pb-4">

                </button>
                <button onClick={() => { haptic(); setHighContrast(c => !c); }} aria-label="Toggle high contrast mode"
                  className={`p-1.5 rounded-lg ${highContrast ? 'text-amber2-500 bg-amber2-50' : 'text-ink-400 hover:bg-paper-100'}`}>
                  {I.accessibility('w-5 h-5')}
                </button>
                <button onClick={onExit} className="p-1.5 rounded-lg text-ink-400 hover:bg-paper-100" aria-label="Exit">{I.settings('w-5 h-5')}</button>

            </div>
            <p className="text-sm text-ink-400">{t('greeting')}</p>

              <span className="text-xs text-ink-400 flex items-center gap-1">{I.mapPin('w-3.5 h-3.5 text-brand-500')} <span className="text-brand-600 font-medium">{locationLabel}</span> · {areaLabel}</span>
              <span className="text-[10px] text-ink-300 group-hover:text-brand-500 transition-colors">[{t('changeFarmLocation') || 'change'}]</span>
            </button>

              </div>

          </div>

          <div className="p-4 space-y-4 pb-6">

              <div className={`rounded-app border px-4 py-3 flex items-center justify-between ${pestRisk === 'HIGH' ? 'bg-red-50 border-red-200' : 'bg-white border-paper-200'}`}>
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{pestRisk === 'HIGH' ? '🌡️' : '🌤️'}</span>
                  <div>
                    <p className="text-xs font-semibold text-ink-600">{t('weatherAdvisory')}</p>
                    <p className="text-xs text-ink-500">{weather.temperature_c}°C · {weather.humidity_percent}% RH · {weather.wind_speed_kmh} kph</p>
                  </div>
                </div>
                <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${riskColor}`}>{t('pestRisk')}: {pestRisk}</span>
              </div>

            {/* Status card */}
            {hasAlert ? (
              <div className="bg-white rounded-app border border-paper-200 shadow-card p-4 border-l-4 border-l-red-500">
                <div className="flex items-center gap-2 text-red-600 mb-2">{I.alert('w-5 h-5')}<span className="font-semibold text-sm">{t('possiblePest')}</span></div>
                <p className="text-sm text-ink-600">{demoOutbreak ? `${t('possibleIssue')} · ${demoOutbreak.affected_area_acres} ${t('acres')}` : `2.1 ${t('acres')}`} · {t('highRisk')}</p>
                <button onClick={beginCheck} className="mt-3 text-sm font-semibold text-brand-600">{t('checkCrop')} →</button>

          ev('Treatment Agent', `Precision spray started — ${precisionL}L target vs ${blanketL}L conventional`, '💧');
          // Animate litre counter
          const savedTimer = setInterval(() => {
            setLitresSaved(v => { const next = Math.min(v + 0.25, totalSaved); return Math.round(next * 10) / 10; });
          }, 150);
          setLitresTimer(savedTimer);
          await sleep(2800);
          clearInterval(savedTimer);
          setLitresSaved(totalSaved);
          await api(`/api/missions/${mission.mission_id}/status?action=complete`, { method:'POST' });
          ev('Treatment Agent', `✓ Treatment complete — ${activeScenario.affected_area_acres} acres, ${precisionL}L precision vs ${blanketL}L blanket (−${pctSaved}%)`, '✅');
